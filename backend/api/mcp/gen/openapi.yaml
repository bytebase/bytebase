          type: string
          title: database
          description: |-
            The database name to execute the query.
             Format: instances/{instance}/databases/{databaseName} or projects/{project}/instances/{instance}/databases/{databaseName}
        creator:
          type: string
          title: creator
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
        statement:
          type: string
          title: statement
        error:
          type:
            - string
            - "null"
          title: error
        duration:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: duration
        type:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.QueryHistory.Type'
          title: type
      title: QueryHistory
      additionalProperties: false
    bytebase.v1.QueryHistory.Type:
      type: string
      title: Type
      enum:
        - TYPE_UNSPECIFIED
        - QUERY
        - EXPORT
    bytebase.v1.QueryOption:
      type: object
      properties:
        redisRunCommandsOn:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.QueryOption.RedisRunCommandsOn'
          title: redis_run_commands_on
        explainFormat:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.QueryOption.ExplainFormat'
          title: explain_format
      title: QueryOption
      additionalProperties: false
    bytebase.v1.QueryOption.ExplainFormat:
      type: string
      title: ExplainFormat
      enum:
        - EXPLAIN_FORMAT_UNSPECIFIED
        - TEXT
        - JSON
        - XML
      description: |-
        Which explain output the caller wants, for an explain request.

         Leave it unspecified for the engine's own default, which is the only
         output most engines have. Naming a format an engine cannot produce is
         INVALID_ARGUMENT rather than a silent fallback, as is any explain request
         against an engine that has no explain at all.
    bytebase.v1.QueryOption.RedisRunCommandsOn:
      type: string
      title: RedisRunCommandsOn
      enum:
        - REDIS_RUN_COMMANDS_ON_UNSPECIFIED
        - SINGLE_NODE
        - ALL_NODES
    bytebase.v1.QueryRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            The name is the database resource name to execute the query against.
             Format: instances/{instance}/databases/{databaseName} or
             projects/{project}/instances/{instance}/databases/{databaseName}
        statement:
          type: string
          title: statement
          description: The SQL statement to execute.
        limit:
          type: integer
          title: limit
          format: int32
          description: The maximum number of rows to return.
        dataSourceId:
          type: string
          title: data_source_id
          description: |-
            The id of data source.
             If omitted, Query resolves the data source server-side by using the single
             read-only data source when exactly one exists, or the admin data source
             otherwise. It can also be set explicitly to query the admin data source or
             a specific read-only data source.
        explain:
          type: boolean
          title: explain
          description: Explain the statement.
        schema:
          type:
            - string
            - "null"
          title: schema
          description: |-
            The default schema to search objects. Equals to the current schema in
             Oracle and search path in Postgres.
        queryOption:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.QueryOption'
          title: query_option
        container:
          type:
            - string
            - "null"
          title: container
          description: |-
            Container is the container name to execute the query against, used for
             CosmosDB only.
      title: QueryRequest
      additionalProperties: false
    bytebase.v1.QueryResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.QueryResult'
          title: results
          description: The query results.
        appliedAccessGrant:
          type: string
          title: applied_access_grant
          description: |-
            The just-in-time access grant applied to this query, if any.
             Format: projects/{project}/accessGrants/{accessGrant}.
             Empty when the user was authorized through normal ACL rather than a grant.
      title: QueryResponse
      additionalProperties: false
    bytebase.v1.QueryResult:
      type: object
      anyOf:
        - type: object
          properties:
            commandError:
              allOf:
                - $ref: '#/components/schemas/bytebase.v1.QueryResult.CommandError'
              title: command_error
          title: command_error
        - type: object
          properties:
            permissionDenied:
              allOf:
                - $ref: '#/components/schemas/bytebase.v1.PermissionDeniedDetail'
              title: permission_denied
          title: permission_denied
        - type: object
          properties:
            postgresError:
              allOf:
                - $ref: '#/components/schemas/bytebase.v1.QueryResult.PostgresError'
              title: postgres_error
          title: postgres_error
        - type: object
          properties:
            syntaxError:
              allOf:
                - $ref: '#/components/schemas/bytebase.v1.QueryResult.SyntaxError'
              title: syntax_error
          title: syntax_error
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - commandError
              - required:
                  - permissionDenied
              - required:
                  - postgresError
              - required:
                  - syntaxError
          - not:
              oneOf:
                - required:
                    - commandError
                - required:
                    - permissionDenied
                - required:
                    - postgresError
                - required:
                    - syntaxError
      properties:
        columnNames:
          type: array
          items:
            type: string
          title: column_names
          description: Column names of the query result.
        columnTypeNames:
          type: array
          items:
            type: string
          title: column_type_names
          description: |-
            Column types of the query result.
             The types come from the Golang SQL driver.
        rows:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.QueryRow'
          title: rows
          description: Rows of the query result.
        rowsCount:
          type: string
          title: rows_count
          format: int64
        error:
          type: string
          title: error
          description: The error message if the query failed.
        latency:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: latency
          description: The time it takes to execute the query.
        statement:
          type: string
          title: statement
          description: The query statement for the result.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.QueryResult.Message'
          title: messages
          description: |-
            Informational or debug messages returned by the database engine during query execution.
             Examples include PostgreSQL's RAISE NOTICE, MSSQL's PRINT, or Oracle's DBMS_OUTPUT.PUT_LINE.
        masked:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.MaskingReason'
          title: masked
          description: Masking reasons for each column (empty for non-masked columns).
      title: QueryResult
    bytebase.v1.QueryResult.CommandError:
      type: object
      properties:
        commandType:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.QueryResult.CommandError.Type'
          title: command_type
          description: Disallowed command_type.
      title: CommandError
      additionalProperties: false
      description: |-
        Permission denied with resource information or disallowed command_type.
         Either resources or command_type is available.
    bytebase.v1.QueryResult.CommandError.Type:
      type: string
      title: Type
      enum:
        - TYPE_UNSPECIFIED
        - DDL
        - DML
        - NON_READ_ONLY
    bytebase.v1.QueryResult.Message:
      type: object
      properties:
        level:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.QueryResult.Message.Level'
          title: level
        content:
          type: string
          title: content
      title: Message
      additionalProperties: false
    bytebase.v1.QueryResult.Message.Level:
      type: string
      title: Level
      enum:
        - LEVEL_UNSPECIFIED
        - INFO
        - WARNING
        - DEBUG
        - LOG
        - NOTICE
        - EXCEPTION
    bytebase.v1.QueryResult.PostgresError:
      type: object
      properties:
        severity:
          type: string
          title: severity
        code:
          type: string
          title: code
        message:
          type: string
          title: message
        detail:
          type: string
          title: detail
        hint:
          type: string
          title: hint
        position:
          type: integer
          title: position
          format: int32
        internalPosition:
          type: integer
          title: internal_position
          format: int32
        internalQuery:
          type: string
          title: internal_query
        where:
          type: string
          title: where
        schemaName:
          type: string
          title: schema_name
        tableName:
          type: string
          title: table_name
        columnName:
          type: string
          title: column_name
        dataTypeName:
          type: string
          title: data_type_name
        constraintName:
          type: string
          title: constraint_name
        file:
          type: string
          title: file
        line:
          type: integer
          title: line
          format: int32
        routine:
          type: string
          title: routine
      title: PostgresError
      additionalProperties: false
      description: |-
        refer https://www.postgresql.org/docs/11/protocol-error-fields.html
         for field description.
    bytebase.v1.QueryResult.SyntaxError:
      type: object
      properties:
        startPosition:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Position'
          title: start_position
          description: Position information for highlighting in editor
      title: SyntaxError
      additionalProperties: false
      description: Syntax error with position information for editor highlighting
    bytebase.v1.QueryRow:
      type: object
      properties:
        values:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.RowValue'
          title: values
          description: Row values of the query result.
      title: QueryRow
      additionalProperties: false
    bytebase.v1.Range:
      type: object
      properties:
        start:
          type: integer
          title: start
          format: int32
          description: Start index (inclusive).
        end:
          type: integer
          title: end
          format: int32
          description: End index (exclusive).
      title: Range
      additionalProperties: false
      description: |-
        Range represents a span within a text or sequence.
         Whether the indices are byte offsets or character indices depends on the context.
         Check the documentation of the field using Range for specific semantics.
    bytebase.v1.RefreshRequest:
      type: object
      title: RefreshRequest
      additionalProperties: false
      description: Request to refresh the access token.
    bytebase.v1.RefreshResponse:
      type: object
      title: RefreshResponse
      additionalProperties: false
      description: Response from refreshing the access token.
    bytebase.v1.RegenerateRecoveryCodesRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          maxLength: 260
          description: 'Format: users/{email}. Must be the caller''s own name.'
      title: RegenerateRecoveryCodesRequest
      additionalProperties: false
    bytebase.v1.RegenerateRecoveryCodesResponse:
      type: object
      properties:
        recoveryCodes:
          type: array
          items:
            type: string
          title: recovery_codes
          description: The pending recovery codes, shown once for the caller to save.
        pendingVersion:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: pending_version
          description: Identifies this mint; see StartMFAEnrollmentResponse.pending_version.
      title: RegenerateRecoveryCodesResponse
      additionalProperties: false
    bytebase.v1.RejectIssueRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            The name of the issue to add a rejection.
             Format: projects/{project}/issues/{issue}
        comment:
          type: string
          title: comment
          description: The comment explaining the rejection decision.
      title: RejectIssueRequest
      additionalProperties: false
    bytebase.v1.Release:
      type: object
      properties:
        name:
          type: string
          title: name
          description: 'Format: projects/{project}/releases/{release}'
        category:
          type: string
          title: category
          description: |-
            Category extracted from release name (e.g., "webapp", "analytics").
             Set by Bytebase action during release creation.
        files:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.Release.File'
          title: files
          description: The SQL files included in the release.
        vcsSource:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Release.VCSSource'
          title: vcs_source
          description: The version control source of the release.
        creator:
          type: string
          title: creator
          description: 'Format: users/hello@world.com'
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
        state:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.State'
          title: state
          description: The lifecycle state of the release.
        type:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Release.Type'
          title: type
          description: The type of schema change for all files in this release.
      title: Release
      additionalProperties: false
    bytebase.v1.Release.File:
      type: object
      properties:
        path:
          type: string
          title: path
          description: The path of the file. e.g., `2.2/V0001_create_table.sql`.
        version:
          type: string
          title: version
          description: The version identifier for the file.
        sheet:
          type: string
          title: sheet
          description: |-
            For inputs, we must either use `sheet` or `statement`.
             For outputs, we always use `sheet`. `statement` is the preview of the sheet content.

             The sheet that holds the content.
             Format: projects/{project}/sheets/{sheet}
        statement:
          type: string
          title: statement
          format: byte
          description: The raw SQL statement content.
        sheetSha256:
          type: string
          title: sheet_sha256
          description: The SHA256 hash value of the sheet content or the statement.
      title: File
      additionalProperties: false
      description: A SQL file in a release.
    bytebase.v1.Release.Type:
      type: string
      title: Type
      enum:
        - TYPE_UNSPECIFIED
        - VERSIONED
        - DECLARATIVE
      description: The type of schema change.
    bytebase.v1.Release.VCSSource:
      type: object
      properties:
        vcsType:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.VCSType'
          title: vcs_type
          description: The type of VCS.
        url:
          type: string
          title: url
          description: The url link to the e.g., GitHub commit or pull request.
      title: VCSSource
      additionalProperties: false
      description: Version control system source information.
    bytebase.v1.RemoveDataSourceRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            The name of the instance to remove a data source from.
             Format: instances/{instance} or projects/{project}/instances/{instance}
        dataSource:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.DataSource'
          title: data_source
          description: |-
            Identified by data source ID.
             Only READ_ONLY data source can be removed.
      title: RemoveDataSourceRequest
      additionalProperties: false
    bytebase.v1.RemoveWebhookRequest:
      type: object
      properties:
        webhook:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Webhook'
          title: webhook
          description: The webhook to remove. Identified by its url.
      title: RemoveWebhookRequest
      additionalProperties: false
    bytebase.v1.RequestIssueRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            The name of the issue to request a issue.
             Format: projects/{project}/issues/{issue}
        comment:
          type: string
          title: comment
          description: The comment explaining the request.
      title: RequestIssueRequest
      additionalProperties: false
    bytebase.v1.RequestMetadata:
      type: object
      properties:
        callerIp:
          type: string
          title: caller_ip
          description: The IP address of the request originator.
        callerSuppliedUserAgent:
          type: string
          title: caller_supplied_user_agent
          description: |-
            The user agent string provided by the caller.
             This is supplied by the client and is not authenticated.
      title: RequestMetadata
      additionalProperties: false
      description: Metadata about the incoming request.
    bytebase.v1.RequestPasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          title: email
          maxLength: 254
          description: |-
            The email address of the account to reset.
             Bounded so an oversized identity is refused at the edge before any
             handler runs; the login-attempt lockout keys rows by this value.
        workspace:
          type:
            - string
            - "null"
          title: workspace
          maxLength: 256
          description: |-
            Optional workspace context captured at send time, used to locate the EMAIL setting,
             and later (at verify time) for signup gate checks and workspace assignment.
             Unset for SaaS brand-new signup (no workspace exists yet).
             Format: workspaces/{workspace}
      title: RequestPasswordResetRequest
      additionalProperties: false
    bytebase.v1.RequestReauthCodeRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          maxLength: 260
          description: 'Format: users/{email}. Must be the caller''s own name.'
      title: RequestReauthCodeRequest
      additionalProperties: false
    bytebase.v1.ResetPasswordRequest:
      type: object
      properties:
        email:
          type: string
          title: email
          maxLength: 254
          description: |-
            The email address of the account.
             Bounded so an oversized identity is refused at the edge before any
             handler runs; the login-attempt lockout keys rows by this value.
        code:
          type: string
          title: code
          maxLength: 64
          description: The 6-digit code from the reset email.
        newPassword:
          type: string
          title: new_password
          description: |
            The new password to set.
            string.max_bytes = 72
      title: ResetPasswordRequest
      additionalProperties: false
    bytebase.v1.Restriction:
      type: object
      properties:
        disallowSignup:
          type: boolean
          title: disallow_signup
          description: Whether self-service user signup is disabled.
        disallowPasswordSignin:
          type: boolean
          title: disallow_password_signin
          description: Whether password sign-in is disabled for all end users.
        passwordRestriction:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.WorkspaceProfileSetting.PasswordRestriction'
          title: password_restriction
          description: Password complexity and restriction requirements.
        allowEmailCodeSignin:
          type: boolean
          title: allow_email_code_signin
          description: Whether email + 6-digit code signin is enabled for this workspace.
        passwordResetEnabled:
          type: boolean
          title: password_reset_enabled
          description: |-
            Whether password reset via email is available for this workspace.
             True when the workspace (or deployment) has an email setting configured.
      title: Restriction
      additionalProperties: false
    bytebase.v1.RetryIssueApprovalRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            The name of the issue whose approval-finding should be retried.
             Format: projects/{project}/issues/{issue}
      title: RetryIssueApprovalRequest
      additionalProperties: false
    bytebase.v1.ReviewConfig:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            The name of the SQL review config.
             Format: reviewConfigs/{reviewConfig}
        title:
          type: string
          title: title
          maxLength: 200
          description: The title of the review configuration.
        enabled:
          type: boolean
          title: enabled
          description: Whether the review configuration is enabled.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.SQLReviewRule'
          title: rules
          description: The SQL review rules to enforce.
        resources:
          type: array
          items:
            type: string
          title: resources
          description: |-
            Resources using the config.
             Format: {resource}/{resource id}, e.g., environments/test.
      title: ReviewConfig
      additionalProperties: false
    bytebase.v1.ReviewRun:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            Format: projects/{project}/issues/{issue}/reviewRuns/{reviewRun}
             The {reviewRun} id is the reviewer: "rule" or "guideline". The name
             addresses a slot, not an execution.
        type:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.ReviewRun.Type'
          title: type
          description: Derived from the name.
        status:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.ReviewRun.Status'
          title: status
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: When the current run was triggered. Reset on every re-run.
        endTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: end_time
          description: |-
            When the run reached a terminal status. Unset while AVAILABLE or
             RUNNING.
        error:
          type: string
          title: error
          description: |-
            Fatal execution error, set if and only if status is FAILED: the review
             failed to execute (a platform problem, never the SQL — SQL problems are
             review results on a DONE run).
      title: ReviewRun
      additionalProperties: false
    bytebase.v1.ReviewRun.Status:
      type: string
      title: Status
      enum:
        - STATUS_UNSPECIFIED
        - AVAILABLE
        - RUNNING
        - DONE
        - FAILED
      description: |-
        States follow task_run, minus PENDING (review needs no admission
         control) and minus CANCELED (runs are side-effect-free until the fenced
         completion transaction, so re-running supersedes instead of canceling).
    bytebase.v1.ReviewRun.Type:
      type: string
      title: Type
      enum:
        - TYPE_UNSPECIFIED
        - RULE
        - GUIDELINE
    bytebase.v1.Revision:
      type: object
      properties:
        name:
          type: string
          title: name
          description: 'Format: instances/{instance}/databases/{database}/revisions/{revision} or projects/{project}/instances/{instance}/databases/{database}/revisions/{revision}'
        release:
          type: string
          title: release
          description: |-
            Format: projects/{project}/releases/{release}
             Can be empty.
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
        deleter:
          type: string
          title: deleter
          description: |-
            Format: users/hello@world.com
             Can be empty.
        deleteTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: delete_time
          description: Can be empty.
        file:
          type: string
          title: file
          description: |-
            Format: projects/{project}/releases/{release}/files/{file_path}
             The file_path segment is URL-encoded since file paths may contain "/".
             Can be empty.
        version:
          type: string
          title: version
          description: The schema version string for this revision.
        sheet:
          type: string
          title: sheet
          description: |-
            The sheet that holds the content.
             Format: projects/{project}/sheets/{sheet}
        sheetSha256:
          type: string
          title: sheet_sha256
          description: The SHA256 hash value of the sheet.
        taskRun:
          type: string
          title: task_run
          description: |-
            The task run associated with the revision.
             Can be empty.
             Format: projects/{project}/plans/{plan}/rollout/stages/{stage}/tasks/{task}/taskRuns/{taskRun}
        type:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Revision.Type'
          title: type
          description: The type of the revision.
      title: Revision
      additionalProperties: false
    bytebase.v1.Revision.Type:
      type: string
      title: Type
      enum:
        - TYPE_UNSPECIFIED
        - VERSIONED
        - DECLARATIVE
      description: The type of schema revision.
    bytebase.v1.RevokeAccessGrantRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            The name of the access grant to revoke.
             Format: projects/{project}/accessGrants/{access_grant}
      title: RevokeAccessGrantRequest
      additionalProperties: false
    bytebase.v1.RiskLevel:
      type: string
      title: RiskLevel
      enum:
        - RISK_LEVEL_UNSPECIFIED
        - LOW
        - MODERATE
        - HIGH
      description: RiskLevel is the risk level.
    bytebase.v1.Role:
      type: object
      properties:
        name:
          type: string
          title: name
          description: 'Resource name. Format: roles/{role}'
        title:
          type: string
          title: title
          maxLength: 200
          description: Human-readable title.
        description:
          type: string
          title: description
          maxLength: 1000
          description: Optional description of the role.
        permissions:
          type: array
          items:
            type: string
          title: permissions
          description: List of permission identifiers granted by this role.
        type:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Role.Type'
          title: type
          description: Role type indicating if it's built-in or custom.
      title: Role
      additionalProperties: false
