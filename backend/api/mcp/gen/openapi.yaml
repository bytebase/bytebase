          title: email
          description: The unique email for the group.
      title: Group
      additionalProperties: false
      description: A group of users within the workspace.
    bytebase.v1.GroupMember:
      type: object
      properties:
        member:
          type: string
          title: member
          description: |-
            Member is the principal who belong to this group.

             Format: users/hello@world.com
        role:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.GroupMember.Role'
          title: role
          description: The member's role in the group.
      title: GroupMember
      additionalProperties: false
      description: A member of a group with a role.
    bytebase.v1.GroupMember.Role:
      type: string
      title: Role
      enum:
        - ROLE_UNSPECIFIED
        - OWNER
        - MEMBER
      description: The role of a group member.
    bytebase.v1.IamPolicy:
      type: object
      properties:
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.Binding'
          title: bindings
          description: |-
            Collection of binding.
             A binding binds one or more project members to a single project role.
        etag:
          type: string
          title: etag
          description: |-
            The current etag of the policy, returned by GetIamPolicy and SetIamPolicy.
             Sending it back on SetIamPolicy makes the write conditional: if the policy
             changed since the read, the call returns ABORTED. Omitting it applies the
             write unconditionally, overwriting any concurrent change (AIP-154).
      title: IamPolicy
      additionalProperties: false
      description: IAM policy that binds members to roles.
    bytebase.v1.IdentityProvider:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            The name of the identity provider.
             Format: idps/{idp}
        title:
          type: string
          title: title
          maxLength: 200
          description: The display title of the identity provider.
        domain:
          type: string
          title: domain
          description: The domain for email matching when using this identity provider.
        type:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.IdentityProviderType'
          title: type
          description: The type of identity provider protocol.
        config:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.IdentityProviderConfig'
          title: config
          description: The configuration details for the identity provider.
      title: IdentityProvider
      additionalProperties: false
    bytebase.v1.IdentityProviderConfig:
      type: object
      anyOf:
        - type: object
          properties:
            ldapConfig:
              allOf:
                - $ref: '#/components/schemas/bytebase.v1.LDAPIdentityProviderConfig'
              title: ldap_config
              description: LDAP protocol configuration.
          title: ldap_config
        - type: object
          properties:
            oauth2Config:
              allOf:
                - $ref: '#/components/schemas/bytebase.v1.OAuth2IdentityProviderConfig'
              title: oauth2_config
              description: OAuth2 protocol configuration.
          title: oauth2_config
        - type: object
          properties:
            oidcConfig:
              allOf:
                - $ref: '#/components/schemas/bytebase.v1.OIDCIdentityProviderConfig'
              title: oidc_config
              description: OIDC protocol configuration.
          title: oidc_config
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - ldapConfig
              - required:
                  - oauth2Config
              - required:
                  - oidcConfig
          - not:
              oneOf:
                - required:
                    - ldapConfig
                - required:
                    - oauth2Config
                - required:
                    - oidcConfig
      title: IdentityProviderConfig
    bytebase.v1.IdentityProviderContext:
      type: object
      anyOf:
        - type: object
          properties:
            oauth2Context:
              allOf:
                - $ref: '#/components/schemas/bytebase.v1.OAuth2IdentityProviderContext'
              title: oauth2_context
              description: OAuth2 authentication context.
          title: oauth2_context
        - type: object
          properties:
            oidcContext:
              allOf:
                - $ref: '#/components/schemas/bytebase.v1.OIDCIdentityProviderContext'
              title: oidc_context
              description: OpenID Connect authentication context.
          title: oidc_context
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - oauth2Context
              - required:
                  - oidcContext
          - not:
              oneOf:
                - required:
                    - oauth2Context
                - required:
                    - oidcContext
      title: IdentityProviderContext
      description: Context for identity provider authentication.
    bytebase.v1.IdentityProviderType:
      type: string
      title: IdentityProviderType
      enum:
        - IDENTITY_PROVIDER_TYPE_UNSPECIFIED
        - OAUTH2
        - OIDC
        - LDAP
    bytebase.v1.IndexMetadata:
      type: object
      properties:
        name:
          type: string
          title: name
          description: The name is the name of an index.
        expressions:
          type: array
          items:
            type: string
          title: expressions
          description: |-
            The expressions are the ordered columns or expressions of an index.
             This could refer to a column or an expression.
        keyLength:
          type: array
          items:
            type: string
            format: int64
          title: key_length
          description: |-
            The key_lengths are the ordered key lengths of an index.
             If the key length is not specified, it's -1.
        descending:
          type: array
          items:
            type: boolean
          title: descending
          description: The descending is the ordered descending of an index.
        type:
          type: string
          title: type
          description: The type is the type of an index.
        unique:
          type: boolean
          title: unique
          description: The unique is whether the index is unique.
        primary:
          type: boolean
          title: primary
          description: The primary is whether the index is a primary key index.
        visible:
          type: boolean
          title: visible
          description: The visible is whether the index is visible.
        comment:
          type: string
          title: comment
          description: The comment is the comment of an index.
        definition:
          type: string
          title: definition
          description: The definition of an index.
        parentIndexSchema:
          type: string
          title: parent_index_schema
          description: The schema name of the parent index.
        parentIndexName:
          type: string
          title: parent_index_name
          description: The index name of the parent index.
        granularity:
          type: string
          title: granularity
          format: int64
          description: The number of granules in the block. It's a ClickHouse specific field.
        isConstraint:
          type: boolean
          title: is_constraint
          description: |-
            It's a PostgreSQL specific field.
             The unique constraint and unique index are not the same thing in PostgreSQL.
        spatialConfig:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.SpatialIndexConfig'
          title: spatial_config
          description: Spatial index configuration for spatial databases like SQL Server, PostgreSQL with PostGIS, etc.
        opclassNames:
          type: array
          items:
            type: string
          title: opclass_names
          description: |-
            https://www.postgresql.org/docs/current/catalog-pg-opclass.html
             Name of the operator class for each column. (PostgreSQL specific).
        opclassDefaults:
          type: array
          items:
            type: boolean
          title: opclass_defaults
          description: True if the operator class is the default. (PostgreSQL specific).
      title: IndexMetadata
      additionalProperties: false
      description: IndexMetadata is the metadata for indexes.
    bytebase.v1.Instance:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            The name of the instance.
             Format: instances/{instance} or projects/{project}/instances/{instance}
        state:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.State'
          title: state
          description: The lifecycle state of the instance.
        title:
          type: string
          title: title
          maxLength: 200
          description: The display title of the instance.
        engine:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Engine'
          title: engine
          description: The database engine type.
        engineVersion:
          type: string
          title: engine_version
          description: The version of the database engine.
        externalLink:
          type: string
          title: external_link
          description: External URL to the database instance console.
        dataSources:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.DataSource'
          title: data_sources
          description: Data source configurations for connecting to the instance.
        environment:
          type:
            - string
            - "null"
          title: environment
          description: |-
            The environment resource.
             Format: environments/prod where prod is the environment resource ID.
        activation:
          type: boolean
          title: activation
          description: Whether the instance is activated for use.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.InstanceRole'
          title: roles
          description: Database roles available in this instance.
        syncInterval:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: sync_interval
          description: How often the instance is synced.
        syncDatabases:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.SyncDatabases'
          title: sync_databases
          description: |-
            Enable sync for following databases.
             Not set means sync all schemas & databases.
        lastSyncTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_sync_time
          description: The last time the instance was synced.
        labels:
          type: object
          title: labels
          additionalProperties:
            type: string
            title: value
          description: |-
            Labels are key-value pairs that can be attached to the instance.
             For example, { "org_group": "infrastructure", "environment": "production" }
      title: Instance
      additionalProperties: false
    bytebase.v1.InstanceResource:
      type: object
      properties:
        title:
          type: string
          title: title
          description: The display title of the instance.
        engine:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Engine'
          title: engine
          description: The database engine type.
        engineVersion:
          type: string
          title: engine_version
          description: The version of the database engine.
        dataSources:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.DataSource'
          title: data_sources
          description: Data source configurations for the instance.
        activation:
          type: boolean
          title: activation
          description: Whether the instance is activated.
        name:
          type: string
          title: name
          description: |-
            The name of the instance.
             Format: instances/{instance} or projects/{project}/instances/{instance}
        environment:
          type:
            - string
            - "null"
          title: environment
          description: |-
            The environment resource.
             Format: environments/prod where prod is the environment resource ID.
      title: InstanceResource
      additionalProperties: false
    bytebase.v1.InstanceRole:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            The name of the role.
             Format: instances/{instance}/roles/{role} or projects/{project}/instances/{instance}/roles/{role}
             The role name is the unique name for the role.
        roleName:
          type: string
          title: role_name
          description: The role name. It's unique within the instance.
        password:
          type:
            - string
            - "null"
          title: password
          description: The role password.
        connectionLimit:
          type:
            - integer
            - "null"
          title: connection_limit
          format: int32
          description: The connection count limit for this role.
        validUntil:
          type:
            - string
            - "null"
          title: valid_until
          description: The expiration for the role's password.
        attribute:
          type:
            - string
            - "null"
          title: attribute
          description: |-
            The role attribute.
             For PostgreSQL, it contains super_user, no_inherit, create_role, create_db, can_login, replication, and bypass_rls. Docs: https://www.postgresql.org/docs/current/role-attributes.html
             For MySQL, it's the global privileges as GRANT statements, which means it only contains "GRANT ... ON *.* TO ...". Docs: https://dev.mysql.com/doc/refman/8.0/en/grant.html
      title: InstanceRole
      additionalProperties: false
      description: InstanceRole is the API message for instance role.
    bytebase.v1.Issue:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            The name of the issue.
             Format: projects/{project}/issues/{issue}
        title:
          type: string
          title: title
          maxLength: 200
          description: The title of the issue.
        description:
          type: string
          title: description
          maxLength: 10000
          description: The description of the issue.
        type:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Issue.Type'
          title: type
        status:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.IssueStatus'
          title: status
          description: The status of the issue.
        approvers:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.Issue.Approver'
          title: approvers
        approvalTemplate:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.ApprovalTemplate'
          title: approval_template
          description: The approval template for the issue.
        creator:
          type: string
          title: creator
          description: 'Format: users/hello@world.com'
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
        plan:
          type: string
          title: plan
          description: |-
            The plan associated with the issue.
             Can be empty.
             Format: projects/{project}/plans/{plan}
        roleGrant:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.RoleGrant'
          title: role_grant
          description: Used if the issue type is ROLE_GRANT.
        riskLevel:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.RiskLevel'
          title: risk_level
          description: The risk level of the issue.
        labels:
          type: array
          items:
            type: string
          title: labels
          description: Labels attached to the issue for categorization and filtering.
        approvalStatus:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.ApprovalStatus'
          title: approval_status
          description: The overall approval status for the issue.
        accessGrant:
          type: string
          title: access_grant
          description: |-
            The access grant associated with this issue.
             Format: projects/{project}/accessGrants/{access_grant}
        draft:
          type: boolean
          title: draft
          description: Whether this issue is a Draft Review Issue.
      title: Issue
      additionalProperties: false
    bytebase.v1.Issue.Approver:
      type: object
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Issue.Approver.Status'
          title: status
          description: The new status.
        principal:
          type: string
          title: principal
          description: 'Format: users/hello@world.com'
      title: Approver
      additionalProperties: false
      description: Approvers and their approval status for the issue.
    bytebase.v1.Issue.Approver.Status:
      type: string
      title: Status
      enum:
        - STATUS_UNSPECIFIED
        - PENDING
        - APPROVED
        - REJECTED
      description: The approval status of an approver.
    bytebase.v1.Issue.Type:
      type: string
      title: Type
      enum:
        - TYPE_UNSPECIFIED
        - DATABASE_CHANGE
        - ROLE_GRANT
        - ACCESS_GRANT
      description: The type of issue.
    bytebase.v1.IssueComment:
      type: object
      anyOf:
        - type: object
          properties:
            approval:
              allOf:
                - $ref: '#/components/schemas/bytebase.v1.IssueComment.Approval'
              title: approval
              description: Approval event.
          title: approval
        - type: object
          properties:
            issueUpdate:
              allOf:
                - $ref: '#/components/schemas/bytebase.v1.IssueComment.IssueUpdate'
              title: issue_update
              description: Issue update event.
          title: issue_update
        - type: object
          properties:
            planUpdate:
              allOf:
                - $ref: '#/components/schemas/bytebase.v1.IssueComment.PlanUpdate'
              title: plan_update
              description: Plan update event.
          title: plan_update
        - type: object
          properties:
            reviewSubmission:
              allOf:
                - $ref: '#/components/schemas/bytebase.v1.IssueComment.ReviewSubmission'
              title: review_submission
              description: Review submission event.
          title: review_submission
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - approval
              - required:
                  - issueUpdate
              - required:
                  - planUpdate
              - required:
                  - reviewSubmission
          - not:
              oneOf:
                - required:
                    - approval
                - required:
                    - issueUpdate
                - required:
                    - planUpdate
                - required:
                    - reviewSubmission
      properties:
        name:
          type: string
          title: name
          description: 'Format: projects/{project}/issues/{issue}/issueComments/{issueComment-uid}'
        comment:
          type: string
          title: comment
          maxLength: 65536
          description: The text content of the comment.
        payload:
          type: string
          title: payload
          description: 'TODO: use struct message instead.'
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
        creator:
          type: string
          title: creator
          description: 'Format: users/{email}'
        root:
          type:
            - string
            - "null"
          title: root
          description: |-
            The thread root's name, set only on replies. Immutable after creation.
             Format: projects/{project}/issues/{issue}/issueComments/{issueComment}
             Must name a thread root in the same issue, never a general comment or reply.
        threadState:
          oneOf:
            - $ref: '#/components/schemas/bytebase.v1.IssueComment.ThreadState'
            - type: "null"
          title: thread_state
          description: |-
            Present only on thread roots. Set OPEN on create to start a thread; an
             anchored root starts one without it. Omit root, thread_state, and
             statement_anchor to create a general comment.
             Update through the thread_state field mask to resolve or reopen.
             Adding a reply does not reopen a resolved thread.
        statementAnchor:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.StatementAnchor'
          title: statement_anchor
          description: |-
            Optional source context on a root or reply. A reply's anchor must share
             the root's spec and sheet_sha256; it may narrow the range.
             Cannot be set on events. Immutable after creation.
      title: IssueComment
      description: A comment on an issue.
    bytebase.v1.IssueComment.Approval:
      type: object
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.IssueComment.Approval.Status'
          title: status
          description: The approval status.
      title: Approval
      additionalProperties: false
      description: Approval event information.
    bytebase.v1.IssueComment.Approval.Status:
      type: string
      title: Status
      enum:
        - STATUS_UNSPECIFIED
        - PENDING
        - APPROVED
        - REJECTED
      description: Approval status values.
    bytebase.v1.IssueComment.IssueUpdate:
      type: object
      properties:
        fromTitle:
          type:
            - string
            - "null"
          title: from_title
        toTitle:
          type:
            - string
            - "null"
          title: to_title
        fromDescription:
          type:
            - string
            - "null"
          title: from_description
        toDescription:
          type:
            - string
            - "null"
          title: to_description
        fromStatus:
          oneOf:
            - $ref: '#/components/schemas/bytebase.v1.IssueStatus'
            - type: "null"
          title: from_status
        toStatus:
          oneOf:
            - $ref: '#/components/schemas/bytebase.v1.IssueStatus'
            - type: "null"
          title: to_status
        fromLabels:
          type: array
          items:
            type: string
          title: from_labels
        toLabels:
          type: array
          items:
            type: string
          title: to_labels
      title: IssueUpdate
      additionalProperties: false
      description: Issue update event information.
    bytebase.v1.IssueComment.PlanUpdate:
      type: object
      properties:
        fromSpecs:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.Plan.Spec'
          title: from_specs
        toSpecs:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.Plan.Spec'
          title: to_specs
      title: PlanUpdate
      additionalProperties: false
      description: |-
        Plan update event information (snapshot of plan.config.specs before
         and after a PlanService.UpdatePlan call that mutated specs).
    bytebase.v1.IssueComment.ReviewSubmission:
      type: object
      title: ReviewSubmission
      additionalProperties: false
      description: Review submission event information.
    bytebase.v1.IssueComment.ThreadState:
      type: string
      title: ThreadState
      enum:
        - THREAD_STATE_UNSPECIFIED
        - OPEN
        - RESOLVED
    bytebase.v1.IssueStatus:
      type: string
      title: IssueStatus
      enum:
        - ISSUE_STATUS_UNSPECIFIED
        - OPEN
        - DONE
        - CANCELED
      description: |-
        The status of an issue.
         Lives at the top level so both plan_service.proto and issue_service.proto
         can reference it without a circular import.
    bytebase.v1.KerberosConfig:
      type: object
      properties:
        primary:
          type: string
          title: primary
          description: The primary component of the Kerberos principal.
        instance:
          type: string
          title: instance
          description: The instance component of the Kerberos principal.
        realm:
          type: string
          title: realm
          description: The Kerberos realm.
        keytab:
          type: string
          title: keytab
          format: byte
          description: The keytab file contents for authentication.
        kdcHost:
          type: string
          title: kdc_host
          description: The hostname of the Key Distribution Center (KDC).
        kdcPort:
          type: string
          title: kdc_port
          description: The port of the Key Distribution Center (KDC).
        kdcTransportProtocol:
          type: string
          title: kdc_transport_protocol
          description: The transport protocol for KDC communication (tcp or udp).
      title: KerberosConfig
      additionalProperties: false
    bytebase.v1.LDAPIdentityProviderConfig:
      type: object
      properties:
        host:
          type: string
          title: host
          description: |-
            Host is the hostname or IP address of the LDAP server, e.g.,
             "ldap.example.com".
        port:
          type: integer
          title: port
          format: int32
          description: |-
            Port is the port number of the LDAP server, e.g., 389. When not set, the
             default port of the corresponding security protocol will be used, i.e. 389
             for StartTLS and 636 for LDAPS.
        skipTlsVerify:
          type: boolean
          title: skip_tls_verify
          description: SkipTLSVerify controls whether to skip TLS certificate verification.
        bindDn:
          type: string
          title: bind_dn
          description: |-
            BindDN is the DN of the user to bind as a service account to perform
             search requests.
        bindPassword:
          type: string
          title: bind_password
          description: BindPassword is the password of the user to bind as a service account.
        baseDn:
          type: string
          title: base_dn
          description: BaseDN is the base DN to search for users, e.g., "ou=users,dc=example,dc=com".
        userFilter:
          type: string
          title: user_filter
          description: UserFilter is the filter to search for users, e.g., "(uid=%s)".
        securityProtocol:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.LDAPIdentityProviderConfig.SecurityProtocol'
          title: security_protocol
          description: |-
            SecurityProtocol is the security protocol to be used for establishing
             connections with the LDAP server.
        fieldMapping:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.FieldMapping'
          title: field_mapping
          description: |-
            FieldMapping is the mapping of the user attributes returned by the LDAP
             server.
      title: LDAPIdentityProviderConfig
      additionalProperties: false
      description: LDAPIdentityProviderConfig is the structure for LDAP identity provider config.
    bytebase.v1.LDAPIdentityProviderConfig.SecurityProtocol:
      type: string
      title: SecurityProtocol
      enum:
        - SECURITY_PROTOCOL_UNSPECIFIED
        - START_TLS
        - LDAPS
    bytebase.v1.LDAPIdentityProviderTestRequestContext:
      type: object
      properties:
        username:
          type: string
          title: username
          description: The username of a directory user, substituted into the user filter.
        password:
          type: string
          title: password
          description: The password of the directory user.
      title: LDAPIdentityProviderTestRequestContext
      additionalProperties: false
    bytebase.v1.Label:
      type: object
      properties:
        value:
          type: string
          title: value
          description: The label value/name.
        color:
          allOf:
            - $ref: '#/components/schemas/google.type.Color'
          title: color
          description: The label color.
        group:
          type: string
          title: group
          description: The group this label belongs to.
