          description: The status of the operation.
        latency:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: latency
          description: The duration of the operation.
        serviceData:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Any'
          title: service_data
