  /bytebase.v1.IssueService/RetryIssueApproval:
    post:
      tags:
        - bytebase.v1.IssueService
      summary: RetryIssueApproval
      description: |-
        Re-runs approval-template finding for an issue stuck in CHECKING.
         Useful when the synchronous post-create finding errored (e.g. against
         a malformed workspace approval rule) and the operator has since
         corrected it — without this, the issue would remain in CHECKING
         indefinitely because there is no other retry path for non-DATABASE_CHANGE
         issue types. Idempotent: returns the existing issue unchanged when
         approval-finding has already completed.
         Permissions required: None (caller must be the issue creator;
         mirrors RequestIssue's authorization model).
      operationId: bytebase.v1.IssueService.RetryIssueApproval
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bytebase.v1.RetryIssueApprovalRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Issue'
  /bytebase.v1.IssueService/RunReview:
    post:
      tags:
        - bytebase.v1.IssueService
      summary: RunReview
      description: |-
        Triggers a review run. The slot is reset unconditionally: a RUNNING
         execution is superseded (its completion is fenced off), the attempt
         number is bumped, and the returned run is AVAILABLE.
         Review results are not returned by this RPC and have no read RPC yet:
         findings will surface as issue comments once the review comment
         integration lands. The returned run carries execution status only.
         The audit log is the only record of who triggered a run.
         Permissions required: bb.reviewRuns.run
      operationId: bytebase.v1.IssueService.RunReview
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bytebase.v1.RunReviewRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.ReviewRun'
