        mfaTempToken:
          type:
            - string
            - "null"
          title: mfa_temp_token
          description: Temporary token for MFA verification.
        requireResetPassword:
          type: boolean
          title: require_reset_password
          description: Whether user must reset password before continuing.
        user:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.User'
          title: user
          description: The user from the successful login.
      title: LoginResponse
      additionalProperties: false
    bytebase.v1.LogoutRequest:
      type: object
      title: LogoutRequest
      additionalProperties: false
      description: Request to logout current user session.
    bytebase.v1.MCPDelegation:
      type: object
      properties:
        scope:
          type: string
          title: scope
          description: |-
            The OAuth2 grant's consented scope, e.g. "mcp:read-only".
             Empty when the grant recorded no scope.
        resource:
          type: string
          title: resource
          description: |-
            The grant's stored MCP resource URI.
             Empty for pre-grant legacy sessions.
        clientId:
          type: string
          title: client_id
          description: |-
            The OAuth2 client the grant was consented to.
             Empty for legacy web-session tokens at /mcp.
        correlationId:
          type: string
          title: correlation_id
          description: |-
            Correlates the audit rows an MCP session produces. Minted at the /mcp
             boundary and session-scoped: the MCP SDK hands tool handlers the
             initialize-time context, so one MCP session carries one correlation ID
             across all of its tool calls.
      title: MCPDelegation
      additionalProperties: false
      description: |-
        Provenance of a call that reached the API through the MCP (Model Context
         Protocol) server's delegated credential. The values are copied verbatim from
         the verified credential's grant state; empty fields record that the grant
         stored nothing (legacy sessions), never a resolved or synthesized value.
    bytebase.v1.MCPDenialReason:
      type: string
      title: MCPDenialReason
      enum:
        - MCP_DENIAL_REASON_UNSPECIFIED
        - MINTS_CREDENTIAL
        - RESETS_CREDENTIAL
        - TAKES_OVER_ACCOUNT
        - ENDS_SESSION
        - ENDS_MEMBERSHIP
        - MINTS_CREDENTIAL_FOR_OTHERS
        - REWRITES_SESSION_BOUNDARY
        - DRIVES_THE_APPROVAL_DECISION
        - ADMINISTERS_THE_WORKSPACE
        - READS_OTHER_USERS_SQL
        - OPENS_AN_ADMIN_CONNECTION
        - SENDS_DATA_TO_A_THIRD_PARTY
        - RETURNS_A_STORED_SECRET
      description: |-
        Why an MCP session may not call an RPC. The mechanism, not the wording: each
         value names what its methods actually do, and the serving side turns that
         into a sentence. A denial whose stated reason has drifted from the mechanism
         is worse than a bare refusal, because it is the thing the next reader trusts
         — so a method changing what it does changes its reason here.

         One enum covers both refused classes, and every value belongs to exactly one
         of them: values 1-8 name a mechanism that breaks the MCP boundary, which is
         what FORBIDDEN means, and values 9-13 name a scope decision this phase took,
         which is what EXCLUDED means. The distinction is real and lives on the class
         annotation — a FORBIDDEN mechanism is a durable never, an EXCLUDED scope
         decision is what a future admin-capable ceiling would argue with, one
         population at a time. Splitting it across two enums as well only made the
         nonsense states representable: a method could carry both, or carry the kind
         that contradicts its class. Neither is expressible now, and the one check
         left — the reason belongs to the class it is used on — is a table the gate
         already keeps for the wording.
    bytebase.v1.MCPMethodClass:
      type: string
      title: MCPMethodClass
      enum:
        - MCP_METHOD_CLASS_UNSPECIFIED
        - READ
        - WRITE
        - FORBIDDEN
        - EXCLUDED
      description: |-
        Classification of an RPC for MCP (AI agent) sessions. The effective
         authorization of an MCP session is this classification intersected with the
         caller's own RBAC: it can only ever narrow what the human could do, never
         widen it.
         Every value is enforced, at the gate on the internal MCP chain. READ and
         WRITE are the serving classes the workspace's MCP capability ceiling selects
         between, EXCLUDED and FORBIDDEN are served by no ceiling, and an unclassified
         method is refused rather than served. Annotating a method is therefore a
         change to what an MCP session can reach, taking effect on the next request.
    bytebase.v1.MCPSetting:
      type: object
      properties:
        capability:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.MCPSetting.Capability'
          title: capability
          description: |-
            The maximum capability available to MCP sessions in this workspace, acting
             as an admin-set ceiling. Enforced server-side at three points: the /mcp
             endpoint decides whether a connection is admitted at all, the ceiling gate
             on the internal MCP chain decides, per request, which method classes are
             served, and under READ_ONLY the SQL clamp decides, per statement, whether
             it only reads.
        ignoreMaskingExemptions:
          type: boolean
          title: ignore_masking_exemptions
          description: |-
            Whether a request that arrived over MCP stops applying the caller's own
             unmasking provisioning. Two mechanisms let a user see a real value and this
             suppresses both: the masking exemptions granted to them, and the unmask
             carried by an access grant. The same user in the console is untouched.

             It cannot force masking where there is none. Masking substitutes values in
             query results, so this does not reach data copied into a column carrying no
             masking policy, and it does nothing on the engines Bytebase does not mask.
             It narrows what an agent reads through the paths Bytebase masks; it is not
             a confidentiality boundary.
      title: MCPSetting
      additionalProperties: false
      description: |-
        MCPSetting is what an MCP (Model Context Protocol) session may do in this
         workspace.
    bytebase.v1.MCPSetting.Capability:
      type: string
      title: Capability
      enum:
        - CAPABILITY_UNSPECIFIED
        - DISABLED
        - READ_ONLY
        - READ_WRITE
      description: |-
        Capability is the ceiling: a session runs at this level or lower.
         Writing CAPABILITY_UNSPECIFIED explicitly is rejected; omit the update mask
         path to leave the current ceiling unchanged.
    bytebase.v1.MaskingExemptionPolicy:
      type: object
      properties:
        exemptions:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.MaskingExemptionPolicy.Exemption'
          title: exemptions
      title: MaskingExemptionPolicy
      additionalProperties: false
      description: MaskingExemptionPolicy is the allowlist of users who can access sensitive data.
    bytebase.v1.MaskingExemptionPolicy.Exemption:
      type: object
      properties:
        members:
          type: array
          items:
            type: string
          title: members
          description: |-
            Specifies the principals who are exempt from masking.
             For users, the member should be: user:{email}
             For groups, the member should be: group:{email}
             For service accounts, the member should be: serviceAccount:{email}
             For workload identities, the member should be: workloadIdentity:{email}
        condition:
          allOf:
            - $ref: '#/components/schemas/google.type.Expr'
          title: condition
          description: |-
            The condition that is associated with this exception policy instance.
             The syntax and semantics of CEL are documented at https://github.com/google/cel-spec
             If the condition is empty, means the user can access all databases without expiration.

             Support variables:
             resource.instance_id: the instance resource id. Only support "==" operation.
             resource.database_name: the database name. Only support "==" operation.
             resource.schema_name: the schema name. Only support "==" operation.
             resource.table_name: the table name. Only support "==" operation.
             resource.column_name: the column name. Only support "==" operation.
             request.time: the expiration. Only support "<" operation in `request.time < timestamp("{ISO datetime string format}")`
             All variables should join with "&&" condition.

             For example:
             resource.instance_id == "local" && resource.database_name == "employee" && request.time < timestamp("2025-04-30T11:10:39.000Z")
             resource.instance_id == "local" && resource.database_name == "employee"
      title: Exemption
      additionalProperties: false
    bytebase.v1.MaskingReason:
      type: object
      properties:
        semanticTypeId:
          type: string
          title: semantic_type_id
          description: The semantic type that triggered masking (e.g., "SSN", "email", "phone").
        semanticTypeTitle:
          type: string
          title: semantic_type_title
          description: Human-readable semantic type title.
        maskingRuleId:
          type: string
          title: masking_rule_id
          description: The masking rule ID that matched (if applicable).
        algorithm:
          type: string
          title: algorithm
          description: The masking algorithm used.
        context:
          type: string
          title: context
          description: 'Additional context (e.g., "Matched global rule: PII Protection").'
        classificationLevel:
          type: integer
          title: classification_level
          format: int32
          description: The classification level that triggered masking.
        semanticTypeIcon:
          type: string
          title: semantic_type_icon
          description: Icon associated with the semantic type (if any).
      title: MaskingReason
      additionalProperties: false
    bytebase.v1.MaskingRulePolicy:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.MaskingRulePolicy.MaskingRule'
          title: rules
          description: The list of masking rules.
      title: MaskingRulePolicy
      additionalProperties: false
      description: Policy for configuring data masking rules.
    bytebase.v1.MaskingRulePolicy.MaskingRule:
      type: object
      properties:
        id:
          type: string
          title: id
          description: A unique identifier for the rule in UUID format.
        condition:
          allOf:
            - $ref: '#/components/schemas/google.type.Expr'
          title: condition
          description: |-
            The condition for the masking rule.
             The syntax and semantics of CEL are documented at https://github.com/google/cel-spec

             Support variables:
             resource.environment_id: the environment resource id.
             resource.project_id: the project resource id.
             resource.instance_id: the instance resource id.
             resource.database_name: the database name.
             resource.table_name: the table name.
             resource.column_name: the column name.
             resource.classification_level: the classification level (integer).

             Each variable support following operations:
             ==: the value equals the target.
             !=: the value not equals the target.
             in: the value matches one of the targets.
             !(in): the value not matches any of the targets.
             <, <=, >, >=: numeric comparison (classification_level only).

             For example:
             resource.environment_id == "test" && resource.project_id == "sample-project"
             resource.instance_id == "sample-instance" && resource.database_name == "employee" && resource.table_name in ["table1", "table2"]
             resource.environment_id != "test" || !(resource.project_id in ["poject1", "prject2"])
             resource.instance_id == "sample-instance" && (resource.database_name == "db1" || resource.database_name == "db2")
        semanticType:
          type: string
          title: semantic_type
          description: The semantic type of data to mask (e.g., "SSN", "EMAIL").
      title: MaskingRule
      additionalProperties: false
      description: A rule that defines when and how to mask data.
