    bytebase.v1.GetDatabaseMetadataRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            The name of the database to retrieve metadata.
             Format: instances/{instance}/databases/{database}/metadata or projects/{project}/instances/{instance}/databases/{database}/metadata
        filter:
          type: string
          title: filter
          description: |-
            Filter is used to filter databases returned in the list.
             The syntax and semantics of CEL are documented at https://github.com/google/cel-spec

             Supported filter:
             - schema: the schema name, support "==" operator.
             - table: the table name, support "==" and ".contains()" operator.

             For example:
             schema == "schema-a"
             table == "table-a"
             table.contains("table-a")
             schema == "schema-a" && table.contains("sample")
             The filter is used to search for tables containing "sample" in the schema "schemas/schema-a".
             The column masking level will only be returned when a table filter is used.
        limit:
          type: integer
          title: limit
          format: int32
          description: |-
            Limit the response size of returned table metadata per schema.
             For example, if the database has 3 schemas, and each schema has 100 tables,
             if limit is 20, then only 20 tables will be returned for each schema, total 60 tables.
             Default 0, means no limit.
      title: GetDatabaseMetadataRequest
      additionalProperties: false
