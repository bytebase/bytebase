    google.api.expr.v1alpha1.Constant:
      type: object
      anyOf:
        - type: object
          properties:
            boolValue:
              type: boolean
              title: bool_value
              description: boolean value.
          title: bool_value
        - type: object
          properties:
            bytesValue:
              type: string
              title: bytes_value
              format: byte
              description: bytes value.
          title: bytes_value
        - type: object
          properties:
            doubleValue:
              type: number
              title: double_value
              format: double
              description: double value.
          title: double_value
        - type: object
          properties:
            durationValue:
              allOf:
                - $ref: '#/components/schemas/google.protobuf.Duration'
              title: duration_value
              description: |-
                protobuf.Duration value.

                 Deprecated: duration is no longer considered a builtin cel type.
              deprecated: true
          title: duration_value
        - type: object
          properties:
            int64Value:
              type: string
              title: int64_value
              format: int64
              description: int64 value.
          title: int64_value
        - type: object
          properties:
            nullValue:
              allOf:
                - $ref: '#/components/schemas/google.protobuf.NullValue'
              title: null_value
              description: null value.
          title: null_value
        - type: object
          properties:
            stringValue:
              type: string
              title: string_value
              description: string value.
          title: string_value
        - type: object
          properties:
            timestampValue:
              allOf:
                - $ref: '#/components/schemas/google.protobuf.Timestamp'
              title: timestamp_value
              description: |-
                protobuf.Timestamp value.

                 Deprecated: timestamp is no longer considered a builtin cel type.
              deprecated: true
          title: timestamp_value
        - type: object
          properties:
            uint64Value:
              type: string
              title: uint64_value
              format: int64
              description: uint64 value.
          title: uint64_value
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - boolValue
              - required:
                  - bytesValue
              - required:
                  - doubleValue
              - required:
                  - durationValue
              - required:
                  - int64Value
              - required:
                  - nullValue
              - required:
                  - stringValue
              - required:
                  - timestampValue
              - required:
                  - uint64Value
          - not:
              oneOf:
                - required:
                    - boolValue
                - required:
                    - bytesValue
                - required:
                    - doubleValue
                - required:
                    - durationValue
                - required:
                    - int64Value
                - required:
                    - nullValue
                - required:
                    - stringValue
                - required:
                    - timestampValue
                - required:
                    - uint64Value
      title: Constant
      description: |-
        Represents a primitive literal.

         Named 'Constant' here for backwards compatibility.

         This is similar as the primitives supported in the well-known type
         `google.protobuf.Value`, but richer so it can represent CEL's full range of
         primitives.

         Lists and structs are not included as constants as these aggregate types may
         contain [Expr][google.api.expr.v1alpha1.Expr] elements which require
         evaluation and are thus not constant.

         Examples of literals include: `"hello"`, `b'bytes'`, `1u`, `4.2`, `-2`,
         `true`, `null`.
    google.api.expr.v1alpha1.Expr:
      type: object
      anyOf:
        - type: object
          properties:
            callExpr:
              allOf:
                - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr.Call'
              title: call_expr
              description: A call expression, including calls to predefined functions and operators.
          title: call_expr
        - type: object
          properties:
            comprehensionExpr:
              allOf:
                - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr.Comprehension'
              title: comprehension_expr
              description: A comprehension expression.
          title: comprehension_expr
        - type: object
          properties:
            constExpr:
              allOf:
                - $ref: '#/components/schemas/google.api.expr.v1alpha1.Constant'
              title: const_expr
              description: A literal expression.
          title: const_expr
        - type: object
          properties:
            identExpr:
              allOf:
                - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr.Ident'
              title: ident_expr
              description: An identifier expression.
          title: ident_expr
        - type: object
          properties:
            listExpr:
              allOf:
                - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr.CreateList'
              title: list_expr
              description: A list creation expression.
          title: list_expr
        - type: object
          properties:
            selectExpr:
              allOf:
                - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr.Select'
              title: select_expr
              description: A field selection expression, e.g. `request.auth`.
          title: select_expr
        - type: object
          properties:
            structExpr:
              allOf:
                - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr.CreateStruct'
              title: struct_expr
              description: A map or message creation expression.
          title: struct_expr
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - callExpr
              - required:
                  - comprehensionExpr
              - required:
                  - constExpr
              - required:
                  - identExpr
              - required:
                  - listExpr
              - required:
                  - selectExpr
              - required:
                  - structExpr
          - not:
              oneOf:
                - required:
                    - callExpr
                - required:
                    - comprehensionExpr
                - required:
                    - constExpr
                - required:
                    - identExpr
                - required:
                    - listExpr
                - required:
                    - selectExpr
                - required:
                    - structExpr
      properties:
        id:
          type: string
          title: id
          format: int64
          description: |-
            Required. An id assigned to this node by the parser which is unique in a
             given expression tree. This is used to associate type information and other
             attributes to a node in the parse tree.
      title: Expr
      description: |-
        An abstract representation of a common expression.

         Expressions are abstractly represented as a collection of identifiers,
         select statements, function calls, literals, and comprehensions. All
         operators with the exception of the '.' operator are modelled as function
         calls. This makes it easy to represent new operators into the existing AST.

         All references within expressions must resolve to a
         [Decl][google.api.expr.v1alpha1.Decl] provided at type-check for an
         expression to be valid. A reference may either be a bare identifier `name` or
         a qualified identifier `google.api.name`. References may either refer to a
         value or a function declaration.

         For example, the expression `google.api.name.startsWith('expr')` references
         the declaration `google.api.name` within a
         [Expr.Select][google.api.expr.v1alpha1.Expr.Select] expression, and the
         function declaration `startsWith`.
    google.api.expr.v1alpha1.Expr.Call:
      type: object
      properties:
        target:
          allOf:
            - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr'
          title: target
          description: |-
            The target of an method call-style expression. For example, `x` in
             `x.f()`.
        function:
          type: string
          title: function
          description: Required. The name of the function or method being called.
        args:
          type: array
          items:
            $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr'
          title: args
          description: The arguments.
      title: Call
      additionalProperties: false
      description: |-
        A call expression, including calls to predefined functions and operators.

         For example, `value == 10`, `size(map_value)`.
    google.api.expr.v1alpha1.Expr.Comprehension:
      type: object
      properties:
        iterVar:
          type: string
          title: iter_var
          description: |-
            The name of the first iteration variable.
             When the iter_range is a list, this variable is the list element.
             When the iter_range is a map, this variable is the map entry key.
        iterVar2:
          type: string
          title: iter_var2
          description: |-
            The name of the second iteration variable, empty if not set.
             When the iter_range is a list, this variable is the integer index.
             When the iter_range is a map, this variable is the map entry value.
             This field is only set for comprehension v2 macros.
        iterRange:
          allOf:
            - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr'
          title: iter_range
          description: The range over which the comprehension iterates.
        accuVar:
          type: string
          title: accu_var
          description: The name of the variable used for accumulation of the result.
        accuInit:
          allOf:
            - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr'
          title: accu_init
          description: The initial value of the accumulator.
        loopCondition:
          allOf:
            - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr'
          title: loop_condition
          description: |-
            An expression which can contain iter_var, iter_var2, and accu_var.

             Returns false when the result has been computed and may be used as
             a hint to short-circuit the remainder of the comprehension.
        loopStep:
          allOf:
            - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr'
          title: loop_step
          description: |-
            An expression which can contain iter_var, iter_var2, and accu_var.

             Computes the next value of accu_var.
        result:
          allOf:
            - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr'
          title: result
          description: |-
            An expression which can contain accu_var.

             Computes the result.
      title: Comprehension
      additionalProperties: false
      description: |-
        A comprehension expression applied to a list or map.

         Comprehensions are not part of the core syntax, but enabled with macros.
         A macro matches a specific call signature within a parsed AST and replaces
         the call with an alternate AST block. Macro expansion happens at parse
         time.

         The following macros are supported within CEL:

         Aggregate type macros may be applied to all elements in a list or all keys
         in a map:

         *  `all`, `exists`, `exists_one` -  test a predicate expression against
            the inputs and return `true` if the predicate is satisfied for all,
            any, or only one value `list.all(x, x < 10)`.
         *  `filter` - test a predicate expression against the inputs and return
            the subset of elements which satisfy the predicate:
            `payments.filter(p, p > 1000)`.
         *  `map` - apply an expression to all elements in the input and return the
            output aggregate type: `[1, 2, 3].map(i, i * i)`.

         The `has(m.x)` macro tests whether the property `x` is present in struct
         `m`. The semantics of this macro depend on the type of `m`. For proto2
         messages `has(m.x)` is defined as 'defined, but not set`. For proto3, the
         macro tests whether the property is set to its default. For map and struct
         types, the macro tests whether the property `x` is defined on `m`.

         Comprehensions for the standard environment macros evaluation can be best
         visualized as the following pseudocode:

         ```
         let `accu_var` = `accu_init`
         for (let `iter_var` in `iter_range`) {
           if (!`loop_condition`) {
             break
           }
           `accu_var` = `loop_step`
         }
         return `result`
         ```

         Comprehensions for the optional V2 macros which support map-to-map
         translation differ slightly from the standard environment macros in that
         they expose both the key or index in addition to the value for each list
         or map entry:

         ```
         let `accu_var` = `accu_init`
         for (let `iter_var`, `iter_var2` in `iter_range`) {
           if (!`loop_condition`) {
             break
           }
           `accu_var` = `loop_step`
         }
         return `result`
         ```
    google.api.expr.v1alpha1.Expr.CreateList:
      type: object
      properties:
        elements:
          type: array
          items:
            $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr'
          title: elements
          description: The elements part of the list.
        optionalIndices:
          type: array
          items:
            type: integer
            format: int32
          title: optional_indices
          description: |-
            The indices within the elements list which are marked as optional
             elements.

             When an optional-typed value is present, the value it contains
             is included in the list. If the optional-typed value is absent, the list
             element is omitted from the CreateList result.
      title: CreateList
      additionalProperties: false
      description: |-
        A list creation expression.

         Lists may either be homogenous, e.g. `[1, 2, 3]`, or heterogeneous, e.g.
         `dyn([1, 'hello', 2.0])`
    google.api.expr.v1alpha1.Expr.CreateStruct:
      type: object
      properties:
        messageName:
          type: string
          title: message_name
          description: |-
            The type name of the message to be created, empty when creating map
             literals.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr.CreateStruct.Entry'
          title: entries
          description: The entries in the creation expression.
      title: CreateStruct
      additionalProperties: false
      description: |-
        A map or message creation expression.

         Maps are constructed as `{'key_name': 'value'}`. Message construction is
         similar, but prefixed with a type name and composed of field ids:
         `types.MyType{field_id: 'value'}`.
    google.api.expr.v1alpha1.Expr.CreateStruct.Entry:
      type: object
      anyOf:
        - type: object
          properties:
            fieldKey:
              type: string
              title: field_key
              description: The field key for a message creator statement.
          title: field_key
        - type: object
          properties:
            mapKey:
              allOf:
                - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr'
              title: map_key
              description: The key expression for a map creation statement.
          title: map_key
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - fieldKey
              - required:
                  - mapKey
          - not:
              oneOf:
                - required:
                    - fieldKey
                - required:
                    - mapKey
      properties:
        id:
          type: string
          title: id
          format: int64
          description: |-
            Required. An id assigned to this node by the parser which is unique
             in a given expression tree. This is used to associate type
             information and other attributes to the node.
        value:
          allOf:
            - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr'
          title: value
          description: |-
            Required. The value assigned to the key.

             If the optional_entry field is true, the expression must resolve to an
             optional-typed value. If the optional value is present, the key will be
             set; however, if the optional value is absent, the key will be unset.
        optionalEntry:
          type: boolean
          title: optional_entry
          description: Whether the key-value pair is optional.
      title: Entry
      description: Represents an entry.
    google.api.expr.v1alpha1.Expr.Ident:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            Required. Holds a single, unqualified identifier, possibly preceded by a
             '.'.

             Qualified names are represented by the
             [Expr.Select][google.api.expr.v1alpha1.Expr.Select] expression.
      title: Ident
      additionalProperties: false
      description: An identifier expression. e.g. `request`.
    google.api.expr.v1alpha1.Expr.Select:
      type: object
      properties:
        operand:
          allOf:
            - $ref: '#/components/schemas/google.api.expr.v1alpha1.Expr'
          title: operand
          description: |-
            Required. The target of the selection expression.

             For example, in the select expression `request.auth`, the `request`
             portion of the expression is the `operand`.
        field:
          type: string
          title: field
          description: |-
            Required. The name of the field to select.

             For example, in the select expression `request.auth`, the `auth` portion
             of the expression would be the `field`.
        testOnly:
          type: boolean
          title: test_only
          description: |-
            Whether the select is to be interpreted as a field presence test.

             This results from the macro `has(request.auth)`.
      title: Select
      additionalProperties: false
      description: A field selection expression. e.g. `request.auth`.
    google.protobuf.Any:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
          format: binary
      additionalProperties: true
      description: An arbitrary message with a type URL identifying the encoded message type.
    google.protobuf.Duration:
      type: string
      format: duration
      description: A signed duration in seconds, with up to nine fractional digits and an `s` suffix (for example, `3s` or `-0.001s`).
    google.protobuf.Empty:
      type: object
      description: An empty JSON object.
    google.protobuf.FieldMask:
      type: string
      description: Comma-separated field paths in lowerCamelCase (for example, `user.displayName,photo`).
    google.protobuf.FloatValue:
      oneOf:
        - type: string
        - type: number
      description: A single-precision number. The non-finite values `NaN`, `Infinity`, and `-Infinity` are encoded as strings; `null` is also accepted.
    google.protobuf.ListValue:
      type: array
      items:
        $ref: '#/components/schemas/google.protobuf.Value'
      description: A JSON array whose elements may be any JSON value.
    google.protobuf.NullValue:
      type: string
      title: NullValue
      enum:
        - NULL_VALUE
      description: |-
        `NullValue` is a singleton enumeration to represent the null value for the
         `Value` type union.

         The JSON representation for `NullValue` is JSON `null`.
    google.protobuf.Struct:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/google.protobuf.Value'
      description: A JSON object whose property values may be any JSON value.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    google.protobuf.Value:
      oneOf:
        - type: "null"
        - type: number
        - type: string
        - type: boolean
        - type: array
        - type: object
          additionalProperties: true
      description: 'Any JSON value: `null`, number, string, boolean, array, or object.'
    google.rpc.Status:
      type: object
      properties:
        code:
          type: integer
          title: code
          format: int32
          description: |-
            The status code, which should be an enum value of
             [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          title: message
          description: |-
            A developer-facing error message, which should be in English. Any
             user-facing error message should be localized and sent in the
             [google.rpc.Status.details][google.rpc.Status.details] field, or localized
             by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/google.protobuf.Any'
          title: details
          description: |-
            A list of messages that carry the error details.  There is a common set of
             message types for APIs to use.
      title: Status
      additionalProperties: false
      description: |-
        The `Status` type defines a logical error model that is suitable for
         different programming environments, including REST APIs and RPC APIs. It is
         used by [gRPC](https://github.com/grpc). Each `Status` message contains
         three pieces of data: error code, error message, and error details.

         You can find out more about this error model and how to work with it in the
         [API Design Guide](https://cloud.google.com/apis/design/errors).
    google.type.Color:
      type: object
      properties:
        red:
          type: number
          title: red
          format: float
          description: The amount of red in the color as a value in the interval [0, 1].
        green:
          type: number
          title: green
          format: float
          description: The amount of green in the color as a value in the interval [0, 1].
        blue:
          type: number
          title: blue
          format: float
          description: The amount of blue in the color as a value in the interval [0, 1].
        alpha:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.FloatValue'
          title: alpha
          description: |-
            The fraction of this color that should be applied to the pixel. That is,
             the final pixel color is defined by the equation:

               `pixel color = alpha * (this color) + (1.0 - alpha) * (background color)`

             This means that a value of 1.0 corresponds to a solid color, whereas
             a value of 0.0 corresponds to a completely transparent color. This
             uses a wrapper message rather than a simple float scalar so that it is
             possible to distinguish between a default value and the value being unset.
             If omitted, this color object is rendered as a solid color
             (as if the alpha value had been explicitly given a value of 1.0).
      title: Color
      additionalProperties: false
      description: |-
        Represents a color in the RGBA color space. This representation is designed
         for simplicity of conversion to/from color representations in various
         languages over compactness. For example, the fields of this representation
         can be trivially provided to the constructor of `java.awt.Color` in Java; it
         can also be trivially provided to UIColor's `+colorWithRed:green:blue:alpha`
         method in iOS; and, with just a little work, it can be easily formatted into
         a CSS `rgba()` string in JavaScript.

         This reference page doesn't carry information about the absolute color
         space
         that should be used to interpret the RGB value (e.g. sRGB, Adobe RGB,
         DCI-P3, BT.2020, etc.). By default, applications should assume the sRGB color
         space.

         When color equality needs to be decided, implementations, unless
         documented otherwise, treat two colors as equal if all their red,
         green, blue, and alpha values each differ by at most 1e-5.

         Example (Java):

              import com.google.type.Color;

              // ...
              public static java.awt.Color fromProto(Color protocolor) {
                float alpha = protocolor.hasAlpha()
                    ? protocolor.getAlpha().getValue()
                    : 1.0;

                return new java.awt.Color(
                    protocolor.getRed(),
                    protocolor.getGreen(),
                    protocolor.getBlue(),
                    alpha);
              }

              public static Color toProto(java.awt.Color color) {
                float red = (float) color.getRed();
                float green = (float) color.getGreen();
                float blue = (float) color.getBlue();
                float denominator = 255.0;
                Color.Builder resultBuilder =
                    Color
                        .newBuilder()
                        .setRed(red / denominator)
                        .setGreen(green / denominator)
                        .setBlue(blue / denominator);
                int alpha = color.getAlpha();
                if (alpha != 255) {
                  result.setAlpha(
                      FloatValue
                          .newBuilder()
                          .setValue(((float) alpha) / denominator)
                          .build());
                }
                return resultBuilder.build();
              }
              // ...

         Example (iOS / Obj-C):

              // ...
              static UIColor* fromProto(Color* protocolor) {
                 float red = [protocolor red];
                 float green = [protocolor green];
                 float blue = [protocolor blue];
                 FloatValue* alpha_wrapper = [protocolor alpha];
                 float alpha = 1.0;
                 if (alpha_wrapper != nil) {
                   alpha = [alpha_wrapper value];
                 }
                 return [UIColor colorWithRed:red green:green blue:blue alpha:alpha];
              }

              static Color* toProto(UIColor* color) {
                  CGFloat red, green, blue, alpha;
                  if (![color getRed:&red green:&green blue:&blue alpha:&alpha]) {
                    return nil;
                  }
                  Color* result = [[Color alloc] init];
                  [result setRed:red];
                  [result setGreen:green];
                  [result setBlue:blue];
                  if (alpha <= 0.9999) {
                    [result setAlpha:floatWrapperWithValue(alpha)];
                  }
                  [result autorelease];
                  return result;
             }
             // ...

          Example (JavaScript):

             // ...

             var protoToCssColor = function(rgb_color) {
                var redFrac = rgb_color.red || 0.0;
                var greenFrac = rgb_color.green || 0.0;
                var blueFrac = rgb_color.blue || 0.0;
                var red = Math.floor(redFrac * 255);
                var green = Math.floor(greenFrac * 255);
                var blue = Math.floor(blueFrac * 255);

                if (!('alpha' in rgb_color)) {
                   return rgbToCssColor(red, green, blue);
                }

                var alphaFrac = rgb_color.alpha.value || 0.0;
                var rgbParams = [red, green, blue].join(',');
                return ['rgba(', rgbParams, ',', alphaFrac, ')'].join('');
             };

             var rgbToCssColor = function(red, green, blue) {
               var rgbNumber = new Number((red << 16) | (green << 8) | blue);
               var hexString = rgbNumber.toString(16);
               var missingZeros = 6 - hexString.length;
               var resultBuilder = ['#'];
               for (var i = 0; i < missingZeros; i++) {
                  resultBuilder.push('0');
               }
               resultBuilder.push(hexString);
               return resultBuilder.join('');
             };

             // ...
    google.type.Expr:
      type: object
      properties:
        expression:
          type: string
          title: expression
          description: |-
            Textual representation of an expression in Common Expression Language
             syntax.
        title:
          type: string
          title: title
          description: |-
            Optional. Title for the expression, i.e. a short string describing
             its purpose. This can be used e.g. in UIs which allow to enter the
             expression.
        description:
          type: string
          title: description
          description: |-
            Optional. Description of the expression. This is a longer text which
             describes the expression, e.g. when hovered over it in a UI.
        location:
          type: string
          title: location
          description: |-
            Optional. String indicating the location of the expression for error
             reporting, e.g. a file name and a position in the file.
      title: Expr
      additionalProperties: false
      description: |-
        Represents a textual expression in the Common Expression Language (CEL)
         syntax. CEL is a C-like expression language. The syntax and semantics of CEL
         are documented at https://github.com/google/cel-spec.

         Example (Comparison):

             title: "Summary size limit"
             description: "Determines if a summary is less than 100 chars"
             expression: "document.summary.size() < 100"

         Example (Equality):

             title: "Requestor is owner"
             description: "Determines if requestor is the document owner"
             expression: "document.owner == request.auth.claims.email"

         Example (Logic):

             title: "Public documents"
             description: "Determine whether the document should be publicly visible"
             expression: "document.type != 'private' && document.type != 'internal'"

         Example (Data Manipulation):

             title: "Notification string"
             description: "Create a notification string with a timestamp."
             expression: "'New message received at ' + string(document.create_time)"

         The exact variables and functions that may be referenced within an expression
         are determined by the service that evaluates it. See the service
         documentation for additional information.
security: []
tags:
  - name: bytebase.v1.AccessGrantService
    description: AccessGrantService manages temporary access grants within projects.
  - name: bytebase.v1.RolloutService
    description: RolloutService manages the execution of deployment plans.
  - name: bytebase.v1.QueryHistoryService
    description: QueryHistoryService manages query history records of SQL Editor queries and exports.
  - name: bytebase.v1.SQLService
    description: SQLService executes SQL queries and manages query operations.
  - name: bytebase.v1.PlanService
    description: PlanService manages deployment plans for database changes.
  - name: bytebase.v1.IssueService
    description: IssueService manages issues for tracking database changes and tasks.
  - name: bytebase.v1.SettingService
    description: SettingService manages workspace-level settings and configurations.
  - name: bytebase.v1.ActuatorService
    description: ActuatorService manages system health and operational information.
  - name: bytebase.v1.AIService
    description: AIService provides AI chat capabilities for the page agent.
  - name: bytebase.v1.AuditLogService
    description: AuditLogService manages audit logs for system activities and API calls.
  - name: bytebase.v1.IdentityProviderService
    description: IdentityProviderService manages external identity providers for SSO authentication.
  - name: bytebase.v1.UserService
    description: UserService manages user accounts and authentication.
  - name: bytebase.v1.AuthService
    description: AuthService handles user authentication operations.
  - name: bytebase.v1.CelService
    description: CelService manages CEL (Common Expression Language) parsing and formatting operations.
  - name: bytebase.v1.ChangelogService
    description: ChangelogService manages database migration history.
  - name: bytebase.v1.DatabaseCatalogService
    description: DatabaseCatalogService manages database schema metadata and classification.
  - name: bytebase.v1.DatabaseGroupService
    description: DatabaseGroupService manages database groups for organizing databases by criteria.
  - name: bytebase.v1.InstanceRoleService
    description: InstanceRoleService manages database roles within instances.
  - name: bytebase.v1.InstanceService
    description: InstanceService manages database instances and their connections.
  - name: bytebase.v1.DatabaseService
    description: DatabaseService manages databases and their schemas.
  - name: bytebase.v1.GroupService
    description: GroupService manages user groups for organizing users and permissions.
  - name: bytebase.v1.OrgPolicyService
    description: OrgPolicyService manages organizational policies at various resource levels.
  - name: bytebase.v1.ProjectService
    description: ProjectService manages projects that group databases and changes.
  - name: bytebase.v1.ReleaseService
    description: ReleaseService manages releases for coordinating deployments.
  - name: bytebase.v1.ReviewConfigService
    description: ReviewConfigService manages approval flow configurations.
  - name: bytebase.v1.RevisionService
    description: RevisionService manages schema revision history.
  - name: bytebase.v1.RoleService
    description: RoleService manages workspace roles and permissions.
  - name: bytebase.v1.SavedQueryService
    description: |-
      SavedQueryService manages saved queries in the SQL Editor.

       A saved query is private to its creator until shared. Permissions come from
       three places:
       - The creator owns the saved query and holds every permission on it.
       - A VIEWER binding grants bb.savedQueries.get and getIamPolicy; an EDITOR
         binding adds update.
       - Permissions granted on the project or workspace apply to every saved
         query in the project, private ones included.
       A caller without a method's permission gets NotFound, not
       PermissionDenied, so private names stay unprobeable. Running a saved query
       is governed by the SQL Editor's database permissions, not by this service.
  - name: bytebase.v1.ServiceAccountService
    description: ServiceAccountService manages service accounts for API integrations.
  - name: bytebase.v1.SheetService
    description: SheetService manages SQL scripts and saved queries.
  - name: bytebase.v1.SubscriptionService
    description: SubscriptionService manages enterprise subscriptions and licensing.
  - name: bytebase.v1.WorkloadIdentityService
    description: WorkloadIdentityService manages workload identities for external CI/CD integrations.
  - name: bytebase.v1.WorkspaceService
    description: WorkspaceService manages workspace-level operations and profile.
