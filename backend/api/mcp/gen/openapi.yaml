        nextPageToken:
          type: string
          title: next_page_token
          description: |-
            A token, which can be sent as `page_token` to retrieve the next page.
             If this field is omitted, there are no subsequent pages.
      title: SearchMyAccessGrantsResponse
      additionalProperties: false
    bytebase.v1.SearchProjectsRequest:
      type: object
      properties:
        showDeleted:
          type: boolean
          title: show_deleted
          description: Show deleted projects if specified.
        filter:
          type: string
          title: filter
          description: |-
            Filter the project.
             The syntax and semantics of CEL are documented at https://github.com/google/cel-spec

             Supported filters:
             - name: the project name, support "==" and ".contains()" operator.
             - resource_id: the project id, support "==" and ".contains()" operator.
             - exclude_default: if not include the default project, should be "true" or "false", support "==" operator.
             - state: check the State enum for the values, support "==" operator.
             - labels.{key}: the project label, support "==" and "in" operators.

             For example:
             name == "project name"
             name.contains("project name")
             resource_id == "project id"
             resource_id.contains("project id")
             exclude_default == true
             state == "DELETED"
             labels.environment == "production"
             labels.tier == "critical"
             labels.environment in ["staging", "prod"]
             You can combine filter conditions like:
             name == "project name" && resource_id.contains("project id")
             name.contains("project name") || resource_id == "project id"
             labels.environment == "production" && labels.tier == "critical"
        pageSize:
          type: integer
          title: page_size
          format: int32
          description: |-
            The maximum number of projects to return. The service may return fewer than
             this value.
             If unspecified, at most 10 projects will be returned.
             The maximum value is 1000; values above 1000 will be coerced to 1000.
        pageToken:
          type: string
          title: page_token
          description: |-
            A page token, received from a previous `SearchProjects` call.
             Provide this to retrieve the subsequent page.

             When paginating, all other parameters provided to `SearchProjects` must match
             the call that provided the page token.
        orderBy:
          type: string
          title: order_by
          description: |-
            The order by of projects.
             Support title. The default sorting order is ascending.
             For example:
             - order_by = "title"
             - order_by = "title desc"
             - order_by = "title asc"
      title: SearchProjectsRequest
      additionalProperties: false
    bytebase.v1.SearchProjectsResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.Project'
          title: projects
          description: The projects from the specified request.
        nextPageToken:
          type: string
          title: next_page_token
          description: |-
            A token, which can be sent as `page_token` to retrieve the next page.
             If this field is omitted, there are no subsequent pages.
      title: SearchProjectsResponse
      additionalProperties: false
    bytebase.v1.SearchQueryHistoriesRequest:
      type: object
      properties:
        parent:
          type: string
          title: parent
          description: |-
            The parent project to search query histories in.
             Format: projects/{project}
             The AIP-159 wildcard "projects/-" is not supported; use
             ListQueryHistories for cross-project reads.
        pageSize:
          type: integer
          title: page_size
          format: int32
          description: |-
            The maximum number of histories to return.
             The service may return fewer than this value.
             If unspecified, at most 10 history entries will be returned.
             The maximum value is 1000; values above 1000 will be coerced to 1000.
        pageToken:
          type: string
          title: page_token
          description: |-
            A page token, received from a previous `ListQueryHistory` call.
             Provide this to retrieve the subsequent page.
        filter:
          type: string
          title: filter
          description: |-
            Filter is the filter to apply on the search query history
             The syntax and semantics of CEL are documented at https://github.com/google/cel-spec

             Supported filter:
             - project: the project full name in "projects/{id}" format, support "==" operator.
             - database: the database full name in "instances/{id}/databases/{name}" or "projects/{project}/instances/{id}/databases/{name}" format, support "==" operator.
             - instance: the instance full name in "instances/{id}" or "projects/{project}/instances/{id}" format, support "==" operator.
             - type: the type, should be "QUERY" or "EXPORT", support "==" operator.
             - statement: the SQL statement, support "==" and ".contains()" operators.

             For example:
             project == "projects/{project}"
             database == "instances/{instance}/databases/{database}"
             instance == "instances/{instance}"
             type == "QUERY"
             type == "EXPORT"
             statement == "SELECT 1;"
             statement.contains("select")
             type == "QUERY" && statement.contains("select")
      title: SearchQueryHistoriesRequest
      additionalProperties: false
    bytebase.v1.SearchQueryHistoriesResponse:
      type: object
      properties:
        queryHistories:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.QueryHistory'
          title: query_histories
          description: The list of history.
        nextPageToken:
          type: string
          title: next_page_token
          description: |-
            A token to retrieve next page of history.
             Pass this value in the page_token field in the subsequent call to
             `ListQueryHistory` method to retrieve the next page of history.
      title: SearchQueryHistoriesResponse
      additionalProperties: false
    bytebase.v1.SearchSavedQueriesRequest:
      type: object
      properties:
        parent:
          type: string
          title: parent
          description: 'Format: projects/{project}'
        filter:
          type: string
          title: filter
          description: |-
            Filter the result, in CEL. See https://github.com/google/cel-spec

             Supported fields:
             - name: the saved query name. Supports "==" and "in [...]".
             - title: the title. Supports "contains".
             - creator: the creator in "users/{email}" format. Supports "==" and "!=".
             - shared: whether a binding shares the saved query with the caller. Their
               own saved queries, and ones visible only through a project-level
               bb.savedQueries.get, are not "shared". Supports "==".
             - starred: whether the caller starred it. Supports "==".
             - folder: the exact folder path. Supports "==".

             Use `creator == "users/{me}"` for a My view and `shared == true` for a
             Shared view. Prefer `shared` over `creator !=`: with a project-level
             bb.savedQueries.get, `creator !=` also matches saved queries nobody
             shared with the caller.

             For example:
             creator == "users/alice@example.com"
             shared == true
             starred == true
             title.contains("weekly report")
             folder == "foo/bar"
        pageSize:
          type: integer
          title: page_size
          format: int32
          description: |-
            The maximum number of saved queries to return. The service may return
             fewer. Defaults to 10; values above 1000 are coerced to 1000.
        pageToken:
          type: string
          title: page_token
          description: |-
            A page token from a previous SearchSavedQueries call. Keep every other
             parameter the same as the call that returned it.
      title: SearchSavedQueriesRequest
      additionalProperties: false
    bytebase.v1.SearchSavedQueriesResponse:
      type: object
      properties:
        savedQueries:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.SavedQuery'
          title: saved_queries
        nextPageToken:
          type: string
          title: next_page_token
          description: |-
            Pass to the next SearchSavedQueries call to fetch the following page.
             Empty on the last page.
      title: SearchSavedQueriesResponse
      additionalProperties: false
    bytebase.v1.SearchSavedQueryFoldersRequest:
      type: object
      properties:
        parent:
          type: string
          title: parent
          description: 'Format: projects/{project}'
        filter:
          type: string
          title: filter
          description: |-
            Filter folders by the saved queries they hold. Takes the same fields and
             syntax as SearchSavedQueries.filter, except `title`. A folder is returned
             when at least one saved query the caller can read matches.
      title: SearchSavedQueryFoldersRequest
      additionalProperties: false
    bytebase.v1.SearchSavedQueryFoldersResponse:
      type: object
      properties:
        folders:
          type: array
          items:
            type: string
          title: folders
          description: |-
            Folder paths, every ancestor prefix included, sorted. A folder is a path
             on saved queries ("a/b/c"), so empty folders cannot exist.
      title: SearchSavedQueryFoldersResponse
      additionalProperties: false
