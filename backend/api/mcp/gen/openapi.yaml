    bytebase.v1.ListSavedQueriesRequest:
      type: object
      properties:
        parent:
          type: string
          title: parent
          description: |-
            The project to list saved queries in, or "projects/-" for every project.
             Format: projects/{project}
        filter:
          type: string
          title: filter
          description: |-
            Filter the result, in CEL. See https://github.com/google/cel-spec

             Supported fields:
             - creator: the creator in "users/{email}" format. Supports "==" and "!=".

             For example:
             creator == "users/alice@example.com"
        pageSize:
          type: integer
          title: page_size
          format: int32
          description: |-
            The maximum number of saved queries to return. The service may return
             fewer. Defaults to 10; values above 1000 are coerced to 1000.
        pageToken:
          type: string
          title: page_token
          description: |-
            A page token from a previous ListSavedQueries call. Keep every other
             parameter the same as the call that returned it.
        orderBy:
          type: string
          title: order_by
          description: |-
            Sort the results, per https://google.aip.dev/132#ordering. Supported
             fields: `update_time`, `create_time`, `title`; append " desc" for
             descending, e.g. "update_time desc" for most recently modified first.
             A modification is a title, content, database, or folder write; sharing
             and stars do not count, and a never-modified saved query counts its
             create time. Empty means `title` ascending. `resource_id` is always
             appended as a final tiebreak so pages stay stable.
      title: ListSavedQueriesRequest
      additionalProperties: false
    bytebase.v1.ListSavedQueriesResponse:
      type: object
      properties:
        savedQueries:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.SavedQuery'
          title: saved_queries
        nextPageToken:
          type: string
          title: next_page_token
          description: |-
            Pass to the next ListSavedQueries call to fetch the following page. Empty
             on the last page.
      title: ListSavedQueriesResponse
      additionalProperties: false
