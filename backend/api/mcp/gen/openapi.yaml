    bytebase.v1.SearchAuditLogsRequest:
      type: object
      properties:
        parent:
          type: string
          title: parent
        filter:
          type: string
          title: filter
          description: |-
            The filter of the log. It should be a valid CEL expression.
             The syntax and semantics of CEL are documented at https://github.com/google/cel-spec

             Supported filter:
             - method: the API name, can be found in the docs. Usually "/bytebase.v1.…", for example "/bytebase.v1.UserService/CreateUser"; entries written outside the v1 API carry their own prefix, such as "/bytebase.mcp.Session/Authorize" or "/bytebase.cli.Recovery/ResetUserPassword". Support "==" operator.
             - resource: the resource the entry is about, support "==" operator.
             - severity: support "==" operator, check Severity enum in AuditLog message for values.
             - user: the actor, should in "users/{email}" format, support "==" operator.
             - create_time: support ">=" and "<=" operator.
             - mcp: true selects the entries MCP produced, false the rest. A boolean, not a string. Support "==" operator.
             - mcp_correlation_id: the MCP session an entry belongs to, taken from an entry's mcp_delegation.correlation_id. Support "==" operator. Entries MCP produced outside a session — a refused connection or consent — carry none and match no value here.

             For example:
              - filter = "method == '/bytebase.v1.SQLService/Query'"
              - filter = "method == '/bytebase.v1.SQLService/Query' && severity == 'ERROR'"
              - filter = "method == '/bytebase.v1.SQLService/Query' && severity == 'ERROR' && user == 'users/bb@bytebase.com'"
              - filter = "method == '/bytebase.v1.SQLService/Query' && severity == 'ERROR' && create_time <= '2021-01-01T00:00:00Z' && create_time >= '2020-01-01T00:00:00Z'"
              - filter = "mcp == true"
              - filter = "mcp_correlation_id == '0b7f1a3c-1d2e-4f56-8a90-1b2c3d4e5f60'"
        orderBy:
          type: string
          title: order_by
          description: |-
            The order by of the log.
             Only support order by create_time. The default sorting order is ascending.
             For example:
              - order_by = "create_time asc"
              - order_by = "create_time desc"
        pageSize:
          type: integer
          title: page_size
          format: int32
          description: |-
            The maximum number of logs to return.
             The service may return fewer than this value.
             If unspecified, at most 10 log entries will be returned.
             The maximum value is 5000; values above 5000 will be coerced to 5000.
        pageToken:
          type: string
          title: page_token
          description: |-
            A page token, received from a previous `SearchLogs` call.
             Provide this to retrieve the subsequent page.
      title: SearchAuditLogsRequest
      additionalProperties: false
      description: Request message for searching audit logs.
    bytebase.v1.SearchAuditLogsResponse:
      type: object
      properties:
        auditLogs:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.AuditLog'
          title: audit_logs
        nextPageToken:
          type: string
          title: next_page_token
          description: |-
            A token to retrieve next page of log entities.
             Pass this value in the page_token field in the subsequent call
             to retrieve the next page of log entities.
      title: SearchAuditLogsResponse
      additionalProperties: false
      description: Response message for searching audit logs.
    bytebase.v1.SearchIssuesRequest:
      type: object
      properties:
        parent:
          type: string
          title: parent
          description: |-
            The parent, which owns this collection of issues.
             Format: projects/{project}
             Use the wildcard "projects/-" to search across collections (AIP-159); the
             result is restricted to the projects where the caller holds
             bb.issues.get. For a concrete project, the caller must hold bb.issues.get
             on that project or the request is denied.
        pageSize:
          type: integer
          title: page_size
          format: int32
          description: |-
            The maximum number of issues to return. The service may return fewer than
             this value.
             If unspecified, at most 10 issues will be returned.
             The maximum value is 1000; values above 1000 will be coerced to 1000.
        pageToken:
          type: string
          title: page_token
          description: |-
            A page token, received from a previous `SearchIssues` call.
             Provide this to retrieve the subsequent page.

             When paginating, all other parameters provided to `SearchIssues` must match
             the call that provided the page token.
        filter:
          type: string
          title: filter
          description: |-
            Filter is used to filter issues returned in the list.
             Check the filter field in the ListIssuesRequest message.
        query:
          type: string
          title: query
          description: Query is the query statement.
        orderBy:
          type: string
          title: order_by
          description: |-
            The order by of issues.
             Support:
             - create_time
             - update_time
             The default sorting order is ascending.
             For example:
             - order_by = "create_time desc"
             - order_by = "update_time asc"
      title: SearchIssuesRequest
      additionalProperties: false
    bytebase.v1.SearchIssuesResponse:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.Issue'
          title: issues
          description: The issues from the specified request.
        nextPageToken:
          type: string
          title: next_page_token
          description: |-
            A token, which can be sent as `page_token` to retrieve the next page.
             If this field is omitted, there are no subsequent pages.
      title: SearchIssuesResponse
      additionalProperties: false
    bytebase.v1.SearchMyAccessGrantsRequest:
