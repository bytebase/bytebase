          description: When the command was logged.
        range:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Range'
          title: range
          description: |-
            The byte offset range of the executed command in the sheet.
             Uses byte offsets (not character indices) for efficient slicing of sheet content bytes.
             Example: For "SELECT 你好;" in a UTF-8 sheet, range [0, 13) represents all 13 bytes.
        statement:
          type: string
          title: statement
          description: The executed statement.
        response:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.TaskRunLogEntry.CommandExecute.CommandResponse'
          title: response
          description: The response from executing the command.
      title: CommandExecute
      additionalProperties: false
      description: Command execution details.
