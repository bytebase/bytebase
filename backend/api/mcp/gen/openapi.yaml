    bytebase.v1.ListAccessGrantsRequest:
      type: object
      properties:
        parent:
          type: string
          title: parent
          description: |-
            The parent project of the access grants.
             Format: projects/{project}
        pageSize:
          type: integer
          title: page_size
          format: int32
          description: The maximum number of access grants to return.
        pageToken:
          type: string
          title: page_token
          description: A page token from a previous ListAccessGrants call.
        filter:
          type: string
          title: filter
          description: |-
            Filter expression using AIP-160 syntax.
             Supported fields:
             - name: the fullname in "projects/{project}/accessGrants/{access_grant}" format, support "==" operator.
             - creator: the creator name in "users/{email}" format, support "==" operator.
             - status: the access status, support "==" and "in" operator.
             - issue: the access issue fullname, support "==" operator.
             - expire_time: the access expire time in "2006-01-02T15:04:05Z07:00" format, support ">=", ">", "<=" and "<" operator.
             - create_time: the access creation time in "2006-01-02T15:04:05Z07:00" format, support ">=", ">", "<=" and "<" operator.
             - query: the access query, support "==" and ".contains(xx)" operator
             - target: the target database fullname, support "==" operator.
             - unmask: whether the grant allows unmasking sensitive data, support "==" operator with a boolean literal.
             - export: whether the grant allows exporting the query result, support "==" operator with a boolean literal.

             Examples:
             - creator == "users/dev@example.com"
             - status == "ACTIVE"
             - status in ["ACTIVE", "PENDING"]
             - creator == "users/dev@example.com" && status == "ACTIVE"
             - issue == "projects/x/issues/123"
             - status == "ACTIVE" && expire_time > "2024-02-01T00:00:00Z"
             - target == "instances/sample/databases/employee"
             - unmask == true
             - export == true && status == "ACTIVE"
        orderBy:
          type: string
          title: order_by
          description: |-
            The order by of access grants.
             Support creator, expire_time, create_time. The default sorting order is ascending.
             For example:
             - order_by = "creator"
             - order_by = "expire_time desc"
             - order_by = "expire_time asc, create_time desc"
      title: ListAccessGrantsRequest
      additionalProperties: false
    bytebase.v1.ListAccessGrantsResponse:
      type: object
      properties:
        accessGrants:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.AccessGrant'
          title: access_grants
          description: The access grants from the specified request.
