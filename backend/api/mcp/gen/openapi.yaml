             Format: projects/{project}/databaseGroups/{databaseGroup}
        view:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.DatabaseGroupView'
          title: view
          description: The view to return. Defaults to DATABASE_GROUP_VIEW_BASIC.
