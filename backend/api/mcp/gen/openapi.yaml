        name:
          type: string
          title: name
          description: |-
            The name of the workload identity.
             Format: workloadIdentities/{email}
        state:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.State'
          title: state
          description: The state of the workload identity.
        email:
          type: string
          title: email
          description: |-
            The email of the workload identity.
             For workspace-level: {name}@workload.bytebase.com
             For project-level: {name}@{project-id}.workload.bytebase.com
        title:
          type: string
          title: title
          maxLength: 200
          description: The display title of the workload identity.
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
          description: The timestamp when the workload identity was created.
        workloadIdentityConfig:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.WorkloadIdentityConfig'
          title: workload_identity_config
          description: The workload identity configuration for OIDC token validation.
      title: WorkloadIdentity
      additionalProperties: false
      description: WorkloadIdentity represents an external CI/CD workload identity.
    bytebase.v1.WorkloadIdentityConfig:
      type: object
      properties:
        providerType:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.WorkloadIdentityConfig.ProviderType'
          title: provider_type
          description: Provider configuration mode.
        issuerUrl:
          type: string
          title: issuer_url
          description: |-
            HTTPS URL of the OIDC issuer. The exchange fetches
             {issuer_url}/.well-known/openid-configuration to verify a token, unless
             jwks_url names the key set directly.
        allowedAudiences:
          type: array
          items:
            type: string
          title: allowed_audiences
          description: |-
            Audiences a token may be minted for. A token authenticates if its `aud`
             claim matches any entry.
        subjectPattern:
          type: string
          title: subject_pattern
          description: |-
            The subject a token must carry, e.g. "repo:owner/repo:ref:refs/heads/main".
             A trailing "*" is a prefix match. For GitHub and GitLab subjects it must
             complete an owner or group segment, so "repo:my-org/*" is accepted and
             "repo:*" is not. Other issuers write other vocabularies, so a wildcard
             outside those two is accepted as given.
        jwksUrl:
          type: string
          title: jwks_url
          description: Optional JWKS endpoint. When empty, use OIDC discovery from issuer_url.
      title: WorkloadIdentityConfig
      additionalProperties: false
      description: WorkloadIdentityConfig for API layer
    bytebase.v1.WorkloadIdentityConfig.ProviderType:
      type: string
      title: ProviderType
      enum:
        - PROVIDER_TYPE_UNSPECIFIED
        - GITHUB
        - GITLAB
        - OIDC
      description: ProviderType identifies the workload identity configuration mode.
    bytebase.v1.Workspace:
      type: object
      properties:
        name:
          type: string
          title: name
          description: 'Format: workspaces/{workspace}'
        title:
          type: string
          title: title
        logo:
          type: string
          title: logo
          description: The branding logo.
      title: Workspace
      additionalProperties: false
    bytebase.v1.WorkspaceApprovalSetting:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.WorkspaceApprovalSetting.Rule'
          title: rules
      title: WorkspaceApprovalSetting
      additionalProperties: false
    bytebase.v1.WorkspaceApprovalSetting.Rule:
      type: object
      properties:
        template:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.ApprovalTemplate'
          title: template
        condition:
          allOf:
            - $ref: '#/components/schemas/google.type.Expr'
          title: condition
          description: |-
            The condition that is associated with the rule.
             The syntax and semantics of CEL are documented at https://github.com/google/cel-spec

             The `source` field filters which rules apply. The `condition` field then evaluates with full context.

             All supported variables:
             statement.affected_rows: affected row count in the DDL/DML, support "==", "!=", "<", "<=", ">", ">=" operations.
             statement.table_rows: table row count number, support "==", "!=", "<", "<=", ">", ">=" operations.
             resource.environment_id: the environment resource id, support "==", "!=", "in [xx]", "!(in [xx])" operations.
             resource.project_id: the project resource id, support "==", "!=", "in [xx]", "!(in [xx])", "contains()", "matches()", "startsWith()", "endsWith()" operations.
             resource.db_engine: the database engine type, support "==", "!=", "in [xx]", "!(in [xx])" operations. Check the Engine enum for values.
             statement.sql_type: the SQL type, support "==", "!=", "in [xx]", "!(in [xx])" operations.
             resource.database_name: the database name, support "==", "!=", "in [xx]", "!(in [xx])", "contains()", "matches()", "startsWith()", "endsWith()" operations.
             resource.schema_name: the schema name, support "==", "!=", "in [xx]", "!(in [xx])", "contains()", "matches()", "startsWith()", "endsWith()" operations.
             resource.table_name: the table name, support "==", "!=", "in [xx]", "!(in [xx])", "contains()", "matches()", "startsWith()", "endsWith()" operations.
             statement.text: the SQL statement, support "contains()", "matches()", "startsWith()", "endsWith()" operations.
             request.expiration_days: the role expiration days for the request, support "==", "!=", "<", "<=", ">", ">=" operations.
             request.role: the request role full name, support "==", "!=", "in [xx]", "!(in [xx])", "contains()", "matches()", "startsWith()", "endsWith()" operations.

             When source is CHANGE_DATABASE, support: statement.*, resource.* (excluding request.*)
             When source is CREATE_DATABASE, support: resource.environment_id, resource.project_id, resource.db_engine, resource.database_name
             When source is REQUEST_ROLE, support: resource.project_id, request.expiration_days, request.role
             When source is REQUEST_ACCESS, support: resource.environment_id, resource.project_id, resource.db_engine, resource.database_name, resource.schema_name, resource.table_name, request.unmask, request.data_export

             For examples:
             resource.environment_id == "prod" && statement.affected_rows >= 100
             resource.table_name.matches("sensitive_.*") && resource.db_engine == "MYSQL"
        source:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.WorkspaceApprovalSetting.Rule.Source'
          title: source
      title: Rule
      additionalProperties: false
    bytebase.v1.WorkspaceApprovalSetting.Rule.Source:
      type: string
      title: Source
      enum:
        - SOURCE_UNSPECIFIED
        - CHANGE_DATABASE
        - CREATE_DATABASE
        - REQUEST_ROLE
        - REQUEST_ACCESS
    bytebase.v1.WorkspaceProfileSetting:
      type: object
      properties:
        externalUrl:
          type: string
          title: external_url
          description: The external URL is used for sso authentication callback.
        disallowSignup:
          type: boolean
          title: disallow_signup
          description: Disallow self-service signup, users can only be invited by the owner.
        requireMfa:
          type: boolean
          title: require_mfa
          description: Require MFA for all users.
        refreshTokenDuration:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: refresh_token_duration
          description: The duration for refresh token. Default is 7 days.
        announcement:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Announcement'
          title: announcement
          description: The setting of custom announcement
        maximumRequestExpiration:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: maximum_request_expiration
          description: The max expiration duration for data access requests.
        domains:
          type: array
          items:
            type: string
          title: domains
          description: The workspace domain, e.g., bytebase.com.
        enforceIdentityDomain:
          type: boolean
          title: enforce_identity_domain
          description: Only user and group from the domains can be created and login.
        databaseChangeMode:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.DatabaseChangeMode'
          title: database_change_mode
          description: The workspace database change mode.
        disallowPasswordSignin:
          type: boolean
          title: disallow_password_signin
          description: Whether password sign-in is disabled for all end users.
        enableMetricCollection:
          type: boolean
