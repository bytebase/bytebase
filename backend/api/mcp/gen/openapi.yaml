          title: filter
          description: |-
            The filter of the log. It should be a valid CEL expression.
             Check the filter field in the SearchAuditLogsRequest message.
        orderBy:
          type: string
          title: order_by
          description: |-
            The order by of the log.
             Only support order by create_time. The default sorting order is ascending.
             For example:
              - order_by = "create_time asc"
              - order_by = "create_time desc"
        format:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.ExportFormat'
          title: format
          description: The export format.
        pageSize:
          type: integer
          title: page_size
          format: int32
          description: |-
            The maximum number of logs to return.
             The service may return fewer than this value.
             If unspecified, at most 10 log entries will be returned.
             The maximum value is 5000; values above 5000 will be coerced to 5000.
        pageToken:
          type: string
          title: page_token
          description: |-
            A page token, received from a previous `ExportAuditLogs` call.
             Provide this to retrieve the subsequent page.
      title: ExportAuditLogsRequest
      additionalProperties: false
      description: Request message for exporting audit logs.
    bytebase.v1.ExportAuditLogsResponse:
      type: object
      properties:
        content:
          type: string
          title: content
          format: byte
          description: The exported audit log content in the requested format.
        nextPageToken:
          type: string
          title: next_page_token
          description: |-
            A token to retrieve next page of log entities.
             Pass this value in the page_token field in the subsequent call
             to retrieve the next page of log entities.
      title: ExportAuditLogsResponse
      additionalProperties: false
      description: Response message for exporting audit logs.
    bytebase.v1.ExportFormat:
      type: string
      title: ExportFormat
      enum:
        - FORMAT_UNSPECIFIED
        - CSV
        - JSON
        - SQL
        - XLSX
      description: Data export format.
    bytebase.v1.ExportRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            The name is the resource name to execute the export against.
             Format: instances/{instance}/databases/{database} or
             projects/{project}/instances/{instance}/databases/{database}
        statement:
          type: string
          title: statement
          description: The SQL statement to execute.
        limit:
          type: integer
          title: limit
          format: int32
          description: The maximum number of rows to return.
        format:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.ExportFormat'
          title: format
          description: The export format.
        admin:
          type: boolean
          title: admin
          description: |-
            The admin is used for workspace owner and DBA for exporting data from SQL
             Editor Admin mode. The exported data is not masked.
        password:
          type: string
          title: password
          description: The zip password provide by users.
        dataSourceId:
          type: string
          title: data_source_id
          description: |-
            The id of data source.
             If omitted, Export resolves the data source server-side by using the
             single read-only data source when exactly one exists, or the admin data
             source otherwise. It can also be set explicitly to export from the admin
             data source or a specific read-only data source.
        schema:
          type:
            - string
            - "null"
          title: schema
          description: |-
            The default schema to search objects. Equals to the current schema in
             Oracle and search path in Postgres.
        container:
          type:
            - string
            - "null"
          title: container
          description: |-
            Container is the container name to execute the query against, used for
             CosmosDB only.
      title: ExportRequest
      additionalProperties: false
    bytebase.v1.ExportResponse:
      type: object
      properties:
        content:
          type: string
          title: content
          format: byte
          description: The export file content.
        appliedAccessGrant:
          type: string
          title: applied_access_grant
          description: |-
            The just-in-time access grant applied to this export, if any.
             Format: projects/{project}/accessGrants/{accessGrant}.
             Empty when the user was authorized through normal ACL rather than a grant.
      title: ExportResponse
      additionalProperties: false
