  /bytebase.v1.AuthService/SendEmailLoginCode:
    post:
      tags:
        - bytebase.v1.AuthService
      summary: SendEmailLoginCode
      description: |-
        Sends a 6-digit verification code to the email for login/signup.
         Always returns success (no email enumeration). Enforces 60-sec resend cooldown.
         The signed-in counterpart is UserService.RequestReauthCode; LOGIN and
         REAUTH codes are not interchangeable.
         Permissions required: None
      operationId: bytebase.v1.AuthService.SendEmailLoginCode
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bytebase.v1.SendEmailLoginCodeRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.protobuf.Empty'
  /bytebase.v1.AuthService/Signup:
    post:
      tags:
        - bytebase.v1.AuthService
      summary: Signup
      description: |-
        Registers a new user account. Creates a principal and assigns a workspace:
         - If the user's email was pre-invited to a workspace, joins that workspace.
         - Otherwise, creates a new workspace with the user as admin.
         Returns access tokens so the user is logged in immediately after signup.
      operationId: bytebase.v1.AuthService.Signup
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bytebase.v1.SignupRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.LoginResponse'
