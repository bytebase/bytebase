    bytebase.v1.LoginIdentityProvider:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            The name of the identity provider.
             Format: idps/{idp}
        type:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.IdentityProviderType'
          title: type
          description: The type of identity provider protocol.
        title:
          type: string
          title: title
          description: The display title of the identity provider.
        authorizationRequest:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.AuthorizationRequest'
          title: authorization_request
          description: |-
            The parameters the browser needs to start the authorization redirect.
             Set for OAUTH2 and OIDC, absent for LDAP, whose bind happens server-side.
      title: LoginIdentityProvider
      additionalProperties: false
      description: |-
        LoginIdentityProvider is an identity provider as the login page sees it.
         Deliberately not a view of IdentityProvider: this message is served without
         a credential, so every field it exposes is published by hand and no
         provider configuration reaches it by default.
    bytebase.v1.LoginRequest:
      type: object
      properties:
        email:
          type: string
          title: email
          maxLength: 254
          description: |-
            User's email address.
             Bounded so an oversized identity is refused at the edge before any
             handler runs; the login-attempt lockout keys rows by this value.
        password:
          type: string
          title: password
          description: |
            User's password for authentication. Bounded for abuse only: LDAP
             directories may accept passwords beyond bcrypt's 72-byte limit, and the
             local-password path rejects longer inputs itself.
            string.max_bytes = 512
        web:
          type: boolean
          title: web
          description: |-
            If true, sets access token and refresh token as HTTP-only cookies instead of
             returning the token in the response body. Use for browser-based clients.
        idpName:
          type: string
          title: idp_name
          maxLength: 256
          description: |-
            The name of the identity provider.
             Format: idps/{idp}
        idpContext:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.IdentityProviderContext'
          title: idp_context
          description: The idp_context is used to get the user information from identity provider.
        otpCode:
          type:
            - string
            - "null"
          title: otp_code
          maxLength: 64
          description: The otp_code is used to verify the user's identity by MFA.
        recoveryCode:
          type:
            - string
            - "null"
          title: recovery_code
          maxLength: 64
          description: The recovery_code is used to recovery the user's identity with MFA.
        mfaTempToken:
          type:
            - string
            - "null"
          title: mfa_temp_token
          maxLength: 4096
          description: The mfa_temp_token is used to verify the user's identity by MFA.
        emailCode:
          type:
            - string
            - "null"
          title: email_code
          maxLength: 64
          description: |-
            6-digit code from email for passwordless login/signup.
             Pairs with `email`. Mutually exclusive with `password` and `idp_name`.
        workspace:
          type:
            - string
            - "null"
          title: workspace
          maxLength: 256
          description: |-
            Preferred workspace to land in after login. If the user is a member of this
             workspace, the token is issued for it; otherwise falls back to the default
             resolution (last login workspace → first membership). Typically populated
             from the ?workspace= query parameter in invite links.
             Format: workspaces/{workspace}
      title: LoginRequest
