          title: interval
        seats:
          type: integer
          title: seats
          format: int32
      title: CreatePurchaseRequest
      additionalProperties: false
    bytebase.v1.CreateReleaseRequest:
      type: object
      properties:
        parent:
          type: string
          title: parent
          description: 'Format: projects/{project}'
        release:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Release'
          title: release
          description: The release to create.
        releaseIdTemplate:
          type: string
          title: release_id_template
          description: |-
            Template for release ID generation.
             Available variables: {date}, {time}, {timestamp}, {iteration}.
             Example: "release_{date}-RC{iteration}" generates "release_20260119-RC00".
             Default: "release_{date}-RC{iteration}".
        releaseIdTimezone:
          type: string
          title: release_id_timezone
          description: |-
            Timezone for {date} and {time} variables in the template.
             Must be a valid IANA timezone (e.g., "UTC", "America/Los_Angeles").
             Default: "UTC".
      title: CreateReleaseRequest
      additionalProperties: false
    bytebase.v1.CreateReviewConfigRequest:
      type: object
      properties:
        reviewConfig:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.ReviewConfig'
          title: review_config
          description: The SQL review config to create.
      title: CreateReviewConfigRequest
      additionalProperties: false
    bytebase.v1.CreateRevisionRequest:
      type: object
      properties:
        parent:
          type: string
          title: parent
          description: 'Format: instances/{instance}/databases/{database} or projects/{project}/instances/{instance}/databases/{database}'
        revision:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Revision'
          title: revision
          description: The revision to create.
      title: CreateRevisionRequest
      additionalProperties: false
    bytebase.v1.CreateRoleRequest:
      type: object
      properties:
        role:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Role'
          title: role
          description: The role to create.
        roleId:
          type: string
          title: role_id
          description: |-
            The ID to use for the role, which will become the final component
             of the role's resource name.

             This value should be 4-63 characters, and valid characters
             are /[a-z][A-Z][0-9]/.
      title: CreateRoleRequest
      additionalProperties: false
    bytebase.v1.CreateRolloutRequest:
      type: object
      properties:
        parent:
          type: string
          title: parent
          description: |-
            The parent plan for which this rollout will be created.
             Format: projects/{project}/plans/{plan}
        target:
          type:
            - string
            - "null"
          title: target
          description: |-
            Create the rollout only for the specified target.
             Format: environments/{environment}
             If unspecified, all stages are created.
             If set to "", no stages are created.
      title: CreateRolloutRequest
      additionalProperties: false
    bytebase.v1.CreateSavedQueryRequest:
      type: object
      properties:
        parent:
          type: string
          title: parent
          description: |-
            The project to create the saved query in.
             Format: projects/{project}
        savedQuery:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.SavedQuery'
          title: saved_query
          description: The saved query to create.
      title: CreateSavedQueryRequest
      additionalProperties: false
    bytebase.v1.CreateServiceAccountRequest:
      type: object
      properties:
        parent:
          type: string
          title: parent
          description: |-
            The parent resource where this service account will be created.
             Format: projects/{project} for project-level, workspaces/{id} for workspace-level.
        serviceAccountId:
          type: string
          title: service_account_id
          description: |-
            The ID to use for the service account, which will become the final component
             of the service account's email in the format: {service_account_id}@service.bytebase.com
             or {service_account_id}@{project-id}.service.bytebase.com
        serviceAccount:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.ServiceAccount'
          title: service_account
          description: The service account to create.
      title: CreateServiceAccountRequest
      additionalProperties: false
      description: Request message for creating a service account.
    bytebase.v1.CreateSheetRequest:
      type: object
      properties:
        parent:
          type: string
          title: parent
          description: |-
            The parent resource where this sheet will be created.
             Format: projects/{project}
        sheet:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Sheet'
          title: sheet
          description: The sheet to create.
      title: CreateSheetRequest
      additionalProperties: false
    bytebase.v1.CreateUserRequest:
      type: object
      properties:
        user:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.User'
          title: user
          description: The user to create.
      title: CreateUserRequest
      additionalProperties: false
    bytebase.v1.CreateWorkloadIdentityRequest:
      type: object
      properties:
        parent:
          type: string
          title: parent
          description: |-
            The parent resource where this workload identity will be created.
             Format: projects/{project} for project-level, workspaces/{id} for workspace-level.
        workloadIdentityId:
          type: string
          title: workload_identity_id
          description: |-
            The ID to use for the workload identity, which will become the final component
             of the workload identity's email in the format: {workload_identity_id}@workload.bytebase.com
             or {workload_identity_id}@{project-id}.workload.bytebase.com
        workloadIdentity:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.WorkloadIdentity'
          title: workload_identity
          description: The workload identity to create.
      title: CreateWorkloadIdentityRequest
      additionalProperties: false
      description: Request message for creating a workload identity.
    bytebase.v1.CredentialProof:
      type: object
      anyOf:
        - type: object
          properties:
            currentPassword:
              type: string
              title: current_password
              description: |
                The account's current password. Refused by a factor-touching method
                 while a live MFA factor exists.
                string.max_bytes = 72
          title: current_password
        - type: object
          properties:
            emailCode:
              type: string
              title: email_code
              maxLength: 64
              description: |-
                A one-time code from RequestReauthCode. Bytebase Cloud only, and only
                 while the account has no live MFA factor.
          title: email_code
        - type: object
          properties:
            otpCode:
              type: string
              title: otp_code
              maxLength: 64
              description: A live code from the account's enrolled TOTP authenticator.
          title: otp_code
        - type: object
          properties:
            recoveryCode:
              type: string
              title: recovery_code
              maxLength: 64
              description: A single-use MFA recovery code.
          title: recovery_code
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - currentPassword
              - required:
                  - emailCode
              - required:
                  - otpCode
              - required:
                  - recoveryCode
          - not:
              oneOf:
                - required:
                    - currentPassword
                - required:
                    - emailCode
                - required:
                    - otpCode
                - required:
                    - recoveryCode
      title: CredentialProof
      description: |-
        One proof that the caller currently controls a credential on the account.
         Exactly one field must be set; enforced in the handler.
    bytebase.v1.DataClassificationSetting:
      type: object
      properties:
        configs:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.DataClassificationSetting.DataClassificationConfig'
          title: configs
      title: DataClassificationSetting
      additionalProperties: false
    bytebase.v1.DataClassificationSetting.DataClassificationConfig:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the uuid for classification. Each project can chose one classification config.
        title:
          type: string
          title: title
        levels:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.DataClassificationSetting.DataClassificationConfig.Level'
          title: levels
          description: levels is user defined level list for classification.
        classification:
          type: object
          title: classification
          additionalProperties:
            allOf:
              - $ref: '#/components/schemas/bytebase.v1.DataClassificationSetting.DataClassificationConfig.DataClassification'
            title: value
          description: |-
            classification is the id - DataClassification map.
             The id should in [0-9]+-[0-9]+-[0-9]+ format.
      title: DataClassificationConfig
      additionalProperties: false
    bytebase.v1.DataClassificationSetting.DataClassificationConfig.DataClassification:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the classification id in [0-9]+-[0-9]+-[0-9]+ format.
        title:
          type: string
          title: title
        level:
          type:
            - integer
            - "null"
          title: level
          format: int32
          description: The sensitivity level. Maps to Level.level.
      title: DataClassification
      additionalProperties: false
    bytebase.v1.DataClassificationSetting.DataClassificationConfig.Level:
      type: object
      properties:
        title:
          type: string
          title: title
        level:
          type: integer
          title: level
          format: int32
          description: The numeric level for ordering. Higher = more sensitive.
      title: Level
      additionalProperties: false
    bytebase.v1.DataSource:
      type: object
      anyOf:
        - type: object
          properties:
            awsCredential:
              allOf:
                - $ref: '#/components/schemas/bytebase.v1.DataSource.AWSCredential'
              title: aws_credential
          title: aws_credential
        - type: object
          properties:
            azureCredential:
              allOf:
                - $ref: '#/components/schemas/bytebase.v1.DataSource.AzureCredential'
              title: azure_credential
          title: azure_credential
        - type: object
          properties:
            gcpCredential:
              allOf:
                - $ref: '#/components/schemas/bytebase.v1.DataSource.GCPCredential'
              title: gcp_credential
          title: gcp_credential
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - awsCredential
              - required:
                  - azureCredential
              - required:
                  - gcpCredential
          - not:
              oneOf:
                - required:
                    - awsCredential
                - required:
                    - azureCredential
                - required:
                    - gcpCredential
      properties:
        id:
          type: string
          title: id
          description: The unique identifier for this data source.
        type:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.DataSourceType'
          title: type
          description: The type of data source (ADMIN or READ_ONLY).
        username:
          type: string
          title: username
          description: The username for database authentication.
        password:
          type: string
          title: password
          description: The password for database authentication.
        useSsl:
          type: boolean
          title: use_ssl
          description: Use SSL to connect to the data source. By default, we use system default SSL configuration.
        sslCa:
          type: string
          title: ssl_ca
          description: The SSL certificate authority certificate.
        sslCert:
          type: string
          title: ssl_cert
          description: The SSL client certificate.
        sslKey:
          type: string
          title: ssl_key
          description: The SSL client private key.
        sslCaPath:
          type: string
          title: ssl_ca_path
          description: The local filesystem path to the SSL certificate authority certificate.
        sslCertPath:
          type: string
          title: ssl_cert_path
          description: The local filesystem path to the SSL client certificate.
        sslKeyPath:
          type: string
          title: ssl_key_path
          description: The local filesystem path to the SSL client private key.
        sslCaSet:
          type: boolean
          title: ssl_ca_set
          description: Whether an SSL certificate authority certificate has been configured.
        sslCertSet:
          type: boolean
          title: ssl_cert_set
          description: Whether an SSL client certificate has been configured.
        sslKeySet:
          type: boolean
          title: ssl_key_set
          description: Whether an SSL client private key has been configured.
        sslCaPathSet:
          type: boolean
          title: ssl_ca_path_set
          description: Whether an SSL certificate authority path has been configured.
        sslCertPathSet:
          type: boolean
          title: ssl_cert_path_set
          description: Whether an SSL client certificate path has been configured.
        sslKeyPathSet:
          type: boolean
          title: ssl_key_path_set
          description: Whether an SSL client private key path has been configured.
        verifyTlsCertificate:
          type: boolean
          title: verify_tls_certificate
          description: |-
            verify_tls_certificate enables TLS certificate verification for SSL connections.
             Default is false (no verification) for backward compatibility.
             Set to true for secure connections (recommended for production).
             Only set to false for development or when certificates cannot be properly
             validated (e.g., self-signed certs, VPN environments).
        host:
          type: string
          title: host
          description: The hostname or IP address of the database server.
        port:
          type: string
          title: port
          description: The port number of the database server.
        database:
          type: string
          title: database
          description: The name of the database to connect to.
        srv:
          type: boolean
          title: srv
          description: |-
            srv, authentication_database and replica_set are used for MongoDB.
             srv is a boolean flag that indicates whether the host is a DNS SRV record.
        authenticationDatabase:
          type: string
          title: authentication_database
          description: authentication_database is the database name to authenticate against, which stores the user credentials.
        replicaSet:
          type: string
          title: replica_set
          description: replica_set is used for MongoDB replica set.
        sid:
          type: string
          title: sid
          description: sid and service_name are used for Oracle.
        serviceName:
          type: string
          title: service_name
        sshHost:
          type: string
          title: ssh_host
          description: |-
            Connection over SSH.
             The hostname of the SSH server agent.
             Required.
        sshPort:
          type: string
          title: ssh_port
          description: |-
            The port of the SSH server agent. It's 22 typically.
             Required.
        sshUser:
          type: string
          title: ssh_user
          description: |-
            The user to login the server.
             Required.
        sshPassword:
          type: string
          title: ssh_password
          description: The password to login the server. If it's empty string, no password is required.
        sshPrivateKey:
          type: string
          title: ssh_private_key
          description: The private key to login the server. If it's empty string, we will use the system default private key from os.Getenv("SSH_AUTH_SOCK").
        authenticationPrivateKey:
          type: string
          title: authentication_private_key
          description: |-
            PKCS#8 private key in PEM format. If it's empty string, no private key is required.
             Used for authentication when connecting to the data source.
        authenticationPrivateKeyPassphrase:
          type: string
          title: authentication_private_key_passphrase
          description: Passphrase for the encrypted PKCS#8 private key. Only used when the private key is encrypted.
        externalSecret:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.DataSourceExternalSecret'
          title: external_secret
        authenticationType:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.DataSource.AuthenticationType'
          title: authentication_type
        cloudSqlIpType:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.DataSource.CloudSQLIPType'
          title: cloud_sql_ip_type
          description: |-
            cloud_sql_ip_type selects the Cloud SQL IP type for Google Cloud SQL IAM connections.
             CLOUD_SQL_IP_TYPE_UNSPECIFIED is treated as PUBLIC for backward compatibility.
        saslConfig:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.SASLConfig'
          title: sasl_config
        additionalAddresses:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.DataSource.Address'
          title: additional_addresses
          description: additional_addresses is used for MongoDB replica set.
        directConnection:
          type: boolean
          title: direct_connection
          description: direct_connection is used for MongoDB to dispatch all the operations to the node specified in the connection string.
        region:
          type: string
          title: region
          description: region is the location of where the DB is, works for AWS RDS. For example, us-east-1.
        warehouseId:
          type: string
          title: warehouse_id
          description: warehouse_id is used by Databricks.
        masterName:
          type: string
          title: master_name
          description: master_name is the master name used by connecting redis-master via redis sentinel.
        masterUsername:
          type: string
          title: master_username
          description: master_username and master_password are master credentials used by redis sentinel mode.
        masterPassword:
          type: string
          title: master_password
        redisType:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.DataSource.RedisType'
          title: redis_type
        extraConnectionParameters:
          type: object
          title: extra_connection_parameters
          additionalProperties:
            type: string
            title: value
          description: |-
            Extra connection parameters for the database connection.
             For PostgreSQL HA, this can be used to set target_session_attrs=read-write
        projectId:
          type: string
          title: project_id
          description: |-
            project_id and instance_id are the GCP resource identifiers.
             project_id is used by Spanner and BigQuery; instance_id is used by Spanner.
             For these engines, host and port optionally override the default Google API
             endpoint (e.g. a Private Service Connect endpoint like
             spanner-nonprod.p.googleapis.com).
        instanceId:
          type: string
          title: instance_id
      title: DataSource
    bytebase.v1.DataSource.AWSCredential:
      type: object
      properties:
        accessKeyId:
          type: string
          title: access_key_id
        secretAccessKey:
          type: string
          title: secret_access_key
        sessionToken:
          type: string
          title: session_token
        roleArn:
          type: string
          title: role_arn
          description: |-
            ARN of IAM role to assume for cross-account access.
             See: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use.html
        externalId:
          type: string
          title: external_id
          description: |-
            Optional external ID for additional security when assuming role.
             See: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_create_for-user_externalid.html
      title: AWSCredential
      additionalProperties: false
    bytebase.v1.DataSource.Address:
      type: object
      properties:
        host:
          type: string
          title: host
        port:
          type: string
          title: port
      title: Address
      additionalProperties: false
    bytebase.v1.DataSource.AuthenticationType:
      type: string
      title: AuthenticationType
      enum:
        - AUTHENTICATION_UNSPECIFIED
        - PASSWORD
        - GOOGLE_CLOUD_SQL_IAM
        - AWS_RDS_IAM
        - AZURE_IAM
    bytebase.v1.DataSource.AzureCredential:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        clientId:
          type: string
          title: client_id
        clientSecret:
          type: string
          title: client_secret
      title: AzureCredential
      additionalProperties: false
    bytebase.v1.DataSource.CloudSQLIPType:
      type: string
      title: CloudSQLIPType
      enum:
        - CLOUD_SQL_IP_TYPE_UNSPECIFIED
        - PUBLIC
        - PRIVATE
        - PSC
      description: CloudSQLIPType selects which Cloud SQL IP to dial for Google Cloud SQL IAM connections.
    bytebase.v1.DataSource.GCPCredential:
      type: object
      properties:
        content:
          type: string
          title: content
      title: GCPCredential
      additionalProperties: false
    bytebase.v1.DataSource.RedisType:
      type: string
      title: RedisType
      enum:
        - REDIS_TYPE_UNSPECIFIED
        - STANDALONE
        - SENTINEL
        - CLUSTER
    bytebase.v1.DataSourceExternalSecret:
      type: object
      anyOf:
        - type: object
          properties:
            appRole:
              allOf:
                - $ref: '#/components/schemas/bytebase.v1.DataSourceExternalSecret.AppRoleAuthOption'
              title: app_role
              description: AppRole authentication configuration.
          title: app_role
        - type: object
          properties:
            token:
              type: string
              title: token
              description: |-
                Token for direct authentication. Interpreted according to token_type:
                 the literal token (PLAIN), an environment variable name (ENVIRONMENT),
                 or a file path (FILE).
          title: token
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - appRole
              - required:
                  - token
          - not:
              oneOf:
                - required:
                    - appRole
                - required:
                    - token
      properties:
        secretType:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.DataSourceExternalSecret.SecretType'
          title: secret_type
          description: The type of external secret store.
        url:
          type: string
          title: url
          description: The URL of the external secret store.
        authType:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.DataSourceExternalSecret.AuthType'
          title: auth_type
          description: The authentication method for accessing the secret store.
        tokenType:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.DataSourceExternalSecret.TokenType'
          title: token_type
          description: How to interpret the token field when auth_type is TOKEN.
        engineName:
          type: string
          title: engine_name
          description: engine name is the name for secret engine.
        secretName:
          type: string
          title: secret_name
          description: the secret name in the engine to store the password.
        passwordKeyName:
          type: string
          title: password_key_name
          description: the key name for the password.
        skipVaultTlsVerification:
          type: boolean
          title: skip_vault_tls_verification
          description: |-
            TLS configuration for connecting to Vault server.
             These fields are separate from the database TLS configuration in DataSource.
             skip_vault_tls_verification disables TLS certificate verification for Vault connections.
             Default is false (verification enabled) for security.
             Only set to true for development or when certificates cannot be properly validated.
        vaultSslCa:
          type: string
          title: vault_ssl_ca
          description: CA certificate for Vault server verification.
        vaultSslCert:
          type: string
          title: vault_ssl_cert
          description: Client certificate for mutual TLS authentication with Vault.
        vaultSslKey:
          type: string
          title: vault_ssl_key
          description: Client private key for mutual TLS authentication with Vault.
      title: DataSourceExternalSecret
    bytebase.v1.DataSourceExternalSecret.AppRoleAuthOption:
      type: object
      properties:
        roleId:
          type: string
          title: role_id
          description: The role ID for Vault AppRole authentication.
        secretId:
          type: string
          title: secret_id
          description: the secret id for the role without ttl.
        type:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.DataSourceExternalSecret.AppRoleAuthOption.SecretType'
          title: type
          description: The type of secret for AppRole authentication.
        mountPath:
          type: string
          title: mount_path
          description: The path where the approle auth method is mounted.
      title: AppRoleAuthOption
      additionalProperties: false
    bytebase.v1.DataSourceExternalSecret.AppRoleAuthOption.SecretType:
