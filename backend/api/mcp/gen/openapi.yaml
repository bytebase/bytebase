  /bytebase.v1.AuthService/RequestPasswordReset:
    post:
      tags:
        - bytebase.v1.AuthService
      summary: RequestPasswordReset
      description: |-
        Requests a password reset email for the given email address.
         Always returns success to avoid leaking whether the email exists.
         Requires the workspace's SMTP mail delivery setting; without it the
         recovery route is an admin password reset.
         Permissions required: None
      operationId: bytebase.v1.AuthService.RequestPasswordReset
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
