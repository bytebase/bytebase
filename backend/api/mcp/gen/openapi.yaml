    bytebase.v1.SavedQuery:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            Server-generated.
             Format: projects/{project}/savedQueries/{savedQuery}
        project:
          type: string
          title: project
          description: 'Format: projects/{project}'
        database:
          type: string
          title: database
          description: |-
            The connected database, which must belong to the saved query's own
             project. Empty when none is connected, or when the database no longer
             exists.
             Format: instances/{instance}/databases/{database} or projects/{project}/instances/{instance}/databases/{database}
        title:
          type: string
          title: title
          maxLength: 200
          description: The title of the saved query.
        creator:
          type: string
          title: creator
          description: |-
            The owner. Ownership does not transfer.
             Format: users/{email}
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
        content:
          type: string
          title: content
          format: byte
          description: |-
            The SQL text. SearchSavedQueries returns a truncated preview;
             GetSavedQuery returns the full text.
        contentSize:
          type: string
          title: content_size
          format: int64
          description: The full size of the content, which may exceed the `content` returned.
        starred:
          type: boolean
          title: starred
          description: Whether the calling user starred it.
        folder:
          type: string
          title: folder
          maxLength: 256
          description: |-
            The folder holding this saved query. A path like "a/b/c"; empty means
             unfiled.
      title: SavedQuery
      additionalProperties: false
    bytebase.v1.SavedQueryBinding:
      type: object
      properties:
        level:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.SavedQueryBinding.Level'
          title: level
        members:
          type: array
          items:
            type: string
          title: members
          minItems: 1
          description: |-
            The members granted `level`: "user:{email}" or "group:{email}" only.

             Service accounts cannot be grantees — they reach their own saved queries
             as the creator. Naming one under "user:" grants nothing rather than
             failing. Groups are stored as references, so membership stays live.
      title: SavedQueryBinding
      additionalProperties: false
      description: Binds members to one access level on one saved query.
    bytebase.v1.SavedQueryBinding.Level:
      type: string
      title: Level
      enum:
        - LEVEL_UNSPECIFIED
        - VIEWER
        - EDITOR
      description: |-
        Nested to avoid colliding with the package-scoped EDITOR in
         DatabaseChangeMode.
    bytebase.v1.SavedQueryPolicy:
      type: object
      properties:
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.SavedQueryBinding'
          title: bindings
          description: |-
            At most one binding per level. A member listed under two levels is
             rejected rather than resolved to the higher one.
        etag:
          type: string
          title: etag
          description: |-
            The etag of the policy as read. SetSavedQueryPolicy requires it and fails
             with ABORTED when it no longer matches.
      title: SavedQueryPolicy
      additionalProperties: false
      description: |-
        Who a saved query is shared with, and at what level. No bindings means
         private. The creator is never a binding member; ownership cannot be granted.
