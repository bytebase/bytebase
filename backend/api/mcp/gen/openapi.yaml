                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.LoginResponse'
  /bytebase.v1.WorkspaceService/GetIamPolicy:
    post:
      tags:
        - bytebase.v1.WorkspaceService
      summary: GetIamPolicy
      description: |-
        Retrieves IAM policy for the workspace.
         Permissions required: bb.workspaces.getIamPolicy
      operationId: bytebase.v1.WorkspaceService.GetIamPolicy
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bytebase.v1.GetIamPolicyRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.IamPolicy'
  /bytebase.v1.WorkspaceService/GetWorkspace:
    post:
      tags:
        - bytebase.v1.WorkspaceService
      summary: GetWorkspace
      description: |-
        Gets a workspace by name.
         Supports "workspaces/-" to resolve the current workspace:
         - Authenticated: uses the workspace from JWT context
         - Self-hosted unauthenticated: returns the single workspace
         - SaaS unauthenticated: returns minimal response
      operationId: bytebase.v1.WorkspaceService.GetWorkspace
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bytebase.v1.GetWorkspaceRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Workspace'
  /bytebase.v1.WorkspaceService/LeaveWorkspace:
    post:
      tags:
        - bytebase.v1.WorkspaceService
      summary: LeaveWorkspace
      description: |-
        Removes the calling user from a workspace and switches to the next
         available workspace. Available to any workspace member. Fails if the
         caller is the last workspace admin.
      operationId: bytebase.v1.WorkspaceService.LeaveWorkspace
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bytebase.v1.LeaveWorkspaceRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.LoginResponse'
  /bytebase.v1.WorkspaceService/ListWorkspaces:
    post:
      tags:
        - bytebase.v1.WorkspaceService
      summary: ListWorkspaces
      description: Lists all workspaces the current user is a member of.
      operationId: bytebase.v1.WorkspaceService.ListWorkspaces
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bytebase.v1.ListWorkspacesRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.ListWorkspacesResponse'
  /bytebase.v1.WorkspaceService/RotateDirectorySyncToken:
    post:
      tags:
        - bytebase.v1.WorkspaceService
      summary: RotateDirectorySyncToken
      description: |-
        Mints a new directory sync (SCIM) token, immediately invalidating the
         previous one. The plaintext token is returned exactly once and cannot be
         retrieved afterwards; only its hash is stored. Callers that lose it must
         rotate again and update their identity provider.
         Permissions required: bb.workspaces.rotateDirectorySyncToken
      operationId: bytebase.v1.WorkspaceService.RotateDirectorySyncToken
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bytebase.v1.RotateDirectorySyncTokenRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.RotateDirectorySyncTokenResponse'
  /bytebase.v1.WorkspaceService/SetIamPolicy:
    post:
      tags:
        - bytebase.v1.WorkspaceService
      summary: SetIamPolicy
      description: |-
        Sets IAM policy for the workspace.
         Permissions required: bb.workspaces.setIamPolicy
      operationId: bytebase.v1.WorkspaceService.SetIamPolicy
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bytebase.v1.SetIamPolicyRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.IamPolicy'
  /bytebase.v1.WorkspaceService/UpdateWorkspace:
    post:
      tags:
        - bytebase.v1.WorkspaceService
      summary: UpdateWorkspace
      description: Updates a workspace. Currently only title can be updated.
      operationId: bytebase.v1.WorkspaceService.UpdateWorkspace
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bytebase.v1.UpdateWorkspaceRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bytebase.v1.Workspace'
components:
  schemas:
    bytebase.v1.AIChatMessage:
      type: object
      properties:
        role:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.AIChatMessageRole'
          title: role
          description: The role of the message sender.
        content:
          type:
            - string
            - "null"
          title: content
          description: The text content of the message. Optional for assistant messages that only contain tool calls.
        toolCalls:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.AIChatToolCall'
          title: tool_calls
          description: Tool calls made by the assistant. Only present in assistant messages.
        toolCallId:
          type:
            - string
            - "null"
          title: tool_call_id
          description: The ID of the tool call this message is responding to. Only present in tool messages.
      title: AIChatMessage
      additionalProperties: false
      description: A single message in the conversation.
    bytebase.v1.AIChatMessageRole:
      type: string
      title: AIChatMessageRole
      enum:
        - AI_CHAT_MESSAGE_ROLE_UNSPECIFIED
        - AI_CHAT_MESSAGE_ROLE_SYSTEM
        - AI_CHAT_MESSAGE_ROLE_USER
        - AI_CHAT_MESSAGE_ROLE_ASSISTANT
        - AI_CHAT_MESSAGE_ROLE_TOOL
      description: Role of a chat message.
    bytebase.v1.AIChatRequest:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.AIChatMessage'
          title: messages
          description: The conversation messages.
        toolDefinitions:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.AIChatToolDefinition'
          title: tool_definitions
          description: The tool definitions available to the AI.
      title: AIChatRequest
      additionalProperties: false
      description: Request message for AIService.Chat.
    bytebase.v1.AIChatResponse:
      type: object
      properties:
        content:
          type:
            - string
            - "null"
          title: content
          description: The text content of the AI response. Optional when the response only contains tool calls.
        toolCalls:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.AIChatToolCall'
          title: tool_calls
          description: Tool calls the AI wants to make.
        usage:
          oneOf:
            - $ref: '#/components/schemas/bytebase.v1.AIChatUsage'
            - type: "null"
          title: usage
          description: Token usage for this provider call, when available.
      title: AIChatResponse
      additionalProperties: false
      description: Response message for AIService.Chat.
    bytebase.v1.AIChatToolCall:
      type: object
      properties:
        id:
          type: string
          title: id
          description: The unique ID of this tool call.
        name:
          type: string
          title: name
          description: The name of the tool to call.
        arguments:
          type: string
          title: arguments
          description: The JSON-encoded arguments to pass to the tool.
        metadata:
          type:
            - string
            - "null"
          title: metadata
          description: |-
            Opaque provider-specific metadata (e.g., Gemini thought_signature).
             Frontend must echo this back unchanged when sending tool results.
      title: AIChatToolCall
      additionalProperties: false
      description: A tool call made by the AI.
    bytebase.v1.AIChatToolDefinition:
      type: object
      properties:
        name:
          type: string
          title: name
          description: The name of the tool.
        description:
          type: string
          title: description
          description: A description of what the tool does.
        parametersSchema:
          type: string
          title: parameters_schema
          description: The JSON Schema describing the tool's parameters.
      title: AIChatToolDefinition
      additionalProperties: false
      description: A tool definition that the AI can invoke.
    bytebase.v1.AIChatUsage:
      type: object
      properties:
        totalTokens:
          type: integer
          title: total_tokens
          format: int32
          description: Total tokens used by the provider call.
      title: AIChatUsage
      additionalProperties: false
      description: Token usage for a single AI provider call.
    bytebase.v1.AISetting:
      type: object
      properties:
        enabled:
          type: boolean
          title: enabled
        provider:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.AISetting.Provider'
          title: provider
        endpoint:
          type: string
          title: endpoint
        apiKey:
          type: string
          title: api_key
        model:
          type: string
          title: model
        version:
          type: string
          title: version
      title: AISetting
      additionalProperties: false
    bytebase.v1.AISetting.Provider:
      type: string
      title: Provider
      enum:
        - PROVIDER_UNSPECIFIED
        - OPEN_AI
        - CLAUDE
        - GEMINI
        - AZURE_OPENAI
    bytebase.v1.AccessGrant:
      type: object
      anyOf:
        - type: object
          properties:
            expireTime:
              allOf:
                - $ref: '#/components/schemas/google.protobuf.Timestamp'
              title: expire_time
              description: The expiration time of the access grant.
          title: expire_time
        - type: object
          properties:
            ttl:
              allOf:
                - $ref: '#/components/schemas/google.protobuf.Duration'
              title: ttl
              description: |-
                Input only. The time-to-live duration for the access grant.
                 The server computes `expire_time` from this value at activation time.
          title: ttl
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - expireTime
              - required:
                  - ttl
          - not:
              oneOf:
                - required:
                    - expireTime
                - required:
                    - ttl
      properties:
        name:
          type: string
          title: name
          description: |-
            The name of the access grant, generated by the server.
             Format: projects/{project}/accessGrants/{access_grant}
             The {access_grant} segment is a server-generated unique ID.
        creator:
          type: string
          title: creator
          description: |-
            The creator of the access grant.
             Format: users/{email}
        status:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.AccessGrant.Status'
          title: status
          description: |-
            The status of the access grant.
             An ACTIVE grant with `expire_time` in the past is effectively expired
             and no longer authorizes access. Use `expire_time` to determine
             whether an ACTIVE grant has expired.
        issue:
          type: string
          title: issue
          description: |-
            The issue associated with the access grant.
             Can be empty.
             Format: projects/{project}/issues/{issue}
        targets:
          type: array
          items:
            type: string
          title: targets
          description: |-
            The target databases for this access grant.
             Format: instances/{instance}/databases/{database} or projects/{project}/instances/{instance}/databases/{database}
        query:
          type: string
          title: query
          description: The query permission granted.
        unmask:
          type: boolean
          title: unmask
          description: Whether the grant allows unmasking sensitive data.
        createTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: create_time
        updateTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: update_time
        reason:
          type: string
          title: reason
        export:
          type: boolean
          title: export
          description: Whether export the query result.
        schema:
          type: string
          title: schema
          description: The default schema to execute the query.
        container:
          type: string
          title: container
          description: The container name to execute the query against, used for CosmosDB only.
      title: AccessGrant
    bytebase.v1.AccessGrant.Status:
      type: string
      title: Status
      enum:
        - STATUS_UNSPECIFIED
        - PENDING
        - ACTIVE
        - REVOKED
      description: The status of the access grant.
    bytebase.v1.ActivateAccessGrantRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            The name of the access grant to activate.
             Format: projects/{project}/accessGrants/{access_grant}
      title: ActivateAccessGrantRequest
      additionalProperties: false
    bytebase.v1.Activity:
      type: object
      title: Activity
      additionalProperties: false
      description: Activity types for webhook notifications.
    bytebase.v1.Activity.Type:
      type: string
      title: Type
      enum:
        - TYPE_UNSPECIFIED
        - ISSUE_CREATED
        - ISSUE_APPROVAL_REQUESTED
        - ISSUE_SENT_BACK
        - PIPELINE_FAILED
        - PIPELINE_COMPLETED
        - ISSUE_APPROVED
      description: Activity type enumeration.
    bytebase.v1.ActuatorInfo:
      type: object
      properties:
        version:
          type: string
          title: version
          description: The Bytebase server version.
        gitCommit:
          type: string
          title: git_commit
          description: The git commit hash of the build.
        saas:
          type: boolean
          title: saas
          description: Whether the Bytebase instance is running in SaaS mode where some features cannot be edited by users.
        externalUrl:
          type: string
          title: external_url
          description: The external URL where users or webhook callbacks access Bytebase.
        lastActiveTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_active_time
          description: The last time any API call was made, refreshed on each request.
        workspace:
          type: string
          title: workspace
          description: |-
            The unique identifier for the workspace.
             Format: workspaces/{id}
        unlicensedFeatures:
          type: array
          items:
            type: string
          title: unlicensed_features
          description: List of features that are not licensed.
        activatedInstanceCount:
          type: integer
          title: activated_instance_count
          format: int32
          description: The number of activated database instances.
        totalInstanceCount:
          type: integer
          title: total_instance_count
          format: int32
          description: The total number of database instances.
        externalUrlFromFlag:
          type: boolean
          title: external_url_from_flag
          description: Whether the external URL is set via command-line flag (and thus cannot be changed via UI).
        replicaCount:
          type: integer
          title: replica_count
          format: int32
          description: The number of active replicas (servers sharing the same database).
        defaultProject:
          type: string
          title: default_project
          description: |-
            The default project for unassigned databases.
             Format: projects/{id}
        userCountInIam:
          type: integer
          title: user_count_in_iam
          format: int32
          description: The number of users in the workspace IAM (for seat limit display).
        activeVcsUserCount:
          type: integer
          title: active_vcs_user_count
          format: int32
          description: The number of active VCS users seen in the active window.
        sample:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.SampleInfo'
          title: sample
          description: Sample setup availability and provisioned resources.
        mcpSetting:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.MCPSetting'
          title: mcp_setting
          description: The MCP (Model Context Protocol) setting in the current workspace.
      title: ActuatorInfo
      additionalProperties: false
      description: |-
        System information and configuration for the Bytebase instance.
         Actuator concept is similar to the Spring Boot Actuator.
    bytebase.v1.AddDataSourceRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            The name of the instance to add a data source to.
             Format: instances/{instance} or projects/{project}/instances/{instance}
        dataSource:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.DataSource'
          title: data_source
          description: |-
            Identified by data source ID.
             Only READ_ONLY data source can be added.
        validateOnly:
          type: boolean
          title: validate_only
          description: Validate only also tests the data source connection.
      title: AddDataSourceRequest
      additionalProperties: false
    bytebase.v1.AddWebhookRequest:
      type: object
      properties:
        project:
          type: string
          title: project
          description: |-
            The name of the project to add the webhook to.
             Format: projects/{project}
        webhook:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Webhook'
          title: webhook
          description: The webhook to add.
      title: AddWebhookRequest
      additionalProperties: false
    bytebase.v1.AdminExecuteRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |-
            The name is the instance name to execute the query against.
             Format: instances/{instance}/databases/{databaseName} or
             projects/{project}/instances/{instance}/databases/{databaseName}
        statement:
          type: string
          title: statement
          description: The SQL statement to execute.
        limit:
          type: integer
          title: limit
          format: int32
          description: The maximum number of rows to return.
        schema:
          type:
            - string
            - "null"
          title: schema
          description: |-
            The default schema to execute the statement. Equals to the current schema
             in Oracle and search path in Postgres.
        container:
          type:
            - string
            - "null"
          title: container
          description: |-
            Container is the container name to execute the query against, used for
             CosmosDB only.
      title: AdminExecuteRequest
      additionalProperties: false
    bytebase.v1.AdminExecuteResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.QueryResult'
          title: results
          description: The query results.
      title: AdminExecuteResponse
      additionalProperties: false
    bytebase.v1.Advice:
      type: object
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Advice.Level'
          title: status
          description: The advice level.
        code:
          type: integer
          title: code
          format: int32
          description: The advice code.
        title:
          type: string
          title: title
          description: The advice title.
        content:
          type: string
          title: content
          description: The advice content.
        startPosition:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Position'
          title: start_position
          description: |-
            The start_position is inclusive and the end_position is exclusive.
             TODO: use range instead
        endPosition:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Position'
          title: end_position
        ruleType:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Advice.RuleType'
          title: rule_type
          description: The type of linting rule that generated this advice.
      title: Advice
      additionalProperties: false
    bytebase.v1.Advice.Level:
      type: string
      title: Level
      enum:
        - ADVICE_LEVEL_UNSPECIFIED
        - SUCCESS
        - WARNING
        - ERROR
      description: Level represents the severity level of the advice.
    bytebase.v1.Advice.RuleType:
      type: string
      title: RuleType
      enum:
        - RULE_TYPE_UNSPECIFIED
        - PARSER_BASED
        - AI_POWERED
      description: RuleType indicates the source of the linting rule.
    bytebase.v1.Algorithm:
      type: object
      anyOf:
        - type: object
          properties:
            fullMask:
              allOf:
                - $ref: '#/components/schemas/bytebase.v1.Algorithm.FullMask'
              title: full_mask
          title: full_mask
        - type: object
          properties:
            innerOuterMask:
              allOf:
                - $ref: '#/components/schemas/bytebase.v1.Algorithm.InnerOuterMask'
              title: inner_outer_mask
          title: inner_outer_mask
        - type: object
          properties:
            md5Mask:
              allOf:
                - $ref: '#/components/schemas/bytebase.v1.Algorithm.MD5Mask'
              title: md5_mask
          title: md5_mask
        - type: object
          properties:
            rangeMask:
              allOf:
                - $ref: '#/components/schemas/bytebase.v1.Algorithm.RangeMask'
              title: range_mask
          title: range_mask
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - fullMask
              - required:
                  - innerOuterMask
              - required:
                  - md5Mask
              - required:
                  - rangeMask
          - not:
              oneOf:
                - required:
                    - fullMask
                - required:
                    - innerOuterMask
                - required:
                    - md5Mask
                - required:
                    - rangeMask
      title: Algorithm
    bytebase.v1.Algorithm.FullMask:
      type: object
      properties:
        substitution:
          type: string
          title: substitution
          description: |-
            substitution is the string used to replace the original value, the
             max length of the string is 16 bytes.
      title: FullMask
      additionalProperties: false
    bytebase.v1.Algorithm.InnerOuterMask:
      type: object
      properties:
        prefixLen:
          type: integer
          title: prefix_len
          format: int32
        suffixLen:
          type: integer
          title: suffix_len
          format: int32
        type:
          allOf:
            - $ref: '#/components/schemas/bytebase.v1.Algorithm.InnerOuterMask.MaskType'
          title: type
        substitution:
          type: string
          title: substitution
      title: InnerOuterMask
      additionalProperties: false
    bytebase.v1.Algorithm.InnerOuterMask.MaskType:
      type: string
      title: MaskType
      enum:
        - MASK_TYPE_UNSPECIFIED
        - INNER
        - OUTER
    bytebase.v1.Algorithm.MD5Mask:
      type: object
      properties:
        salt:
          type: string
          title: salt
          description: salt is the salt value to generate a different hash that with the word alone.
      title: MD5Mask
      additionalProperties: false
    bytebase.v1.Algorithm.RangeMask:
      type: object
      properties:
        slices:
          type: array
          items:
            $ref: '#/components/schemas/bytebase.v1.Algorithm.RangeMask.Slice'
          title: slices
          description: |-
            We store it as a repeated field to face the fact that the original value may have multiple parts should be masked.
             But frontend can be started with a single rule easily.
      title: RangeMask
      additionalProperties: false
    bytebase.v1.Algorithm.RangeMask.Slice:
      type: object
      properties:
        start:
          type: integer
          title: start
          format: int32
          description: |-
            start is the start character index (0-based) of the original value, should be less than end.
             Uses character indices (not byte offsets) for display-oriented masking.
             Example: For "你好world", character index 2 refers to 'w' (the 3rd character).
        end:
          type: integer
          title: end
          format: int32
          description: |-
            end is the end character index (exclusive) of the original value.
             Uses character indices (not byte offsets) for display-oriented masking.
        substitution:
          type: string
          title: substitution
          description: substitution is the string used to replace the OriginalValue[start:end).
      title: Slice
      additionalProperties: false
