description: >-
  The foreign keys from orders to customers and from order_items to orders
  are ON DELETE CASCADE, so deleting old customers also deletes their orders
  and every line of those orders, the sales history the author meant to keep.
  Only the foreign keys of the tables the statement never names show it.
engine: POSTGRES
version: "16.0.4"
environment: prod
statement: |
  -- Remove the customers who closed their accounts before 2020.
  DELETE FROM customers WHERE closed_at < '2020-01-01';
schema:
  name: shop
  character_set: UTF8
  collation: en_US.UTF-8
  owner: shop_owner
  search_path: '"$user", public'
  schemas:
    - name: public
      owner: pg_database_owner
      comment: standard public schema
      tables:
        - name: customers
          owner: shop_owner
          row_count: 920000
          data_size: 138412032
          index_size: 52428800
          columns:
            - {name: id, position: 1, type: bigint, default: "nextval('public.customers_id_seq'::regclass)"}
            - {name: email, position: 2, type: text}
            - {name: created_at, position: 3, type: timestamp(6) with time zone, default: "now()"}
            - {name: closed_at, position: 4, type: timestamp(6) with time zone, nullable: true}
          indexes:
            - name: customers_pkey
              expressions: [id]
              type: btree
              unique: true
              primary: true
              is_constraint: true
              definition: CREATE UNIQUE INDEX customers_pkey ON public.customers USING btree (id);
            - name: customers_email_key
              expressions: [email]
              type: btree
              unique: true
              is_constraint: true
              definition: CREATE UNIQUE INDEX customers_email_key ON public.customers USING btree (email);
            - name: idx_customers_closed_at
              expressions: [closed_at]
              type: btree
              definition: CREATE INDEX idx_customers_closed_at ON public.customers USING btree (closed_at);
        - name: orders
          owner: shop_owner
          row_count: 48000000
          data_size: 11811160064
          index_size: 3221225472
          columns:
            - {name: id, position: 1, type: bigint, default: "nextval('public.orders_id_seq'::regclass)"}
            - {name: customer_id, position: 2, type: bigint}
            - {name: status, position: 3, type: text}
            - {name: total, position: 4, type: "numeric(12,2)"}
            - {name: created_at, position: 5, type: timestamp(6) with time zone, default: "now()"}
          indexes:
            - name: orders_pkey
              expressions: [id]
              type: btree
              unique: true
              primary: true
              is_constraint: true
              definition: CREATE UNIQUE INDEX orders_pkey ON public.orders USING btree (id);
            - name: idx_orders_customer_id
              expressions: [customer_id]
              type: btree
              definition: CREATE INDEX idx_orders_customer_id ON public.orders USING btree (customer_id);
          foreign_keys:
            - name: orders_customer_id_fkey
              columns: [customer_id]
              referenced_schema: public
              referenced_table: customers
              referenced_columns: [id]
              on_delete: CASCADE
              on_update: NO ACTION
              match_type: SIMPLE
        - name: order_items
          owner: shop_owner
          row_count: 163000000
          data_size: 19327352832
          index_size: 7516192768
          columns:
            - {name: id, position: 1, type: bigint, default: "nextval('public.order_items_id_seq'::regclass)"}
            - {name: order_id, position: 2, type: bigint}
            - {name: product_id, position: 3, type: bigint}
            - {name: quantity, position: 4, type: integer}
            - {name: unit_price, position: 5, type: "numeric(12,2)"}
          indexes:
            - name: order_items_pkey
              expressions: [id]
              type: btree
              unique: true
              primary: true
              is_constraint: true
              definition: CREATE UNIQUE INDEX order_items_pkey ON public.order_items USING btree (id);
            - name: idx_order_items_order_id
              expressions: [order_id]
              type: btree
              definition: CREATE INDEX idx_order_items_order_id ON public.order_items USING btree (order_id);
          foreign_keys:
            - name: order_items_order_id_fkey
              columns: [order_id]
              referenced_schema: public
              referenced_table: orders
              referenced_columns: [id]
              on_delete: CASCADE
              on_update: NO ACTION
              match_type: SIMPLE
      sequences:
        - {name: customers_id_seq, data_type: bigint, start: "1", increment: "1", min_value: "1", max_value: "9223372036854775807", cache_size: "1", owner_table: customers, owner_column: id}
        - {name: orders_id_seq, data_type: bigint, start: "1", increment: "1", min_value: "1", max_value: "9223372036854775807", cache_size: "1", owner_table: orders, owner_column: id}
        - {name: order_items_id_seq, data_type: bigint, start: "1", increment: "1", min_value: "1", max_value: "9223372036854775807", cache_size: "1", owner_table: order_items, owner_column: id}
expect:
  find:
    - line: 2
      keywords: [cascade, cascading, orders, order_items]
