- statement: |-
    CREATE VIEW Articles AS
    SELECT ArticleID, Title, AuthorID
    FROM Articles
    WHERE PublicationDate > TO_DATE('2020-01-01', 'YYYY-MM-DD');
  want:
    - CREATE_VIEW
- statement: |-
    CREATE DATABASE TestDB
    USER SYS IDENTIFIED BY mypassword;
  want:
    - CREATE_DATABASE
- statement: |-
    CREATE TABLE Comments (
      CommentID NUMBER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      ArticleID NUMBER,
      UserID NUMBER,
      CommentText NVARCHAR2(4000) NOT NULL,
      CreatedAt DATE DEFAULT SYSDATE
    );
  want:
    - CREATE_TABLE
- statement: |-
    DROP TABLE Authors;
  want:
    - DROP_TABLE
- statement: |-
    DROP VIEW Articles;
  want:
    - DROP_VIEW
