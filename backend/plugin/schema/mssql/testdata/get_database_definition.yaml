        CONSTRAINT [UQ_spatial_mixed_2] UNIQUE ([code] ASC),
        CONSTRAINT [FK_spatial_mixed_parent] FOREIGN KEY ([parent_id]) REFERENCES [dbo].[spatial_mixed] ([id]) ON DELETE NO ACTION ON UPDATE NO ACTION,
        CONSTRAINT [] CHECK status IN ('active', 'inactive', 'pending')
    );

