                }
              ]
            }
          ],
          "views": [
            {
              "name": "v_employee_summary",
              "definition": "CREATE VIEW dbo.v_employee_summary AS\nSELECT department, COUNT(*) as emp_count, AVG(salary) as avg_salary\nFROM dbo.employees\nGROUP BY department;"
            },
            {
              "name": "v_high_earners",
              "definition": "CREATE VIEW dbo.v_high_earners AS\nSELECT * FROM dbo.v_employee_summary\nWHERE avg_salary \u003e 50000;"
            }
          ]
        }
      ]
    }
  expected: |+
    CREATE TABLE [dbo].[employees] (
        [emp_id] INT NOT NULL,
        [emp_name] VARCHAR(100),
        [department] VARCHAR(50),
        [salary] DECIMAL(10,2),
        CONSTRAINT [PK_employees_1] PRIMARY KEY ([emp_id] ASC)
    );

    GO

    CREATE VIEW dbo.v_employee_summary AS
    SELECT department, COUNT(*) as emp_count, AVG(salary) as avg_salary
    FROM dbo.employees
    GROUP BY department;;

    GO

    CREATE VIEW dbo.v_high_earners AS
    SELECT * FROM dbo.v_employee_summary
    WHERE avg_salary > 50000;;

    GO

