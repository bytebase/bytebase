- description: Create procedure with transaction
  oldSchema: ''
  newSchema: |
    CREATE PROCEDURE [dbo].[TransferFunds]
      @FromAccount int,
      @ToAccount int,
      @Amount decimal(10,2)
    AS
    BEGIN
      BEGIN TRANSACTION
      BEGIN TRY
        UPDATE Accounts SET Balance = Balance - @Amount WHERE Id = @FromAccount
        UPDATE Accounts SET Balance = Balance + @Amount WHERE Id = @ToAccount
        COMMIT TRANSACTION
      END TRY
      BEGIN CATCH
        ROLLBACK TRANSACTION
        THROW
      END CATCH
    END
  expected: |
    CREATE PROCEDURE [dbo].[TransferFunds]
      @FromAccount int,
      @ToAccount int,
      @Amount decimal(10,2)
    AS
    BEGIN
      BEGIN TRANSACTION
      BEGIN TRY
        UPDATE Accounts SET Balance = Balance - @Amount WHERE Id = @FromAccount
        UPDATE Accounts SET Balance = Balance + @Amount WHERE Id = @ToAccount
        COMMIT TRANSACTION
      END TRY
      BEGIN CATCH
        ROLLBACK TRANSACTION
        THROW
      END CATCH
    END;
    GO
