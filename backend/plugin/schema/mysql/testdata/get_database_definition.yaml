            }
          ],
          "procedures": [
            {
              "name": "transfer_funds",
              "definition": "CREATE PROCEDURE `transfer_funds`(IN from_account VARCHAR(20), IN to_account VARCHAR(20), IN amount DECIMAL(15,2))\nBEGIN\n    DECLARE from_balance DECIMAL(15, 2);\n\n    START TRANSACTION;\n\n    SELECT balance INTO from_balance\n    FROM accounts\n    WHERE account_number = from_account\n    FOR UPDATE;\n\n    IF from_balance \u003e= amount THEN\n        UPDATE accounts\n        SET balance = balance - amount\n        WHERE account_number = from_account;\n\n        UPDATE accounts\n        SET balance = balance + amount\n        WHERE account_number = to_account;\n\n        COMMIT;\n    ELSE\n        ROLLBACK;\n        SIGNAL SQLSTATE '45000'\n        SET MESSAGE_TEXT = 'Insufficient funds';\n    END IF;\nEND"
