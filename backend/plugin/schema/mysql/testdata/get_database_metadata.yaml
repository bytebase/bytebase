- description: functions_and_procedures
  schema: |
    DELIMITER //

    CREATE FUNCTION get_employee_count(dept VARCHAR(50))
    RETURNS INT
    DETERMINISTIC
    READS SQL DATA
    BEGIN
        DECLARE emp_count INT;
        SELECT COUNT(*) INTO emp_count
        FROM employees
        WHERE department = dept;
        RETURN emp_count;
    END//

    CREATE PROCEDURE update_employee_salary(
        IN emp_id INT,
        IN new_salary DECIMAL(10, 2)
    )
    BEGIN
        UPDATE employees
        SET salary = new_salary
        WHERE id = emp_id;
    END//

    DELIMITER ;
  metadata: |
    {
      "name": "tmp",
      "schemas": [
        {
          "functions": [
            {
              "name": "get_employee_count",
              "definition": "BEGIN\n    DECLARE emp_count INT;\n    SELECT COUNT(*) INTO emp_count\n    FROM employees\n    WHERE department = dept;\n    RETURN emp_count;\nEND"
            }
          ],
          "procedures": [
            {
              "name": "update_employee_salary",
              "definition": "BEGIN\n    UPDATE employees\n    SET salary = new_salary\n    WHERE id = emp_id;\nEND"
            }
          ]
        }
      ],
      "character_set": "utf8mb4",
      "collation": "utf8mb4_0900_ai_ci"
    }
- description: partitioned_tables
  schema: |
    CREATE TABLE sales (
        id INT AUTO_INCREMENT,
        sale_date DATE NOT NULL,
        amount DECIMAL(10, 2) NOT NULL,
        region VARCHAR(50) NOT NULL,
        PRIMARY KEY (id, sale_date)
    ) PARTITION BY RANGE (YEAR(sale_date)) (
        PARTITION p2021 VALUES LESS THAN (2022),
        PARTITION p2022 VALUES LESS THAN (2023),
        PARTITION p2023 VALUES LESS THAN (2024),
        PARTITION p2024 VALUES LESS THAN (2025)
    );

    CREATE TABLE user_logs (
        id INT AUTO_INCREMENT,
        user_id INT NOT NULL,
        log_date DATE NOT NULL,
        action VARCHAR(100),
        PRIMARY KEY (id, user_id)
    ) PARTITION BY HASH(user_id) PARTITIONS 4;

    CREATE TABLE regions (
        id INT AUTO_INCREMENT,
        region_code VARCHAR(10) NOT NULL,
        region_name VARCHAR(100),
        PRIMARY KEY (id, region_code)
    ) PARTITION BY KEY(region_code) PARTITIONS 3;

    CREATE TABLE products (
        id INT AUTO_INCREMENT,
        category VARCHAR(50) NOT NULL,
        name VARCHAR(100),
        price DECIMAL(10, 2),
        PRIMARY KEY (id, category)
    ) PARTITION BY LIST COLUMNS(category) (
        PARTITION p_electronics VALUES IN ('laptop', 'phone', 'tablet'),
        PARTITION p_clothing VALUES IN ('shirt', 'pants', 'shoes'),
        PARTITION p_food VALUES IN ('fruit', 'vegetable', 'meat')
    );
