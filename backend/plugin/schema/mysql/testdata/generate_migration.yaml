- description: Views, triggers, and stored procedures
  oldSchema: |
    CREATE TABLE products (
        id INT NOT NULL AUTO_INCREMENT,
        name VARCHAR(100) NOT NULL,
        price DECIMAL(10, 2) NOT NULL,
        stock INT DEFAULT 0,
        PRIMARY KEY (id),
        INDEX idx_name (name)
    ) ENGINE=InnoDB;

    CREATE TABLE orders (
        id INT NOT NULL AUTO_INCREMENT,
        product_id INT NOT NULL,
        quantity INT NOT NULL,
        total DECIMAL(10, 2),
        order_date DATETIME DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (id),
        CONSTRAINT fk_product FOREIGN KEY (product_id) REFERENCES products(id)
    ) ENGINE=InnoDB;

    CREATE VIEW product_inventory AS
    SELECT
        p.id,
        p.name,
        p.price,
        p.stock,
        COALESCE(SUM(o.quantity), 0) AS total_ordered
    FROM products p
    LEFT JOIN orders o ON p.id = o.product_id
    GROUP BY p.id, p.name, p.price, p.stock;

    CREATE VIEW low_stock_products AS
    SELECT * FROM products WHERE stock < 10;

    CREATE TRIGGER update_order_total
    BEFORE INSERT ON orders
    FOR EACH ROW
    BEGIN
        DECLARE product_price DECIMAL(10, 2);
        SELECT price INTO product_price FROM products WHERE id = NEW.product_id;
        SET NEW.total = NEW.quantity * product_price;
    END;

    CREATE PROCEDURE GetProductInventory(IN product_name VARCHAR(100))
    BEGIN
        SELECT * FROM product_inventory
        WHERE name LIKE CONCAT('%', product_name, '%');
    END;
  newSchema: |
    CREATE TABLE products (
        id INT NOT NULL AUTO_INCREMENT,
        name VARCHAR(100) NOT NULL,
        price DECIMAL(10, 2) NOT NULL,
        stock INT DEFAULT 0,
        PRIMARY KEY (id),
        INDEX idx_name (name)
    ) ENGINE=InnoDB;

    CREATE TABLE orders (
        id INT NOT NULL AUTO_INCREMENT,
        product_id INT NOT NULL,
        quantity INT NOT NULL,
        total DECIMAL(10, 2),
        order_date DATETIME DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (id),
        CONSTRAINT fk_product FOREIGN KEY (product_id) REFERENCES products(id)
    ) ENGINE=InnoDB;
  expected: |+
    DROP TRIGGER IF EXISTS `update_order_total`;

    CREATE OR REPLACE VIEW `low_stock_products` AS SELECT 1;

    CREATE OR REPLACE VIEW `product_inventory` AS SELECT 1;

    DROP VIEW IF EXISTS `low_stock_products`;

    DROP VIEW IF EXISTS `product_inventory`;

    DROP PROCEDURE IF EXISTS `GetProductInventory`;


- description: Stored functions and dependent tables
  oldSchema: |
    CREATE TABLE sales (
        id INT NOT NULL AUTO_INCREMENT,
        product_id INT NOT NULL,
        quantity INT NOT NULL,
        unit_price DECIMAL(10, 2) NOT NULL,
        sale_date DATE NOT NULL,
        PRIMARY KEY (id),
        INDEX idx_product_date (product_id, sale_date)
    ) ENGINE=InnoDB;

    CREATE TABLE sales_summary (
        id INT NOT NULL AUTO_INCREMENT,
        product_id INT NOT NULL,
        month_year VARCHAR(7) NOT NULL,
        total_sales DECIMAL(10, 2),
        tax_amount DECIMAL(10, 2),
        PRIMARY KEY (id),
        UNIQUE KEY uk_product_month (product_id, month_year)
    ) ENGINE=InnoDB;

    CREATE FUNCTION CalculateTotalSales(p_product_id INT, p_start_date DATE, p_end_date DATE)
    RETURNS DECIMAL(10, 2)
    DETERMINISTIC
    READS SQL DATA
    BEGIN
        DECLARE total DECIMAL(10, 2);

        SELECT COALESCE(SUM(quantity * unit_price), 0) INTO total
        FROM sales
        WHERE product_id = p_product_id
        AND sale_date BETWEEN p_start_date AND p_end_date;

        RETURN total;
    END;

    CREATE FUNCTION GetTaxAmount(amount DECIMAL(10, 2), tax_rate DECIMAL(5, 2))
    RETURNS DECIMAL(10, 2)
    DETERMINISTIC
    NO SQL
    BEGIN
        RETURN amount * (tax_rate / 100);
    END;
  newSchema: |
    CREATE TABLE sales (
        id INT NOT NULL AUTO_INCREMENT,
        product_id INT NOT NULL,
        quantity INT NOT NULL,
        unit_price DECIMAL(10, 2) NOT NULL,
        sale_date DATE NOT NULL,
        PRIMARY KEY (id),
        INDEX idx_product_date (product_id, sale_date)
    ) ENGINE=InnoDB;
  expected: |+
    DROP FUNCTION IF EXISTS `CalculateTotalSales`;

    DROP FUNCTION IF EXISTS `GetTaxAmount`;

    DROP TABLE IF EXISTS `sales_summary`;

