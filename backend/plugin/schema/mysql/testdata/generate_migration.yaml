- description: Drop views and stored routines
  oldSchema: |
    CREATE TABLE sales (
        id INT NOT NULL AUTO_INCREMENT,
        product_name VARCHAR(100) NOT NULL,
        sale_amount DECIMAL(10, 2) NOT NULL,
        sale_date DATE NOT NULL,
        PRIMARY KEY (id)
    ) ENGINE=InnoDB;
  newSchema: |
    CREATE TABLE sales (
        id INT NOT NULL AUTO_INCREMENT,
        product_name VARCHAR(100) NOT NULL,
        sale_amount DECIMAL(10, 2) NOT NULL,
        sale_date DATE NOT NULL,
        PRIMARY KEY (id)
    ) ENGINE=InnoDB;

    CREATE VIEW monthly_sales AS
    SELECT
        YEAR(sale_date) AS year,
        MONTH(sale_date) AS month,
        SUM(sale_amount) AS total_sales
    FROM sales
    GROUP BY YEAR(sale_date), MONTH(sale_date);

    CREATE VIEW top_products AS
    SELECT
        product_name,
        COUNT(*) AS sale_count,
        SUM(sale_amount) AS total_revenue
    FROM sales
    GROUP BY product_name
    ORDER BY SUM(sale_amount) DESC;

    CREATE FUNCTION GetMonthlySalesTotal(year INT, month INT)
    RETURNS DECIMAL(10, 2)
    DETERMINISTIC
    READS SQL DATA
    BEGIN
        DECLARE total DECIMAL(10, 2);
        SELECT COALESCE(SUM(sale_amount), 0) INTO total
        FROM sales
        WHERE YEAR(sale_date) = year AND MONTH(sale_date) = month;
        RETURN total;
    END;

    CREATE PROCEDURE CalculateDiscount(IN amount DECIMAL(10, 2), OUT discount DECIMAL(10, 2))
    BEGIN
        SET discount = amount * 0.1;
    END;
  expected: |+
    CREATE VIEW `monthly_sales` AS SELECT 1;

    CREATE VIEW `top_products` AS SELECT 1;

    CREATE OR REPLACE VIEW `monthly_sales` AS select year(`sales`.`sale_date`) AS `year`,month(`sales`.`sale_date`) AS `month`,sum(`sales`.`sale_amount`) AS `total_sales` from `sales` group by year(`sales`.`sale_date`),month(`sales`.`sale_date`);

    CREATE OR REPLACE VIEW `top_products` AS select `sales`.`product_name` AS `product_name`,count(0) AS `sale_count`,sum(`sales`.`sale_amount`) AS `total_revenue` from `sales` group by `sales`.`product_name` order by sum(`sales`.`sale_amount`) desc;

    CREATE FUNCTION `GetMonthlySalesTotal`(year INT, month INT) RETURNS decimal(10,2) READS SQL DATA DETERMINISTIC
    BEGIN
        DECLARE total DECIMAL(10, 2);
        SELECT COALESCE(SUM(sale_amount), 0) INTO total
        FROM sales
        WHERE YEAR(sale_date) = year AND MONTH(sale_date) = month;
        RETURN total;
    END;

    CREATE PROCEDURE `CalculateDiscount`(IN amount DECIMAL(10,2), OUT discount DECIMAL(10,2))
    BEGIN
        SET discount = amount * 0.1;
    END;

