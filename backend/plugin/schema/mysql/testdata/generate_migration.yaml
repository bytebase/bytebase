- description: 'Reverse: Drop triggers and views'
  oldSchema: |
    CREATE TABLE inventory (
        id INT NOT NULL AUTO_INCREMENT,
        product_id INT NOT NULL,
        quantity INT NOT NULL DEFAULT 0,
        last_updated TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        PRIMARY KEY (id),
        UNIQUE KEY uk_product (product_id)
    ) ENGINE=InnoDB;

    CREATE TABLE inventory_log (
        id INT NOT NULL AUTO_INCREMENT,
        product_id INT NOT NULL,
        old_quantity INT,
        new_quantity INT,
        change_type VARCHAR(20),
        changed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (id)
    ) ENGINE=InnoDB;
  newSchema: |
    CREATE TABLE inventory (
        id INT NOT NULL AUTO_INCREMENT,
        product_id INT NOT NULL,
        quantity INT NOT NULL DEFAULT 0,
        last_updated TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        PRIMARY KEY (id),
        UNIQUE KEY uk_product (product_id)
    ) ENGINE=InnoDB;

    CREATE TABLE inventory_log (
        id INT NOT NULL AUTO_INCREMENT,
        product_id INT NOT NULL,
        old_quantity INT,
        new_quantity INT,
        change_type VARCHAR(20),
        changed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (id)
    ) ENGINE=InnoDB;

    CREATE TRIGGER trg_inventory_insert
    AFTER INSERT ON inventory
    FOR EACH ROW
    BEGIN
        INSERT INTO inventory_log (product_id, old_quantity, new_quantity, change_type)
        VALUES (NEW.product_id, NULL, NEW.quantity, 'INSERT');
    END;

    CREATE TRIGGER trg_inventory_update
    AFTER UPDATE ON inventory
    FOR EACH ROW
    BEGIN
        IF OLD.quantity != NEW.quantity THEN
            INSERT INTO inventory_log (product_id, old_quantity, new_quantity, change_type)
            VALUES (NEW.product_id, OLD.quantity, NEW.quantity, 'UPDATE');
        END IF;
    END;

    CREATE TRIGGER trg_inventory_delete
    BEFORE DELETE ON inventory
    FOR EACH ROW
    BEGIN
        INSERT INTO inventory_log (product_id, old_quantity, new_quantity, change_type)
        VALUES (OLD.product_id, OLD.quantity, NULL, 'DELETE');
    END;

    CREATE VIEW inventory_changes AS
    SELECT
        product_id,
        COUNT(*) AS change_count,
        MAX(changed_at) AS last_changed
    FROM inventory_log
    GROUP BY product_id;
  expected: |+
    CREATE VIEW `inventory_changes` AS SELECT 1;

    CREATE TRIGGER `trg_inventory_delete` BEFORE DELETE ON `inventory` FOR EACH ROW BEGIN
        INSERT INTO inventory_log (product_id, old_quantity, new_quantity, change_type)
        VALUES (OLD.product_id, OLD.quantity, NULL, 'DELETE');
    END;

    CREATE TRIGGER `trg_inventory_insert` AFTER INSERT ON `inventory` FOR EACH ROW BEGIN
        INSERT INTO inventory_log (product_id, old_quantity, new_quantity, change_type)
        VALUES (NEW.product_id, NULL, NEW.quantity, 'INSERT');
    END;

    CREATE TRIGGER `trg_inventory_update` AFTER UPDATE ON `inventory` FOR EACH ROW BEGIN
        IF OLD.quantity != NEW.quantity THEN
            INSERT INTO inventory_log (product_id, old_quantity, new_quantity, change_type)
            VALUES (NEW.product_id, OLD.quantity, NEW.quantity, 'UPDATE');
        END IF;
    END;

    CREATE OR REPLACE VIEW `inventory_changes` AS select `inventory_log`.`product_id` AS `product_id`,count(0) AS `change_count`,max(`inventory_log`.`changed_at`) AS `last_changed` from `inventory_log` group by `inventory_log`.`product_id`;

- description: 'Reverse: Drop events and advanced features'
  oldSchema: |
    CREATE TABLE system_stats (
        id INT NOT NULL AUTO_INCREMENT,
        stat_name VARCHAR(100) NOT NULL,
        stat_value DECIMAL(10, 2),
        recorded_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (id)
    ) ENGINE=InnoDB;
  newSchema: |
    CREATE TABLE system_stats (
        id INT NOT NULL AUTO_INCREMENT,
        stat_name VARCHAR(100) NOT NULL,
        stat_value DECIMAL(10, 2),
        recorded_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (id)
    ) ENGINE=InnoDB;

    CREATE EVENT IF NOT EXISTS evt_cleanup_old_stats
    ON SCHEDULE EVERY 1 DAY
    STARTS CURRENT_TIMESTAMP
    DO
    BEGIN
        DELETE FROM system_stats
        WHERE recorded_at < DATE_SUB(NOW(), INTERVAL 30 DAY);
    END;

    CREATE PROCEDURE RecordSystemStat(
        IN p_stat_name VARCHAR(100),
        IN p_stat_value DECIMAL(10, 2)
    )
    BEGIN
        DECLARE EXIT HANDLER FOR SQLEXCEPTION
        BEGIN
            ROLLBACK;
            RESIGNAL;
        END;

        START TRANSACTION;

        INSERT INTO system_stats (stat_name, stat_value)
        VALUES (p_stat_name, p_stat_value);

        COMMIT;
    END;

    CREATE FUNCTION GetAverageStat(p_stat_name VARCHAR(100))
    RETURNS DECIMAL(10, 2)
    DETERMINISTIC
    READS SQL DATA
    BEGIN
        DECLARE avg_value DECIMAL(10, 2);

        SELECT AVG(stat_value) INTO avg_value
        FROM system_stats
        WHERE stat_name = p_stat_name
        AND recorded_at >= DATE_SUB(NOW(), INTERVAL 7 DAY);

        RETURN COALESCE(avg_value, 0);
    END;
  expected: |+
    CREATE FUNCTION `GetAverageStat`(p_stat_name VARCHAR(100)) RETURNS decimal(10,2) READS SQL DATA DETERMINISTIC
    BEGIN
        DECLARE avg_value DECIMAL(10, 2);

        SELECT AVG(stat_value) INTO avg_value
        FROM system_stats
        WHERE stat_name = p_stat_name
        AND recorded_at >= DATE_SUB(NOW(), INTERVAL 7 DAY);

        RETURN COALESCE(avg_value, 0);
    END;

    CREATE PROCEDURE `RecordSystemStat`(IN p_stat_name VARCHAR(100), IN p_stat_value DECIMAL(10,2))
    BEGIN
        DECLARE EXIT HANDLER FOR SQLEXCEPTION
        BEGIN
            ROLLBACK;
            RESIGNAL;
        END;

        START TRANSACTION;

        INSERT INTO system_stats (stat_name, stat_value)
        VALUES (p_stat_name, p_stat_value);

        COMMIT;
    END;

    CREATE DEFINER=`root`@`%` EVENT `evt_cleanup_old_stats` ON SCHEDULE EVERY 1 DAY
    STARTS CURRENT_TIMESTAMP ON COMPLETION NOT PRESERVE ENABLE DO BEGIN
        DELETE FROM system_stats
        WHERE recorded_at < DATE_SUB(NOW(), INTERVAL 30 DAY);
    END;

