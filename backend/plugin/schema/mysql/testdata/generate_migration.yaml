        DECLARE product_price DECIMAL(10, 2);
        SELECT price INTO product_price FROM products WHERE id = NEW.product_id;
        SET NEW.total = NEW.quantity * product_price;
    END;

    CREATE OR REPLACE VIEW `low_stock_products` AS select `products`.`id` AS `id`,`products`.`name` AS `name`,`products`.`price` AS `price`,`products`.`stock` AS `stock` from `products` where (`products`.`stock` < 10);

    CREATE OR REPLACE VIEW `product_inventory` AS select `p`.`id` AS `id`,`p`.`name` AS `name`,`p`.`price` AS `price`,`p`.`stock` AS `stock`,coalesce(sum(`o`.`quantity`),0) AS `total_ordered` from (`products` `p` left join `orders` `o` on((`p`.`id` = `o`.`product_id`))) group by `p`.`id`,`p`.`name`,`p`.`price`,`p`.`stock`;

    CREATE PROCEDURE `GetProductInventory`(IN product_name VARCHAR(100))
    BEGIN
        SELECT * FROM product_inventory
        WHERE name LIKE CONCAT('%', product_name, '%');
    END;

