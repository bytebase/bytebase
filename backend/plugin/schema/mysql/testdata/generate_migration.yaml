      UNIQUE KEY `uk_product_month` (`product_id`, `month_year`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;

    CREATE FUNCTION `CalculateTotalSales`(p_product_id INT, p_start_date DATE, p_end_date DATE) RETURNS decimal(10,2) READS SQL DATA DETERMINISTIC
    BEGIN
        DECLARE total DECIMAL(10, 2);

        SELECT COALESCE(SUM(quantity * unit_price), 0) INTO total
        FROM sales
        WHERE product_id = p_product_id
        AND sale_date BETWEEN p_start_date AND p_end_date;

        RETURN total;
    END;

    CREATE FUNCTION `GetTaxAmount`(amount DECIMAL(10,2), tax_rate DECIMAL(5,2)) RETURNS decimal(10,2) NO SQL DETERMINISTIC
    BEGIN
        RETURN amount * (tax_rate / 100);
    END;

