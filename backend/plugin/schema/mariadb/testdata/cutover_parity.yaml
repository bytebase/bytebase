  oldSchema: "--\n-- Table structure for `some_table`\n--\nCREATE TABLE `some_table` (\n  `id` int NOT NULL,\n  `a` int NOT NULL,\n  PRIMARY KEY (`id`),\n  CONSTRAINT `some_table_chk_1` CHECK (`a` in (1,2,3))\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;\n\n--\n-- Table structure for `t`\n--\nCREATE TABLE `t` (\n  `id` int NOT NULL AUTO_INCREMENT,\n  `name` char(255) DEFAULT (NULL),\n  PRIMARY KEY (`id`)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;\n\n--\n-- Table structure for `t1`\n--\nCREATE TABLE `t1` (\n  `id` int NOT NULL,\n  `a` int NOT NULL,\n  `b` int DEFAULT (NULL),\n  `c` int DEFAULT (NULL),\n  PRIMARY KEY (`id`),\n  KEY `b` (`b`)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;\n\n--\n-- Table structure for `test_table`\n--\nCREATE TABLE `test_table` (\n  `id` int NOT NULL AUTO_INCREMENT,\n  `name` varchar(100) DEFAULT (NULL),\n  `email` varchar(100) DEFAULT (NULL),\n  `status` varchar(20) DEFAULT ('active'),\n  `age` int DEFAULT (NULL),\n  `score` decimal(5,2) DEFAULT (NULL),\n  PRIMARY KEY (`id`),\n  KEY `idx_name` (`name`),\n  KEY `idx_status_hash` (`status`),\n  UNIQUE KEY `uk_email` (`email`),\n  CONSTRAINT `chk_age` CHECK (`age` >= 18),\n  CONSTRAINT `chk_status` CHECK (`status` in ('active','inactive','pending'))\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;\n\n"
  newSchema: |
    -- Test that identical schemas don't generate unnecessary migrations
    -- This tests the fixes for primary key, index type, check constraints, and DEFAULT NULL

    CREATE TABLE test_table (
        id INT NOT NULL AUTO_INCREMENT,
        name VARCHAR(100) DEFAULT NULL,
        email VARCHAR(100),
        status VARCHAR(20) DEFAULT 'active',
        age INT DEFAULT NULL,
        score DECIMAL(5,2),
        PRIMARY KEY (id),
        INDEX idx_name (name),
        INDEX idx_status_hash (status) USING HASH,
        UNIQUE KEY uk_email (email),
        CONSTRAINT chk_age CHECK (age >= 18),
        CONSTRAINT chk_status CHECK (status IN ('active', 'inactive', 'pending'))
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

    -- Table with various column types and defaults
    CREATE TABLE t (
        id INT NOT NULL AUTO_INCREMENT,
        name CHAR(255) DEFAULT NULL,
        PRIMARY KEY (id)
    ) ENGINE=InnoDB;

    CREATE TABLE t1 (
        id INT NOT NULL,
        a INT NOT NULL,
        b INT DEFAULT NULL,
        c INT,
        PRIMARY KEY (id),
        INDEX b (b) USING HASH
    ) ENGINE=InnoDB;

    -- Table with check constraint that has spaces
    CREATE TABLE some_table (
        id INT PRIMARY KEY,
        a INT NOT NULL,
        CONSTRAINT some_table_chk_1 CHECK (a IN (1, 2, 3))
    ) ENGINE=InnoDB;
