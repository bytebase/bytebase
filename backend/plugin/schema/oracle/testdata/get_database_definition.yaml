  expected: |+
    CREATE TABLE "DEPARTMENTS" (
      "ID" NUMBER NOT NULL,
      "NAME" VARCHAR2(100 BYTE) NOT NULL,
      "BUDGET" NUMBER(12, 2) DEFAULT 0,
