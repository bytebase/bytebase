    );

    CREATE INDEX "IDX_EMP_DEPT" ON "EMPLOYEES" ("DEPARTMENT_ID" ASC);

    CREATE INDEX "IDX_EMP_NAME" ON "EMPLOYEES" ("NAME" ASC);

- description: A view whose INSTEAD OF trigger must survive the definition round trip
  metadata: |
    {
      "schemas": [
        {
          "tables": [
            {
              "name": "EMPLOYEES",
              "columns": [
                {
                  "name": "EMP_ID",
                  "position": 1,
                  "type": "NUMBER"
                },
                {
                  "name": "EMAIL",
                  "position": 2,
                  "nullable": true,
                  "type": "VARCHAR2(100 BYTE)"
                }
              ],
              "indexes": [
                {
                  "name": "PK_EMPLOYEES",
                  "expressions": [
                    "EMP_ID"
                  ],
                  "type": "NORMAL",
                  "unique": true,
                  "primary": true,
                  "visible": true,
                  "is_constraint": true
                }
              ]
            }
          ],
          "views": [
            {
              "name": "EMPLOYEE_VIEW",
              "definition": "SELECT EMP_ID, EMAIL\nFROM EMPLOYEES",
              "triggers": [
                {
                  "name": "EMPLOYEE_VIEW_INSERT_TRG",
                  "body": "CREATE OR REPLACE TRIGGER EMPLOYEE_VIEW_INSERT_TRG\nINSTEAD OF INSERT ON EMPLOYEE_VIEW\nFOR EACH ROW\nBEGIN\n    INSERT INTO EMPLOYEES (EMP_ID, EMAIL) VALUES (:NEW.EMP_ID, :NEW.EMAIL);\nEND;"
                }
              ]
            }
          ]
        }
      ]
    }
  expected: |+
    CREATE TABLE "EMPLOYEES" (
      "EMP_ID" NUMBER NOT NULL,
      "EMAIL" VARCHAR2(100 BYTE),
      CONSTRAINT "PK_EMPLOYEES" PRIMARY KEY ("EMP_ID")
    );

    CREATE VIEW "EMPLOYEE_VIEW" AS SELECT EMP_ID, EMAIL
    FROM EMPLOYEES;

    CREATE OR REPLACE TRIGGER EMPLOYEE_VIEW_INSERT_TRG
    INSTEAD OF INSERT ON EMPLOYEE_VIEW
    FOR EACH ROW
    BEGIN
        INSERT INTO EMPLOYEES (EMP_ID, EMAIL) VALUES (:NEW.EMP_ID, :NEW.EMAIL);
    END;

