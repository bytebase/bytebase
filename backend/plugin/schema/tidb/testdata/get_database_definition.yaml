    --
    -- Temporary view structure for `order_summary`
    --
    -- `order_summary` references invalid table(s) or column(s) or function(s) or definer/invoker of view lack rights to use them

    --
    -- Temporary view structure for `pending_orders`
    --
    -- `pending_orders` references invalid table(s) or column(s) or function(s) or definer/invoker of view lack rights to use them

    --
    -- Table structure for `order_items`
    --
    CREATE TABLE `order_items` (
      `id` int NOT NULL AUTO_INCREMENT,
      `order_id` int NOT NULL,
      `product_name` varchar(100) NOT NULL,
      `quantity` int NOT NULL,
      `unit_price` decimal(10,2) NOT NULL,
      PRIMARY KEY (`id`),
      KEY `order_id` (`order_id`),
      CONSTRAINT `fk_1` FOREIGN KEY (`order_id`) REFERENCES `orders` (`id`)
    ) ENGINE=InnoDB;

    --
    -- Table structure for `orders`
    --
    CREATE TABLE `orders` (
      `id` int NOT NULL AUTO_INCREMENT,
      `order_number` varchar(20) NOT NULL,
      `customer_name` varchar(100) NOT NULL,
      `total_amount` decimal(10,2) NOT NULL,
      `status` varchar(20),
      `created_at` timestamp DEFAULT CURRENT_TIMESTAMP,
      PRIMARY KEY (`id`),
      UNIQUE KEY `order_number` (`order_number`)
    ) ENGINE=InnoDB;

    --
    -- View structure for `order_summary`
    --
    DROP VIEW IF EXISTS `order_summary`;
    CREATE VIEW `order_summary` AS SELECT
        o.id,
        o.order_number,
        o.customer_name,
        o.total_amount,
        COUNT(oi.id) AS item_count,
        SUM(oi.quantity) AS total_quantity
    FROM orders o
    LEFT JOIN order_items oi ON o.id = oi.order_id
    GROUP BY o.id, o.order_number, o.customer_name, o.total_amount;

    --
    -- View structure for `pending_orders`
    --
    DROP VIEW IF EXISTS `pending_orders`;
    CREATE VIEW `pending_orders` AS SELECT id, order_number, customer_name, total_amount, created_at
    FROM orders
    WHERE status = 'pending'
    ORDER BY created_at DESC;

