- description: Create tables with foreign key constraints
  difference: the catalog writes CREATE TABLE without IF NOT EXISTS, marks the primary key with TiDB's /*T![clustered_index] CLUSTERED */ comment, renders a secondary index as ALTER TABLE ... ADD KEY inside the create, drops a column's CHARACTER SET when it matches the table's, states DEFAULT CHARSET, renders int as int (not int(11)) and a NULL default as DEFAULT NULL; the old generator wrote CREATE INDEX statements and no clustered-index comment
  oldSchema: ""
  newSchema: |
    CREATE TABLE users (
        id INT NOT NULL AUTO_INCREMENT,
        username VARCHAR(50) NOT NULL,
        email VARCHAR(100) NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (id),
        UNIQUE KEY uk_email (email),
        INDEX idx_username (username)
    );

    CREATE TABLE posts (
        id INT NOT NULL AUTO_INCREMENT,
        user_id INT NOT NULL,
        title VARCHAR(200) NOT NULL,
        content TEXT,
        published_at DATETIME,
        PRIMARY KEY (id),
        INDEX idx_user_id (user_id),
        CONSTRAINT fk_user FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE
    );
