- description: Basic table operations with columns, constraints, and indexes
  difference: the catalog drops each table's foreign keys before the table, writes DROP TABLE without IF EXISTS and DROP INDEX as ALTER TABLE ... DROP INDEX, and separates statements with a newline; the old generator relied on DROP TABLE IF EXISTS alone, wrote DROP INDEX ... ON ..., and left blank lines between statements
  oldSchema: |
    CREATE TABLE users (
        id INT NOT NULL AUTO_INCREMENT,
        username VARCHAR(50) NOT NULL,
        email VARCHAR(100) NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        is_active BOOLEAN DEFAULT true,
        PRIMARY KEY (id),
        UNIQUE KEY uk_email (email),
        INDEX idx_username (username),
        INDEX idx_email_active (email, is_active)
    );

    CREATE TABLE posts (
        id INT NOT NULL AUTO_INCREMENT,
        user_id INT NOT NULL,
        title VARCHAR(200) NOT NULL,
        content TEXT,
        published_at DATETIME,
        PRIMARY KEY (id),
        INDEX idx_user_id (user_id),
        CONSTRAINT fk_user FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
        CONSTRAINT chk_title_length CHECK (CHAR_LENGTH(title) > 0)
    );

    CREATE TABLE comments (
        id INT NOT NULL AUTO_INCREMENT,
        post_id INT NOT NULL,
        user_id INT NOT NULL,
        content TEXT NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (id),
        INDEX idx_post_user (post_id, user_id),
        CONSTRAINT fk_comment_post FOREIGN KEY (post_id) REFERENCES posts(id) ON DELETE CASCADE,
        CONSTRAINT fk_comment_user FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE
    );
  newSchema: |
    CREATE TABLE users (
        id INT NOT NULL AUTO_INCREMENT,
        username VARCHAR(50) NOT NULL,
        email VARCHAR(100) NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (id),
        UNIQUE KEY uk_email (email),
        INDEX idx_username (username)
    );

    CREATE TABLE posts (
        id INT NOT NULL AUTO_INCREMENT,
        user_id INT NOT NULL,
        title VARCHAR(200) NOT NULL,
        content TEXT,
        published_at DATETIME,
        PRIMARY KEY (id),
        INDEX idx_user_id (user_id),
        CONSTRAINT fk_user FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE
    );
  legacyExpected: |+
