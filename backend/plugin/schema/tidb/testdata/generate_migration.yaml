- description: Views and stored routines
  oldSchema: |
    CREATE TABLE sales (
        id INT NOT NULL AUTO_INCREMENT,
        product_name VARCHAR(100) NOT NULL,
        sale_amount DECIMAL(10, 2) NOT NULL,
        sale_date DATE NOT NULL,
        PRIMARY KEY (id),
        INDEX idx_product_date (product_name, sale_date)
    );

    CREATE VIEW monthly_sales AS
    SELECT
        YEAR(sale_date) AS year,
        MONTH(sale_date) AS month,
        SUM(sale_amount) AS total_sales
    FROM sales
    GROUP BY YEAR(sale_date), MONTH(sale_date);

    CREATE VIEW top_products AS
    SELECT
        product_name,
        COUNT(*) AS sale_count,
        SUM(sale_amount) AS total_revenue
    FROM sales
    GROUP BY product_name
    ORDER BY SUM(sale_amount) DESC;

    CREATE TABLE sales_reports (
        id INT NOT NULL AUTO_INCREMENT,
        report_type VARCHAR(50) NOT NULL,
        report_data JSON,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        PRIMARY KEY (id),
        INDEX idx_type (report_type)
    );
  newSchema: |
    CREATE TABLE sales (
        id INT NOT NULL AUTO_INCREMENT,
        product_name VARCHAR(100) NOT NULL,
        sale_amount DECIMAL(10, 2) NOT NULL,
        sale_date DATE NOT NULL,
        PRIMARY KEY (id),
        INDEX idx_product_date (product_name, sale_date)
    );
  expected: |+
    CREATE OR REPLACE VIEW `monthly_sales` AS SELECT 1;
    CREATE OR REPLACE VIEW `top_products` AS SELECT 1;
    DROP VIEW IF EXISTS `monthly_sales`;

    DROP VIEW IF EXISTS `top_products`;

    DROP TABLE IF EXISTS `sales_reports`;

