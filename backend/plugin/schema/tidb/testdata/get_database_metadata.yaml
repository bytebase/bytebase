                },
                {
                  "name": "customer_name",
                  "position": 2,
                  "nullable": true,
                  "type": "varchar(100)"
                },
                {
                  "name": "amount",
                  "position": 3,
                  "nullable": true,
                  "type": "decimal(10,2)"
                },
                {
                  "name": "status",
                  "position": 4,
                  "nullable": true,
                  "type": "varchar(20)"
                }
              ],
              "indexes": [
                {
                  "name": "PRIMARY",
                  "expressions": [
                    "id"
                  ],
                  "key_length": [
                    -1
                  ],
                  "type": "BTREE",
                  "unique": true,
                  "primary": true,
                  "visible": true
                }
              ],
              "engine": "InnoDB",
              "comment": "Order management table"
            }
          ],
          "views": [
            {
              "name": "active_orders",
              "definition": "SELECT id, customer_name, amount\nFROM orders\nWHERE status = 'active'"
            }
          ]
        }
      ]
    }
