                    true
                  ]
                }
              ],
              "index_size": 8192,
              "owner": "postgres"
            }
          ],
          "views": [
            {
              "name": "active_employees",
              "definition": " SELECT id,\n    name,\n    department\n   FROM public.employees\n  WHERE (department IS NOT NULL);",
              "dependency_columns": [
                {
                  "schema": "public",
                  "table": "employees",
                  "column": "department"
                },
                {
                  "schema": "public",
                  "table": "employees",
                  "column": "id"
