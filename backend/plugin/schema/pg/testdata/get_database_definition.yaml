- description: views_and_functions
  metadata: |
    {
      "name": "db",
      "schemas": [
        {
          "name": "public",
          "tables": [
            {
              "name": "employees",
              "columns": [
                {
                  "name": "id",
                  "position": 1,
                  "default": "nextval('employees_id_seq'::regclass)",
                  "type": "integer"
                },
                {
                  "name": "name",
                  "position": 2,
                  "type": "character varying(100)"
                },
                {
                  "name": "department",
                  "position": 3,
                  "nullable": true,
                  "type": "character varying(50)"
                },
                {
                  "name": "salary",
                  "position": 4,
                  "nullable": true,
                  "type": "numeric(10,2)"
                }
              ],
              "indexes": [
                {
                  "name": "employees_pkey",
                  "expressions": [
                    "id"
                  ],
                  "descending": [
                    false
                  ],
                  "type": "btree",
                  "unique": true,
                  "primary": true,
                  "is_constraint": true
                }
              ]
            }
          ],
          "views": [
            {
              "name": "active_employees",
              "definition": " SELECT id,\n    name,\n    department\n   FROM employees\n  WHERE (department IS NOT NULL);"
            }
          ],
          "functions": [
            {
              "name": "calculate_bonus",
              "definition": "CREATE OR REPLACE FUNCTION public.calculate_bonus(emp_id integer)\n RETURNS numeric\n LANGUAGE plpgsql\nAS $function$\nDECLARE\n    emp_salary DECIMAL;\nBEGIN\n    SELECT salary INTO emp_salary FROM employees WHERE id = emp_id;\n    RETURN emp_salary * 0.1;\nEND;\n$function$\n",
              "signature": "public.calculate_bonus(integer)"
            },
            {
              "name": "get_employee_count",
              "definition": "CREATE OR REPLACE FUNCTION public.get_employee_count(dept character varying)\n RETURNS integer\n LANGUAGE plpgsql\nAS $function$\nBEGIN\n    RETURN (SELECT COUNT(*) FROM employees WHERE department = dept);\nEND;\n$function$\n",
              "signature": "public.get_employee_count(character varying)"
            }
          ],
          "sequences": [
            {
              "name": "employees_id_seq",
              "data_type": "integer",
              "start": "1",
              "min_value": "1",
              "max_value": "2147483647",
              "increment": "1",
              "cache_size": "1",
              "owner_table": "employees",
              "owner_column": "id"
            }
          ]
        }
      ]
    }
  expected: |+
    SET statement_timeout = 0;
    SET lock_timeout = 0;
    SET idle_in_transaction_session_timeout = 0;
    SET client_encoding = 'UTF8';
    SET standard_conforming_strings = on;
    SELECT pg_catalog.set_config('search_path', '', false);
    SET check_function_bodies = false;
    SET xmloption = content;
    SET client_min_messages = warning;
    SET row_security = off;

    CREATE SEQUENCE "public"."employees_id_seq"
        AS integer
        START WITH 1
        INCREMENT BY 1
        MINVALUE 1
        MAXVALUE 2147483647
        NO CYCLE;

    SET default_tablespace = '';

    CREATE VIEW "public"."active_employees" AS
     SELECT id,
        name,
        department
       FROM employees
      WHERE (department IS NOT NULL);

    CREATE TABLE "public"."employees" (
        "id" integer DEFAULT nextval('employees_id_seq'::regclass) NOT NULL,
        "name" character varying(100) NOT NULL,
        "department" character varying(50),
        "salary" numeric(10,2)
    );

    ALTER SEQUENCE "public"."employees_id_seq" OWNED BY "public"."employees"."id";

    ALTER TABLE ONLY "public"."employees" ADD CONSTRAINT "employees_pkey" PRIMARY KEY (id);

    CREATE OR REPLACE FUNCTION public.calculate_bonus(emp_id integer)
     RETURNS numeric
     LANGUAGE plpgsql
    AS $function$
    DECLARE
        emp_salary DECIMAL;
    BEGIN
        SELECT salary INTO emp_salary FROM employees WHERE id = emp_id;
        RETURN emp_salary * 0.1;
    END;
    $function$
    ;

    CREATE OR REPLACE FUNCTION public.get_employee_count(dept character varying)
     RETURNS integer
     LANGUAGE plpgsql
    AS $function$
    BEGIN
        RETURN (SELECT COUNT(*) FROM employees WHERE department = dept);
    END;
    $function$
    ;

