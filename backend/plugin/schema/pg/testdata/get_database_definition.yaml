    CREATE SCHEMA IF NOT EXISTS "geo";

    CREATE TYPE "public"."order_status" AS ENUM (
        'pending',
        'shipped'
    );

    CREATE TYPE "geo"."point2" AS (
        "lat" numeric(9,6),
        "lng" numeric(9,6)
    );

