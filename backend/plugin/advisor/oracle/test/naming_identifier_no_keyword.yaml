- statement: |-
    CREATE OR REPLACE PROCEDURE p_demo AS
      v NUMBER;
      x NUMBER;
      n NUMBER;
      TYPE t_nos IS TABLE OF NUMBER;
      coll t_nos;
    BEGIN
      SELECT COUNT(1) INTO v FROM t;
      x := coll.COUNT;
      n := SQL%ROWCOUNT;
      RAISE_APPLICATION_ERROR(-20001, SQLCODE || SQLERRM);
    END;
  changeType: 1
- statement: |-
    DECLARE
      TYPE t_nos IS TABLE OF NUMBER;
      l_record_nos t_nos;
      CURSOR c_rows IS SELECT id FROM t;
    BEGIN
      SELECT id BULK COLLECT INTO l_record_nos FROM t;
      FORALL i IN 1..l_record_nos.COUNT
        DELETE FROM t WHERE id = l_record_nos(i);
      IF SQL%ROWCOUNT = 0 AND l_record_nos.FIRST IS NOT NULL THEN
        NULL;
      END IF;
      OPEN c_rows;
      IF c_rows%NOTFOUND THEN
        NULL;
      END IF;
      CLOSE c_rows;
    EXCEPTION
      WHEN OTHERS THEN
        DBMS_OUTPUT.PUT_LINE(SQLCODE || ': ' || SQLERRM);
    END;
  changeType: 1
