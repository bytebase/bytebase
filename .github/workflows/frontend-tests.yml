name: Frontend Tests

on:
  pull_request:
    branches:
      - main
      - 'release/*.*.*'
    paths:
      - 'frontend/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          # The runner's pnpm store persists between runs, so the Actions
          # cache adds nothing and downloading it is slow.
          cache: ''
      - uses: pnpm/setup@v2
        with:
          version: '11.17.0'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      # Single gate, identical to what contributors run locally. The stages
      # it runs are listed in frontend/scripts/run-gate.mjs.
      - name: Test
        run: pnpm test
        working-directory: frontend
