name: Frontend Tests

on:
  pull_request:
    branches:
      - main
      - 'release/*.*.*'
    paths:
      - 'frontend/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          # The runner's pnpm store persists between runs, so the Actions
          # cache adds nothing and downloading it is slow.
          cache: ''
      - uses: pnpm/action-setup@v6
        with:
          version: '11.17.0'
          # Fetch the pnpm binary instead of running the npm-based
          # self-installer: the self-hosted runner's bundled npm
          # (externals/node24) is missing lib/cli.js, so the installer dies
          # before pnpm exists. Ordering setup-node first also keeps this off
          # the runner's bundled toolchain.
          standalone: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Check (ESLint + Biome)
        run: pnpm check
        working-directory: frontend
      - name: TypeScript type check
        run: pnpm type-check
        working-directory: frontend

  frontend-tests:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          # The runner's pnpm store persists between runs, so the Actions
          # cache adds nothing and downloading it is slow.
          cache: ''
      - uses: pnpm/action-setup@v6
        with:
          version: '11.17.0'
          # Fetch the pnpm binary instead of running the npm-based
          # self-installer: the self-hosted runner's bundled npm
          # (externals/node24) is missing lib/cli.js, so the installer dies
          # before pnpm exists. Ordering setup-node first also keeps this off
          # the runner's bundled toolchain.
          standalone: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Run unit tests
        run: pnpm test
        working-directory: frontend
      - name: Build for production
        run: pnpm release-docker
        working-directory: frontend
