version: v2
modules:
  - path: v1
    name: buf.build/bytebase/bytebase
  - path: store
    name: buf.build/bytebase/store

deps:
  - buf.build/googleapis/googleapis:8ac61b9e502343289c8c42b17aa5b245
  - buf.build/bufbuild/protovalidate:511051f7f4374c3ca873b53ae68a9288
lint:
  use:
    - BASIC
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_NO_IMPORT_CYCLE
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
