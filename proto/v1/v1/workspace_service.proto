syntax = "proto3";

package bytebase.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "v1/annotation.proto";
import "v1/auth_service.proto";
import "v1/iam_policy.proto";
import "v1/setting_service.proto";

option go_package = "github.com/bytebase/bytebase/backend/generated-go/v1";

// WorkspaceService manages workspace-level operations and profile.
service WorkspaceService {
  // Gets a workspace by name.
  // Supports "workspaces/-" to resolve the current workspace:
  // - Authenticated: uses the workspace from JWT context
  // - Self-hosted unauthenticated: returns the single workspace
  // - SaaS unauthenticated: returns minimal response
  rpc GetWorkspace(GetWorkspaceRequest) returns (Workspace) {
    option (google.api.http) = {get: "/v1/{name=workspaces/*}"};
    option (bytebase.v1.allow_without_credential) = true;
    option (bytebase.v1.mcp_method_class) = READ;
  }

  // Lists all workspaces the current user is a member of.
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse) {
    option (google.api.http) = {get: "/v1/workspaces"};
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.mcp_method_class) = READ;
  }

  // Updates a workspace. Currently only title can be updated.
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (Workspace) {
    option (google.api.http) = {
      patch: "/v1/{workspace.name=workspaces/*}"
      body: "*"
    };
    option (bytebase.v1.permission) = "bb.workspaces.update";
    option (bytebase.v1.auth_method) = IAM;
    option (bytebase.v1.audit) = true;
    option (bytebase.v1.mcp_method_class) = EXCLUDED;
    option (bytebase.v1.mcp_denial_reason) = ADMINISTERS_THE_WORKSPACE;
  }

  // Retrieves IAM policy for the workspace.
  // Permissions required: bb.workspaces.getIamPolicy
  rpc GetIamPolicy(GetIamPolicyRequest) returns (IamPolicy) {
    option (google.api.http) = {get: "/v1/{resource=workspaces/*}:getIamPolicy"};
    option (bytebase.v1.permission) = "bb.workspaces.getIamPolicy";
    option (bytebase.v1.auth_method) = IAM;
    option (bytebase.v1.mcp_method_class) = EXCLUDED;
    option (bytebase.v1.mcp_denial_reason) = ADMINISTERS_THE_WORKSPACE;
  }

  // Deletes a workspace. SaaS only. Cancels any active subscription and
  // soft-deletes the workspace so all associated data becomes inaccessible.
  // Requires workspace admin permission.
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (LoginResponse) {
    option (google.api.http) = {delete: "/v1/{name=workspaces/*}"};
    option (bytebase.v1.permission) = "bb.workspaces.delete";
    option (bytebase.v1.auth_method) = IAM;
    option (bytebase.v1.audit) = true;
    option (bytebase.v1.mcp_method_class) = FORBIDDEN;
    option (bytebase.v1.mcp_denial_reason) = ENDS_MEMBERSHIP;
  }

  // Removes the calling user from a workspace and switches to the next
  // available workspace. Available to any workspace member. Fails if the
  // caller is the last workspace admin.
  rpc LeaveWorkspace(LeaveWorkspaceRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/{name=workspaces/*}:leave"
      body: "*"
    };
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.audit) = true;
    option (bytebase.v1.mcp_method_class) = FORBIDDEN;
    option (bytebase.v1.mcp_denial_reason) = ENDS_MEMBERSHIP;
  }

  // Sets IAM policy for the workspace.
  // Permissions required: bb.workspaces.setIamPolicy
  rpc SetIamPolicy(SetIamPolicyRequest) returns (IamPolicy) {
    option (google.api.http) = {
      post: "/v1/{resource=workspaces/*}:setIamPolicy"
      body: "*"
    };
    option (bytebase.v1.permission) = "bb.workspaces.setIamPolicy";
    option (bytebase.v1.auth_method) = IAM;
    option (bytebase.v1.audit) = true;
    option (bytebase.v1.mcp_method_class) = EXCLUDED;
    option (bytebase.v1.mcp_denial_reason) = ADMINISTERS_THE_WORKSPACE;
  }

  // Gets what MCP (Model Context Protocol) does in this workspace: the
  // capability ceiling in force, and whether masking narrows what a session
  // reads under it. The workspace is resolved from the authenticated session.
  //
  // Served to MCP sessions. An agent asking what it may do here is the point:
  // the response says nothing a session's own denials do not already say, one
  // refusal at a time, and knowing it up front is what stops the agent
  // planning work the ceiling was never going to serve.
  //
  // Permissions required: None (authentication required)
  rpc GetMCPInfo(GetMCPInfoRequest) returns (MCPInfo) {
    option (google.api.http) = {get: "/v1/mcp/info"};
    option (google.api.method_signature) = "";
    option (bytebase.v1.mcp_method_class) = READ;
  }

  // Mints a new directory sync (SCIM) token, immediately invalidating the
  // previous one. The plaintext token is returned exactly once and cannot be
  // retrieved afterwards; only its hash is stored. Callers that lose it must
  // rotate again and update their identity provider.
  // Permissions required: bb.workspaces.rotateDirectorySyncToken
  rpc RotateDirectorySyncToken(RotateDirectorySyncTokenRequest) returns (RotateDirectorySyncTokenResponse) {
    option (google.api.http) = {
      post: "/v1/{name=workspaces/*}:rotateDirectorySyncToken"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (bytebase.v1.permission) = "bb.workspaces.rotateDirectorySyncToken";
    option (bytebase.v1.auth_method) = IAM;
    option (bytebase.v1.audit) = true;
    option (bytebase.v1.mcp_method_class) = FORBIDDEN;
    option (bytebase.v1.mcp_denial_reason) = MINTS_CREDENTIAL_FOR_OTHERS;
  }
}

message GetMCPInfoRequest {}

// MCPInfo is what MCP does in this workspace: the ceiling in force, and
// whether masking narrows what a session reads under it.
//
// This is the only API a served MCP session or the consent page can read the
// ceiling from. SettingService/GetSetting is served by no ceiling, and its
// answer is cached besides.
message MCPInfo {
  // The workspace this describes. Format: workspaces/{workspace}. Not this
  // message's own resource name — MCPInfo is not a named resource and there is
  // nothing to get it by.
  string workspace = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The ceiling in force for this workspace. Any value outside the enum this
  // build serves, CAPABILITY_UNSPECIFIED included, means no ceiling could be
  // resolved from the stored row and every MCP connection is refused. A stored
  // name nothing resolves arrives as CAPABILITY_UNSPECIFIED; a number a newer
  // release wrote arrives verbatim.
  MCPSetting.Capability capability = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Was the mode-contents half of this message: the serving table, the served
  // method list, and the per-engine enforcement facts. Shipped in 3.22.0.
  reserved 3, 4, 5;
  reserved "modes", "methods", "engines";

  // Whether this workspace stops applying the caller's own unmasking
  // provisioning to MCP requests. It narrows what a session reads only where
  // Bytebase masks by column and consults exemptions; elsewhere it suppresses
  // nothing.
  bool ignore_masking_exemptions = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether data masking is licensed for this workspace. When false nothing is
  // masked whatever an engine supports, so the toggle above suppresses nothing.
  // Licensing can also be set per instance, so a true here is the workspace
  // answer, not a promise about every instance.
  bool data_masking_available = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message RotateDirectorySyncTokenRequest {
  // The workspace whose directory sync token is rotated.
  // Format: workspaces/{workspace}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/Workspace"}
  ];
}

message RotateDirectorySyncTokenResponse {
  // The new token, in plaintext. This is the only time it is ever returned.
  string token = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (bytebase.v1.audit_behavior) = SENSITIVE
  ];
}

message ListWorkspacesRequest {}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

message GetWorkspaceRequest {
  // The workspace name, format: workspaces/{workspace}.
  // Use "workspaces/-" to get the current/default workspace.
  string name = 1;
}

message Workspace {
  // Format: workspaces/{workspace}
  string name = 1;

  string title = 2;

  // The branding logo.
  string logo = 3;
}

message DeleteWorkspaceRequest {
  // Format: workspaces/{workspace}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateWorkspaceRequest {
  Workspace workspace = 1 [(google.api.field_behavior) = REQUIRED];

  google.protobuf.FieldMask update_mask = 2;
}

message LeaveWorkspaceRequest {
  // Format: workspaces/{workspace}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}
