syntax = "proto3";

package bytebase.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/bytebase/bytebase/backend/generated-go/v1";

// Extends MethodOptions to add Bytebase-specific RPC method annotations.
extend google.protobuf.MethodOptions {
  // Whether the method allows access without authentication credentials.
  bool allow_without_credential = 100000;
  // The permission required to call this method.
  string permission = 100001;
  // The authorization method to use for this RPC.
  AuthMethod auth_method = 100002;
  // Whether to audit calls to this method.
  bool audit = 100003;
  // How the method is classified for MCP (AI agent) sessions.
  MCPMethodClass mcp_method_class = 100004;
  // Why the method is forbidden to MCP sessions. Meaningful only alongside
  // mcp_method_class = FORBIDDEN; the denial names it so the agent, and the
  // operator reading the audit row, learn why rather than just that it was
  // refused.
  MCPForbiddenReason mcp_forbidden_reason = 100005;
}

// Authorization method for RPC calls.
enum AuthMethod {
  // Unspecified authorization method.
  AUTH_METHOD_UNSPECIFIED = 0;
  // Standard IAM authorization check on organizational resources.
  IAM = 1;
  // Custom authorization logic.
  CUSTOM = 2;
}

// Classification of an RPC for MCP (AI agent) sessions. The effective
// authorization of an MCP session is this classification intersected with the
// caller's own RBAC: it can only ever narrow what the human could do, never
// widen it.
enum MCPMethodClass {
  // Not yet classified. Reaches its handler, subject to RBAC as usual —
  // the classification is being rolled out method by method, and only
  // FORBIDDEN is enforced today.
  MCP_METHOD_CLASS_UNSPECIFIED = 0;
  // Served to a read-only MCP session and above.
  READ = 1;
  // Served to a read-write MCP session only.
  WRITE = 2;
  // Never reachable by an MCP session, whatever the caller's own
  // permissions are. These methods escape the MCP boundary rather than
  // merely exercising a permission: a human with the permission uses the
  // console; an agent acting for them does not get to.
  FORBIDDEN = 3;
}

// Why an RPC is FORBIDDEN to MCP sessions. The mechanism, not the wording:
// each value names what its methods actually do, and the serving side turns
// that into a sentence. A denial whose stated reason has drifted from the
// mechanism is worse than a bare refusal, because it is the thing the next
// reader trusts — so a method changing what it does changes its reason here.
enum MCPForbiddenReason {
  // No reason recorded. The method is still denied — mcp_method_class is what
  // enforces — and the denial falls back to generic wording.
  MCP_FORBIDDEN_REASON_UNSPECIFIED = 0;
  // Puts a token for the caller's own principal in the response body.
  MINTS_CREDENTIAL = 1;
  // Drives the out-of-band reset flow that sets or delivers the secret a
  // login accepts.
  RESETS_CREDENTIAL = 2;
  // Rewrites an account's own credentials, which would let the session log in
  // as that account.
  TAKES_OVER_ACCOUNT = 3;
  // Destroys the human's own login session.
  ENDS_SESSION = 4;
  // Destroys the caller's own workspace membership and mints a plain
  // workspace token on the way out.
  ENDS_MEMBERSHIP = 5;
  // Leaves someone holding a principal the caller is not — by issuing its
  // credential, carrying an existing one out to a host the caller named,
  // choosing what will later be trusted to mint one, or redirecting where one
  // gets delivered.
  MINTS_CREDENTIAL_FOR_OTHERS = 6;
}
