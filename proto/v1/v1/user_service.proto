syntax = "proto3";

package bytebase.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "v1/annotation.proto";
import "v1/common.proto";

option go_package = "github.com/bytebase/bytebase/backend/generated-go/v1";

// UserService manages user accounts and authentication.
service UserService {
  // Get the user.
  // Any authenticated user can get the user.
  // Permissions required: bb.users.get
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {get: "/v1/{name=users/*}"};
    option (google.api.method_signature) = "name";
    option (bytebase.v1.permission) = "bb.users.get";
    option (bytebase.v1.auth_method) = IAM;
    option (bytebase.v1.audit) = DENIALS;
    option (bytebase.v1.mcp_method_class) = EXCLUDED;
    option (bytebase.v1.mcp_denial_reason) = ADMINISTERS_THE_WORKSPACE;
  }

  // Get the users in batch.
  // Any authenticated user can batch get users.
  // One resource per requested name, in request order. The first name that
  // does not resolve fails the whole call (AIP-231: no partial response).
  // Permissions required: bb.users.get
  rpc BatchGetUsers(BatchGetUsersRequest) returns (BatchGetUsersResponse) {
    option (google.api.http) = {get: "/v1/users:batchGet"};
    option (bytebase.v1.permission) = "bb.users.get";
    option (bytebase.v1.auth_method) = IAM;
    option (bytebase.v1.audit) = DENIALS;
    option (bytebase.v1.mcp_method_class) = EXCLUDED;
    option (bytebase.v1.mcp_denial_reason) = ADMINISTERS_THE_WORKSPACE;
  }

  // Get the current authenticated user.
  // Permissions required: None
  rpc GetCurrentUser(google.protobuf.Empty) returns (User) {
    option (google.api.http) = {get: "/v1/users/me"};
    option (bytebase.v1.allow_without_credential) = true;
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.audit) = DENIALS;
    option (bytebase.v1.mcp_method_class) = READ;
  }

  // List all users.
  // Any authenticated user can list users.
  // Permissions required: bb.users.list
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {get: "/v1/users"};
    option (google.api.method_signature) = "parent";
    option (bytebase.v1.permission) = "bb.users.list";
    option (bytebase.v1.auth_method) = IAM;
    option (bytebase.v1.audit) = DENIALS;
    option (bytebase.v1.mcp_method_class) = EXCLUDED;
    option (bytebase.v1.mcp_denial_reason) = ADMINISTERS_THE_WORKSPACE;
  }

  // Creates a user in the caller's workspace (admin action, self-hosted only).
  // In SaaS mode, admins should add users via workspace IAM policy instead.
  // Permissions required: bb.users.create
  rpc CreateUser(CreateUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "user"
    };
    option (google.api.method_signature) = "user";
    option (bytebase.v1.auth_method) = IAM;
    option (bytebase.v1.permission) = "bb.users.create";
    option (bytebase.v1.audit) = ALL;
    option (bytebase.v1.mcp_method_class) = FORBIDDEN;
    option (bytebase.v1.mcp_denial_reason) = MINTS_CREDENTIAL_FOR_OTHERS;
  }

  // Updates a user. Users can update their own profile, or users with bb.users.update permission can update any user.
  // Note: Email updates are not supported through this API. Use UpdateEmail instead.
  // Permissions required: bb.users.update (or self)
  rpc UpdateUser(UpdateUserRequest) returns (User) {
    option (google.api.http) = {
      patch: "/v1/{user.name=users/*}"
      body: "user"
    };
    option (google.api.method_signature) = "user,update_mask";
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.audit) = ALL;
    option (bytebase.v1.mcp_method_class) = FORBIDDEN;
    option (bytebase.v1.mcp_denial_reason) = TAKES_OVER_ACCOUNT;
  }

  // Deletes a user. Requires bb.users.delete permission with additional validation: the last remaining workspace admin cannot be deleted.
  // Permissions required: bb.users.delete
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=users/*}"};
    option (google.api.method_signature) = "name";
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.audit) = ALL;
    option (bytebase.v1.mcp_method_class) = EXCLUDED;
    option (bytebase.v1.mcp_denial_reason) = ADMINISTERS_THE_WORKSPACE;
  }

  // Restores a deleted user.
  // Permissions required: bb.users.undelete
  rpc UndeleteUser(UndeleteUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/{name=users/*}:undelete"
      body: "*"
    };
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.audit) = ALL;
    option (bytebase.v1.mcp_method_class) = EXCLUDED;
    option (bytebase.v1.mcp_denial_reason) = ADMINISTERS_THE_WORKSPACE;
  }

  // Updates a user's email address.
  // Permissions required: bb.users.updateEmail
  rpc UpdateEmail(UpdateEmailRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/{name=users/*}:updateEmail"
      body: "*"
    };
    option (google.api.method_signature) = "name,email";
    option (bytebase.v1.permission) = "bb.users.updateEmail";
    option (bytebase.v1.auth_method) = IAM;
    option (bytebase.v1.audit) = ALL;
    option (bytebase.v1.mcp_method_class) = FORBIDDEN;
    option (bytebase.v1.mcp_denial_reason) = MINTS_CREDENTIAL_FOR_OTHERS;
  }

  // Sends a one-time code to the caller's own email, usable as
  // CredentialProof.email_code. Bytebase Cloud only, and only while the
  // account has no live MFA factor. Not AuthService.SendEmailLoginCode: that
  // one starts a session, this one proves an existing one.
  // Permissions required: None beyond being signed in as `name`.
  rpc RequestReauthCode(RequestReauthCodeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/{name=users/*}:requestReauthCode"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.audit) = ALL;
    option (bytebase.v1.mcp_method_class) = FORBIDDEN;
    option (bytebase.v1.mcp_denial_reason) = RESETS_CREDENTIAL;
  }

  // Changes the caller's own password. An administrator resetting someone
  // else's password uses UpdateUser with the `password` mask instead — that
  // is a different operation with a different audit story, even though both
  // end in a new password hash.
  // Permissions required: None beyond being signed in as `name`.
  rpc ChangePassword(ChangePasswordRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/{name=users/*}:changePassword"
      body: "*"
    };
    option (google.api.method_signature) = "name,new_password";
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.audit) = ALL;
    option (bytebase.v1.mcp_method_class) = FORBIDDEN;
    option (bytebase.v1.mcp_denial_reason) = TAKES_OVER_ACCOUNT;
  }

  // Mints a pending TOTP secret and recovery codes for the caller's own
  // account and returns them. Nothing goes live until ConfirmRecoveryCodes,
  // so an abandoned enrollment leaves the account exactly as it was.
  // Permissions required: None beyond being signed in as `name`.
  rpc StartMFAEnrollment(StartMFAEnrollmentRequest) returns (StartMFAEnrollmentResponse) {
    option (google.api.http) = {
      post: "/v1/{name=users/*}:startMFAEnrollment"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.audit) = ALL;
    option (bytebase.v1.mcp_method_class) = FORBIDDEN;
    option (bytebase.v1.mcp_denial_reason) = MINTS_CREDENTIAL;
  }

  // Verifies an otp_code against the pending enrollment. Nothing is written:
  // this is the step that catches a mistyped authenticator before the caller
  // is shown recovery codes, and promotion happens at ConfirmRecoveryCodes so
  // an account is never MFA-required with codes its owner never saved.
  // Permissions required: None beyond being signed in as `name`.
  // It writes nothing itself, but it is a required step of installing a
  // factor on the account, which is why it is denied on the same grounds as
  // the promotion it precedes.
  rpc EnableMFA(EnableMFARequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/{name=users/*}:enableMFA"
      body: "*"
    };
    option (google.api.method_signature) = "name,otp_code";
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.audit) = ALL;
    option (bytebase.v1.mcp_method_class) = FORBIDDEN;
    option (bytebase.v1.mcp_denial_reason) = TAKES_OVER_ACCOUNT;
  }

  // Turns MFA off, clearing the entire MFA config — live and pending state
  // alike. Callers may disable their own; an administrator may disable
  // another user's with bb.users.update, which is how a locked-out user is
  // recovered.
  // Permissions required: bb.users.update, unless `name` is the caller's own.
  rpc DisableMFA(DisableMFARequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/{name=users/*}:disableMFA"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.audit) = ALL;
    option (bytebase.v1.mcp_method_class) = FORBIDDEN;
    option (bytebase.v1.mcp_denial_reason) = TAKES_OVER_ACCOUNT;
  }

  // Mints a pending recovery-code set beside the live one and returns it.
  // The old codes keep working until ConfirmRecoveryCodes promotes these, so
  // a caller who closes the page mid-way is not left without any.
  // Permissions required: None beyond being signed in as `name`.
  rpc RegenerateRecoveryCodes(RegenerateRecoveryCodesRequest) returns (RegenerateRecoveryCodesResponse) {
    option (google.api.http) = {
      post: "/v1/{name=users/*}:regenerateRecoveryCodes"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.audit) = ALL;
    option (bytebase.v1.mcp_method_class) = FORBIDDEN;
    option (bytebase.v1.mcp_denial_reason) = MINTS_CREDENTIAL;
  }

  // Promotes the pending recovery codes. During first-time enrollment this is
  // also where the pending TOTP secret goes live, so the factor and the codes
  // that recover it start existing in the same write.
  // Permissions required: None beyond being signed in as `name`.
  rpc ConfirmRecoveryCodes(ConfirmRecoveryCodesRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/{name=users/*}:confirmRecoveryCodes"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.audit) = ALL;
    option (bytebase.v1.mcp_method_class) = FORBIDDEN;
    option (bytebase.v1.mcp_denial_reason) = TAKES_OVER_ACCOUNT;
  }
}

message GetUserRequest {
  // The name of the user to retrieve.
  // Format: users/{email}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/User"}
  ];
}

message BatchGetUsersRequest {
  // The user names to retrieve.
  // Format: users/{email}
  repeated string names = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/User"}
  ];
}

message BatchGetUsersResponse {
  // One user per requested name, in the same order as `names`.
  repeated User users = 1;
}

message ListUsersRequest {
  // The maximum number of users to return. The service may return fewer than
  // this value.
  // If unspecified, at most 10 users will be returned.
  // The maximum value is 1000; values above 1000 will be coerced to 1000.
  int32 page_size = 1;

  // A page token, received from a previous `ListUsers` call.
  // Provide this to retrieve the subsequent page.
  //
  // When paginating, all other parameters provided to `ListUsers` must match
  // the call that provided the page token.
  string page_token = 2;

  // Show deleted users if specified.
  bool show_deleted = 3;

  // Filter is used to filter users returned in the list.
  // The syntax and semantics of CEL are documented at https://github.com/google/cel-spec
  //
  // Supported filter:
  // - name: the user name, support "==" and ".contains()" operator.
  // - email: the user email, support "==" and ".contains()" operator.
  // - state: check State enum for values, support "==" operator.
  // - project: the project full name in "projects/{id}" format, support "==" operator.
  //
  // For example:
  // name == "ed"
  // name.contains("ed")
  // email == "ed@bytebase.com"
  // email.contains("ed")
  // state == "DELETED"
  // project == "projects/sample-project"
  // You can combine filter conditions like:
  // name.contains("ed") && project == "projects/sample-project"
  // (name == "ed" || email == "ed@bytebase.com") && project == "projects/sample-project"
  string filter = 4;
}

message ListUsersResponse {
  // The users from the specified request.
  repeated User users = 1;

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

message CreateUserRequest {
  // The user to create.
  User user = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateUserRequest {
  // The user to update.
  //
  // The user's `name` field is used to identify the user to update.
  // Format: users/{email}
  User user = 1 [(google.api.field_behavior) = REQUIRED];

  // The list of fields to update.
  google.protobuf.FieldMask update_mask = 2;

  // MFA enrollment moved to the dedicated methods: StartMFAEnrollment,
  // EnableMFA, DisableMFA, RegenerateRecoveryCodes, ConfirmRecoveryCodes.
  reserved 3, 4, 5;
  reserved "otp_code", "regenerate_temp_mfa_secret", "regenerate_recovery_codes";

  // If set to true, and the user is not found, a new user will be created.
  // In this situation, `update_mask` is ignored.
  bool allow_missing = 6;
}

message DeleteUserRequest {
  // The name of the user to delete.
  // Format: users/{email}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/User"}
  ];
}

message UndeleteUserRequest {
  // The name of the deleted user.
  // Format: users/{email}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/User"}
  ];
}

message UpdateEmailRequest {
  // The name of the user whose email to update.
  // Format: users/{email}
  // Note: This is the current (old) email address. The new email is specified in the 'email' field.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/User"}
  ];

  // The new email address.
  string email = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.max_len = 254
  ];
}

// One proof that the caller currently controls a credential on the account.
// Exactly one field must be set; enforced in the handler.
message CredentialProof {
  oneof proof {
    // The account's current password. Refused by a factor-touching method
    // while a live MFA factor exists.
    string current_password = 1 [
      (bytebase.v1.audit_behavior) = SENSITIVE,
      (buf.validate.field).string.max_bytes = 72
    ];

    // A live code from the account's enrolled TOTP authenticator.
    string otp_code = 2 [
      (bytebase.v1.audit_behavior) = SENSITIVE,
      (buf.validate.field).string.max_len = 64
    ];

    // A single-use MFA recovery code.
    string recovery_code = 3 [
      (bytebase.v1.audit_behavior) = SENSITIVE,
      (buf.validate.field).string.max_len = 64
    ];

    // A one-time code from RequestReauthCode. Bytebase Cloud only, and only
    // while the account has no live MFA factor.
    string email_code = 4 [
      (bytebase.v1.audit_behavior) = SENSITIVE,
      (buf.validate.field).string.max_len = 64
    ];
  }
}

message RequestReauthCodeRequest {
  // Format: users/{email}. Must be the caller's own name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/User"},
    (buf.validate.field).string.max_len = 260
  ];
}

message ChangePasswordRequest {
  // Format: users/{email}. Must be the caller's own name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/User"},
    (buf.validate.field).string.max_len = 260
  ];

  string new_password = 2 [
    (google.api.field_behavior) = REQUIRED,
    (bytebase.v1.audit_behavior) = SENSITIVE,
    (buf.validate.field).string.max_bytes = 72
  ];

  CredentialProof credential = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
}

message StartMFAEnrollmentRequest {
  // Format: users/{email}. Must be the caller's own name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/User"},
    (buf.validate.field).string.max_len = 260
  ];
}

message StartMFAEnrollmentResponse {
  // The pending TOTP secret. The only response that carries it — it is never
  // readable from the User resource.
  string otp_secret = 1 [(bytebase.v1.audit_behavior) = SENSITIVE];

  // The pending recovery codes, shown once for the caller to save.
  repeated string recovery_codes = 2 [(bytebase.v1.audit_behavior) = SENSITIVE];

  // When this enrollment stops being confirmable.
  google.protobuf.Timestamp expire_time = 3;

  // Identifies this mint. Echo it back to EnableMFA and
  // ConfirmRecoveryCodes; a mint from another tab or device replaces the
  // pending state, and those methods refuse a version that is no longer the
  // pending one rather than promoting something this caller never saw.
  google.protobuf.Timestamp pending_version = 4;
}

message EnableMFARequest {
  // Format: users/{email}. Must be the caller's own name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/User"},
    (buf.validate.field).string.max_len = 260
  ];

  // A code from the authenticator the pending secret was just added to.
  string otp_code = 2 [
    (google.api.field_behavior) = REQUIRED,
    (bytebase.v1.audit_behavior) = SENSITIVE,
    (buf.validate.field).string.max_len = 64
  ];

  // The pending_version this enrollment was minted with.
  google.protobuf.Timestamp pending_version = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Proof of the *existing* factor, not the new device above. Required for a
  // rotation, and for first-time enrollment on an account with a password.
  CredentialProof credential = 4 [(google.api.field_behavior) = OPTIONAL];
}

message DisableMFARequest {
  // Format: users/{email}. The caller's own, or another user's with
  // bb.users.update.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/User"},
    (buf.validate.field).string.max_len = 260
  ];

  // Required for a self-service call against a live factor, and then only
  // otp_code or recovery_code. Unused on an admin-assisted call.
  CredentialProof credential = 2 [(google.api.field_behavior) = OPTIONAL];
}

message RegenerateRecoveryCodesRequest {
  // Format: users/{email}. Must be the caller's own name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/User"},
    (buf.validate.field).string.max_len = 260
  ];
}

message RegenerateRecoveryCodesResponse {
  // The pending recovery codes, shown once for the caller to save.
  repeated string recovery_codes = 1 [(bytebase.v1.audit_behavior) = SENSITIVE];

  // Identifies this mint; see StartMFAEnrollmentResponse.pending_version.
  google.protobuf.Timestamp pending_version = 2;
}

message ConfirmRecoveryCodesRequest {
  // Format: users/{email}. Must be the caller's own name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/User"},
    (buf.validate.field).string.max_len = 260
  ];

  // The pending_version of the codes being confirmed. Confirming promotes
  // exactly the set this version identifies, or nothing.
  google.protobuf.Timestamp pending_version = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  CredentialProof credential = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Required for first-time enrollment, rejected otherwise. A *fresh* code,
  // not the one EnableMFA took.
  string otp_code = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (bytebase.v1.audit_behavior) = SENSITIVE,
    (buf.validate.field).string.max_len = 64
  ];
}

message User {
  reserved 5, 7, 15;

  option (google.api.resource) = {
    type: "bytebase.com/User"
    pattern: "users/{email}"
  };

  // The name of the user.
  // Format: users/{email}
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The lifecycle state of the user account.
  State state = 2;

  // The email address of the user, used for login and notifications.
  string email = 3 [(buf.validate.field).string.max_len = 254];

  // The display title or full name of the user.
  string title = 4 [(buf.validate.field).string.max_len = 200];

  // The password for authentication. Only used during user creation or password updates.
  string password = 6 [
    (google.api.field_behavior) = INPUT_ONLY,
    (bytebase.v1.audit_behavior) = SENSITIVE,
    (buf.validate.field).string.max_bytes = 72
  ];

  // Whether the user has a live MFA factor. Set by ConfirmRecoveryCodes and
  // DisableMFA, never by an update.
  bool mfa_enabled = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Pending enrollment state is no longer readable from the user resource:
  // StartMFAEnrollment and RegenerateRecoveryCodes return it once, to the
  // caller enrolling, and nowhere else.
  reserved 9, 10, 11;
  reserved "temp_otp_secret", "temp_recovery_codes", "temp_otp_secret_created_time";

  // Should be a valid E.164 compliant phone number.
  // Could be empty.
  string phone = 12 [(bytebase.v1.audit_behavior) = OMIT];

  message Profile {
    // The last time the user successfully logged in.
    google.protobuf.Timestamp last_login_time = 1;
    // The last time the user changed their password.
    google.protobuf.Timestamp last_change_password_time = 2;
    // source means where the user comes from. For now we support Entra ID SCIM sync, so the source could be Entra ID.
    string source = 3;
  }

  // User profile metadata.
  Profile profile = 13 [(bytebase.v1.audit_behavior) = OMIT];

  // The groups for the user.
  // Format: groups/{email}
  repeated string groups = 14 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (bytebase.v1.audit_behavior) = OMIT
  ];

  // The current workspace.
  // Format: workspaces/{id}
  string workspace = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
}
