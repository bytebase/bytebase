syntax = "proto3";

package bytebase.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "v1/annotation.proto";

option go_package = "github.com/bytebase/bytebase/backend/generated-go/v1";

// SavedQueryService manages saved queries in the SQL Editor.
//
// A saved query is private to its creator until shared. Permissions come from
// three places:
// - The creator owns the saved query and holds every permission on it.
// - A VIEWER binding grants bb.savedQueries.get and getIamPolicy; an EDITOR
//   binding adds update.
// - Permissions granted on the project or workspace apply to every saved
//   query in the project, private ones included.
// A caller without a method's permission gets NotFound, not
// PermissionDenied, so private names stay unprobeable. Running a saved query
// is governed by the SQL Editor's database permissions, not by this service.
service SavedQueryService {
  // Create a saved query. The creator becomes the owner and the saved query
  // starts private.
  // Permissions required: bb.savedQueries.create on the project
  rpc CreateSavedQuery(CreateSavedQueryRequest) returns (SavedQuery) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*}/savedQueries"
      body: "saved_query"
    };
    option (google.api.method_signature) = "parent,saved_query";
    option (bytebase.v1.permission) = "bb.savedQueries.create";
    option (bytebase.v1.auth_method) = IAM;
    option (bytebase.v1.audit) = true;
    option (bytebase.v1.mcp_method_class) = WRITE;
  }

  // Get a saved query with its full content.
  // Permissions required: bb.savedQueries.get (creator, VIEWER/EDITOR
  // binding, or project-level grant)
  rpc GetSavedQuery(GetSavedQueryRequest) returns (SavedQuery) {
    option (google.api.http) = {get: "/v1/{name=projects/*/savedQueries/*}"};
    option (google.api.method_signature) = "name";
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.mcp_method_class) = READ;
  }

  // List saved queries for auditing. The permission alone grants reading
  // every matched saved query with full content, private ones included;
  // bindings are ignored. Use parent "projects/-" for all projects.
  // Permissions required: bb.savedQueries.list on the project, or on the
  // workspace when the parent is "projects/-"
  rpc ListSavedQueries(ListSavedQueriesRequest) returns (ListSavedQueriesResponse) {
    option (google.api.http) = {get: "/v1/{parent=projects/*}/savedQueries"};
    option (google.api.method_signature) = "parent";
    option (bytebase.v1.permission) = "bb.savedQueries.list";
    option (bytebase.v1.auth_method) = IAM;
    option (bytebase.v1.mcp_method_class) = EXCLUDED;
    option (bytebase.v1.mcp_exclusion_reason) = READS_OTHER_USERS_SQL;
  }

  // Search saved queries in one project. Returns content previews of the
  // saved queries the caller can read, the same access rule as GetSavedQuery.
  // Permissions required: bb.savedQueries.search on the project
  rpc SearchSavedQueries(SearchSavedQueriesRequest) returns (SearchSavedQueriesResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*}/savedQueries:search"
      body: "*"
    };
    option (google.api.method_signature) = "parent";
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.mcp_method_class) = READ;
  }

  // Search folder paths. A path is returned when it holds at least one saved
  // query the caller can read, the same access rule as SearchSavedQueries.
  // Permissions required: bb.savedQueries.search on the project
  rpc SearchSavedQueryFolders(SearchSavedQueryFoldersRequest) returns (SearchSavedQueryFoldersResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*}/savedQueries:searchFolders"
      body: "*"
    };
    option (google.api.method_signature) = "parent";
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.mcp_method_class) = READ;
  }

  // Update a saved query. `database` must belong to the saved query's project.
  // Permissions required: bb.savedQueries.update (creator, EDITOR binding, or
  // project-level grant)
  rpc UpdateSavedQuery(UpdateSavedQueryRequest) returns (SavedQuery) {
    option (google.api.http) = {
      patch: "/v1/{saved_query.name=projects/*/savedQueries/*}"
      body: "saved_query"
    };
    option (google.api.method_signature) = "saved_query,update_mask";
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.audit) = true;
    option (bytebase.v1.mcp_method_class) = WRITE;
  }

  // Star or unstar a saved query for the caller. Stars are personal: nobody
  // else sees them and they grant nothing. The caller can star any saved
  // query they can read. When access is lost the star is hidden, not
  // deleted; it comes back if access returns.
  // Permissions required: bb.savedQueries.get (creator, VIEWER/EDITOR
  // binding, or project-level grant)
  rpc UpdateSavedQueryStar(UpdateSavedQueryStarRequest) returns (SavedQuery) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/savedQueries/*}:updateStar"
      body: "*"
    };
    option (google.api.method_signature) = "name,starred";
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.mcp_method_class) = WRITE;
  }

  // Move the caller's saved queries filed under `source_folder`, descendants
  // included, into `target_folder`: renaming "a/b" to "a/c" also moves
  // "a/b/deep". Only the caller's own saved queries move; the response counts
  // how many did. Re-filing a single saved query is UpdateSavedQuery's
  // `folder` field.
  // Permissions required: creator
  rpc MoveMySavedQueries(MoveMySavedQueriesRequest) returns (MoveMySavedQueriesResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*}/savedQueries:moveMy"
      body: "*"
    };
    option (google.api.method_signature) = "parent,source_folder,target_folder";
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.audit) = true;
    option (bytebase.v1.mcp_method_class) = WRITE;
  }

  // Delete a saved query and every user's stars on it. An EDITOR binding
  // cannot delete.
  // Permissions required: bb.savedQueries.delete (creator or project-level
  // grant)
  rpc DeleteSavedQuery(DeleteSavedQueryRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=projects/*/savedQueries/*}"};
    option (google.api.method_signature) = "name";
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.audit) = true;
    option (bytebase.v1.mcp_method_class) = WRITE;
  }

  // Get a saved query's sharing policy: who it is shared with, at what level.
  // Permissions required: bb.savedQueries.getIamPolicy (creator, VIEWER/EDITOR
  // binding, or project-level grant)
  rpc GetSavedQueryPolicy(GetSavedQueryPolicyRequest) returns (SavedQueryPolicy) {
    option (google.api.http) = {get: "/v1/{resource=projects/*/savedQueries/*}:getPolicy"};
    option (google.api.method_signature) = "resource";
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.mcp_method_class) = EXCLUDED;
    option (bytebase.v1.mcp_exclusion_reason) = ADMINISTERS_THE_WORKSPACE;
  }

  // Replace a saved query's sharing policy in full. `policy.etag` must match
  // the stored policy; a mismatch fails with ABORTED.
  // Permissions required: bb.savedQueries.setIamPolicy (creator or
  // project-level grant; no predefined role carries it)
  rpc SetSavedQueryPolicy(SetSavedQueryPolicyRequest) returns (SavedQueryPolicy) {
    option (google.api.http) = {
      post: "/v1/{resource=projects/*/savedQueries/*}:setPolicy"
      body: "*"
    };
    option (google.api.method_signature) = "resource,policy";
    option (bytebase.v1.auth_method) = CUSTOM;
    option (bytebase.v1.audit) = true;
    option (bytebase.v1.mcp_method_class) = EXCLUDED;
    option (bytebase.v1.mcp_exclusion_reason) = ADMINISTERS_THE_WORKSPACE;
  }
}

message CreateSavedQueryRequest {
  // The project to create the saved query in.
  // Format: projects/{project}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/Project"}
  ];

  // The saved query to create.
  SavedQuery saved_query = 2 [(google.api.field_behavior) = REQUIRED];
}

message GetSavedQueryRequest {
  // Format: projects/{project}/savedQueries/{savedQuery}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/SavedQuery"}
  ];
}

message ListSavedQueriesRequest {
  // The project to list saved queries in, or "projects/-" for every project.
  // Format: projects/{project}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/Project"}
  ];

  // Filter the result, in CEL. See https://github.com/google/cel-spec
  //
  // Supported fields:
  // - creator: the creator in "users/{email}" format. Supports "==" and "!=".
  //
  // For example:
  // creator == "users/alice@example.com"
  string filter = 2;

  // The maximum number of saved queries to return. The service may return
  // fewer. Defaults to 10; values above 1000 are coerced to 1000.
  int32 page_size = 3;

  // A page token from a previous ListSavedQueries call. Keep every other
  // parameter the same as the call that returned it.
  string page_token = 4;
}

message ListSavedQueriesResponse {
  repeated SavedQuery saved_queries = 1;

  // Pass to the next ListSavedQueries call to fetch the following page. Empty
  // on the last page.
  string next_page_token = 2;
}

message SearchSavedQueryFoldersRequest {
  // Format: projects/{project}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/Project"}
  ];

  // Filter folders by the saved queries they hold. Takes the same fields and
  // syntax as SearchSavedQueries.filter, except `title`. A folder is returned
  // when at least one saved query the caller can read matches.
  string filter = 2;
}

message SearchSavedQueryFoldersResponse {
  // Folder paths, every ancestor prefix included, sorted. A folder is a path
  // on saved queries ("a/b/c"), so empty folders cannot exist.
  repeated string folders = 1;
}

message UpdateSavedQueryRequest {
  // `saved_query.name` identifies the saved query to update.
  // Format: projects/{project}/savedQueries/{savedQuery}
  SavedQuery saved_query = 1 [(google.api.field_behavior) = REQUIRED];

  // Fields to update, relative to the saved query (`title`, not
  // `saved_query.title`). Supported: `title`, `content`, `database`, `folder`.
  // At least one path is required.
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateSavedQueryStarRequest {
  // Format: projects/{project}/savedQueries/{savedQuery}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/SavedQuery"}
  ];

  // Whether the caller stars the saved query.
  bool starred = 2;
}

message MoveMySavedQueriesRequest {
  // Format: projects/{project}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/Project"}
  ];

  // The folder to move, descendants included, e.g. "a/b".
  string source_folder = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 256
    }
  ];

  // Where it lands. A path like "a/b/c"; empty drops the `source_folder`
  // prefix, promoting the folder's contents toward the root.
  string target_folder = 3 [(buf.validate.field).string.max_len = 256];
}

message MoveMySavedQueriesResponse {
  // How many moved.
  int32 moved_count = 1;
}

message GetSavedQueryPolicyRequest {
  // Format: projects/{project}/savedQueries/{savedQuery}
  string resource = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/SavedQuery"}
  ];
}

message SetSavedQueryPolicyRequest {
  // Format: projects/{project}/savedQueries/{savedQuery}
  string resource = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/SavedQuery"}
  ];

  // The new policy, replacing the stored one in full. Empty `bindings` makes
  // the saved query private again.
  SavedQueryPolicy policy = 2 [(google.api.field_behavior) = REQUIRED];
}

// Who a saved query is shared with, and at what level. No bindings means
// private. The creator is never a binding member; ownership cannot be granted.
message SavedQueryPolicy {
  // At most one binding per level. A member listed under two levels is
  // rejected rather than resolved to the higher one.
  repeated SavedQueryBinding bindings = 1;

  // The etag of the policy as read. SetSavedQueryPolicy requires it and fails
  // with ABORTED when it no longer matches.
  string etag = 2;
}

// Binds members to one access level on one saved query.
message SavedQueryBinding {
  // Nested to avoid colliding with the package-scoped EDITOR in
  // DatabaseChangeMode.
  enum Level {
    LEVEL_UNSPECIFIED = 0;

    // Holds bb.savedQueries.get and bb.savedQueries.getIamPolicy on the
    // saved query: open and read it, and see who it is shared with.
    VIEWER = 1;

    // VIEWER, plus bb.savedQueries.update: write the title, content,
    // database, and folder. Not deletion, not setIamPolicy.
    EDITOR = 2;
  }

  Level level = 1 [(google.api.field_behavior) = REQUIRED];

  // The members granted `level`: "user:{email}" or "group:{email}" only.
  //
  // Service accounts cannot be grantees — they reach their own saved queries
  // as the creator. Naming one under "user:" grants nothing rather than
  // failing. Groups are stored as references, so membership stays live.
  repeated string members = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated.min_items = 1
  ];
}

message DeleteSavedQueryRequest {
  // Format: projects/{project}/savedQueries/{savedQuery}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/SavedQuery"}
  ];
}

message SearchSavedQueriesRequest {
  // Format: projects/{project}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/Project"}
  ];

  // Filter the result, in CEL. See https://github.com/google/cel-spec
  //
  // Supported fields:
  // - name: the saved query name. Supports "==" and "in [...]".
  // - title: the title. Supports "contains".
  // - creator: the creator in "users/{email}" format. Supports "==" and "!=".
  // - shared: whether a binding shares the saved query with the caller. Their
  //   own saved queries, and ones visible only through a project-level
  //   bb.savedQueries.get, are not "shared". Supports "==".
  // - starred: whether the caller starred it. Supports "==".
  // - folder: the exact folder path. Supports "==".
  //
  // Use `creator == "users/{me}"` for a My view and `shared == true` for a
  // Shared view. Prefer `shared` over `creator !=`: with a project-level
  // bb.savedQueries.get, `creator !=` also matches saved queries nobody
  // shared with the caller.
  //
  // For example:
  // creator == "users/alice@example.com"
  // shared == true
  // starred == true
  // title.contains("weekly report")
  // folder == "foo/bar"
  string filter = 2;

  // The maximum number of saved queries to return. The service may return
  // fewer. Defaults to 10; values above 1000 are coerced to 1000.
  int32 page_size = 3;

  // A page token from a previous SearchSavedQueries call. Keep every other
  // parameter the same as the call that returned it.
  string page_token = 4;
}

message SearchSavedQueriesResponse {
  repeated SavedQuery saved_queries = 1;

  // Pass to the next SearchSavedQueries call to fetch the following page.
  // Empty on the last page.
  string next_page_token = 2;
}

message SavedQuery {
  option (google.api.resource) = {
    type: "bytebase.com/SavedQuery"
    pattern: "projects/{project}/savedQueries/{saved_query}"
  };

  // Server-generated.
  // Format: projects/{project}/savedQueries/{savedQuery}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // Format: projects/{project}
  string project = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The connected database, which must belong to the saved query's own
  // project. Empty when none is connected, or when the database no longer
  // exists.
  // Format: instances/{instance}/databases/{database}
  string database = 3;

  // The title of the saved query.
  string title = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.max_len = 200
  ];

  // The owner. Ownership does not transfer.
  // Format: users/{email}
  string creator = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp update_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The SQL text. SearchSavedQueries returns a truncated preview;
  // GetSavedQuery returns the full text.
  bytes content = 8 [(google.api.field_behavior) = REQUIRED];

  // The full size of the content, which may exceed the `content` returned.
  int64 content_size = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Removed: `visibility`, superseded by bindings; `folders`, superseded by
  // the `folder` path.
  reserved 10, 12;

  // Whether the calling user starred it.
  bool starred = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The folder holding this saved query. A path like "a/b/c"; empty means
  // unfiled.
  string folder = 13 [(buf.validate.field).string.max_len = 256];
}
