syntax = "proto3";

package bytebase.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "v1/annotation.proto";

option go_package = "github.com/bytebase/bytebase/backend/generated-go/v1";

// SavedQueryService manages saved queries for SQL Editor query development.
// Permission IDs still use the legacy `bb.worksheets.*` names; they are
// renamed together with the access-model redesign and its role migration.
service SavedQueryService {
  // Creates a personal saved query used in SQL Editor. Any authenticated user can create their own saved queries.
  // Permissions required: None (authenticated users only)
  rpc CreateSavedQuery(CreateSavedQueryRequest) returns (SavedQuery) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*}/savedQueries"
      body: "saved_query"
    };
    option (google.api.method_signature) = "parent,saved_query";
    option (bytebase.v1.auth_method) = CUSTOM;
  }

  // Get a saved query by name.
  // The users can access this method if,
  // - they are the creator of the saved query;
  // - they have bb.worksheets.get permission on the workspace;
  // - the saved query is shared with them with PROJECT_READ and PROJECT_WRITE visibility, and they have bb.projects.get permission on the project.
  // Permissions required: bb.worksheets.get (or creator, or project member for shared saved queries)
  rpc GetSavedQuery(GetSavedQueryRequest) returns (SavedQuery) {
    option (google.api.http) = {get: "/v1/{name=projects/*/savedQueries/*}"};
    option (google.api.method_signature) = "name";
    option (bytebase.v1.auth_method) = CUSTOM;
  }

  // List saved queries.
  // This is used for listing saved queries in a project, or across all projects by using `projects/-`.
  // Permissions required: bb.worksheets.list
  rpc ListSavedQueries(ListSavedQueriesRequest) returns (ListSavedQueriesResponse) {
    option (google.api.http) = {get: "/v1/{parent=projects/*}/savedQueries"};
    option (google.api.method_signature) = "parent";
    option (bytebase.v1.permission) = "bb.worksheets.list";
    option (bytebase.v1.auth_method) = IAM;
  }

  // List the caller's saved query folders.
  // Only folders stored in the caller's saved query organizer are returned.
  rpc ListSavedQueryFolders(ListSavedQueryFoldersRequest) returns (ListSavedQueryFoldersResponse) {
    option (google.api.http) = {get: "/v1/{parent=projects/*}/savedQueryFolders"};
    option (google.api.method_signature) = "parent";
    option (bytebase.v1.auth_method) = CUSTOM;
  }

  // Search for saved queries.
  // This is used for finding my saved queries or saved queries shared by other people.
  // The saved query accessibility is the same as GetSavedQuery().
  // Permissions required: bb.worksheets.get (or creator, or project member for shared saved queries)
  rpc SearchSavedQueries(SearchSavedQueriesRequest) returns (SearchSavedQueriesResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*}/savedQueries:search"
      body: "*"
    };
    option (google.api.method_signature) = "parent";
    option (bytebase.v1.auth_method) = CUSTOM;
  }

  // Update a saved query.
  // The users can access this method if,
  // - they are the creator of the saved query;
  // - they have bb.worksheets.manage permission on the workspace;
  // - the saved query is shared with them with PROJECT_WRITE visibility, and they have bb.projects.get permission on the project.
  // Permissions required: bb.worksheets.manage (or creator, or project member for PROJECT_WRITE saved queries)
  rpc UpdateSavedQuery(UpdateSavedQueryRequest) returns (SavedQuery) {
    option (google.api.http) = {
      patch: "/v1/{saved_query.name=projects/*/savedQueries/*}"
      body: "saved_query"
    };
    option (google.api.method_signature) = "saved_query,update_mask";
    option (bytebase.v1.auth_method) = CUSTOM;
  }

  // Update the organizer of a saved query.
  // The access is the same as UpdateSavedQuery method.
  // Permissions required: bb.worksheets.get (or creator, or project member for shared saved queries)
  rpc UpdateSavedQueryOrganizer(UpdateSavedQueryOrganizerRequest) returns (SavedQueryOrganizer) {
    option (google.api.http) = {
      patch: "/v1/{organizer.saved_query=projects/*/savedQueries/*}/organizer"
      body: "organizer"
    };
    option (google.api.method_signature) = "organizer,update_mask";
    option (bytebase.v1.auth_method) = CUSTOM;
  }

  // Batch update the organizers of saved queries.
  // The access is the same as UpdateSavedQuery method.
  // Permissions required: bb.worksheets.get (or creator, or project member for shared saved queries)
  rpc BatchUpdateSavedQueryOrganizer(BatchUpdateSavedQueryOrganizerRequest) returns (BatchUpdateSavedQueryOrganizerResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*}/savedQueries/organizers:batchUpdate"
      body: "*"
    };
    option (google.api.method_signature) = "parent,organizer,update_mask";
    option (bytebase.v1.auth_method) = CUSTOM;
  }

  // Delete a saved query.
  // The access is the same as UpdateSavedQuery method.
  // Permissions required: bb.worksheets.manage (or creator, or project member for PROJECT_WRITE saved queries)
  rpc DeleteSavedQuery(DeleteSavedQueryRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=projects/*/savedQueries/*}"};
    option (google.api.method_signature) = "name";
    option (bytebase.v1.auth_method) = CUSTOM;
  }
}

message CreateSavedQueryRequest {
  // The parent resource where this saved query will be created.
  // Format: projects/{project}
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // The saved query to create.
  SavedQuery saved_query = 2 [(google.api.field_behavior) = REQUIRED];
}

message GetSavedQueryRequest {
  // The name of the saved query to retrieve.
  // Format: projects/{project}/savedQueries/{savedQuery}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListSavedQueriesRequest {
  // The parent resource of the saved queries.
  // Format: projects/{project}
  // Use "projects/-" to list saved queries across all projects.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "bytebase.com/Project"}
  ];

  // To filter the list result.
  // The syntax and semantics of CEL are documented at https://github.com/google/cel-spec
  //
  // Supported filter:
  // - creator: the saved query creator in "users/{email}" format, support "==" and "!=" operator.
  //
  // For example:
  // creator == "users/{email}"
  // creator != "users/{email}"
  string filter = 2;

  // The maximum number of saved queries to return. The service may return fewer than
  // this value.
  // If unspecified, at most 10 saved queries will be returned.
  // The maximum value is 1000; values above 1000 will be coerced to 1000.
  int32 page_size = 3;

  // A page token, received from a previous `ListSavedQueries` call.
  // Provide this to retrieve the subsequent page.
  //
  // When paginating, all other parameters provided to `ListSavedQueries` must match
  // the call that provided the page token.
  string page_token = 4;
}

message ListSavedQueriesResponse {
  // The saved queries from the specified parent.
  repeated SavedQuery saved_queries = 1;

  // A token to retrieve next page of saved queries.
  // Pass this value in the page_token field in the subsequent call to
  // `ListSavedQueries` method to retrieve the next page of saved queries.
  string next_page_token = 2;
}

message ListSavedQueryFoldersRequest {
  // The parent resource of the saved query folders.
  // Format: projects/{project}
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListSavedQueryFoldersResponse {
  // The caller's saved query folders.
  repeated SavedQueryFolder folders = 1;
}

message SavedQueryFolder {
  enum Category {
    CATEGORY_UNSPECIFIED = 0;
    MINE = 1;
    SHARED = 2;
  }

  // The folder path segments.
  repeated string folders = 1;

  // The folder category.
  Category category = 2;
}

message UpdateSavedQueryRequest {
  // The saved query to update.
  //
  // The saved query's `name` field is used to identify the saved query to update.
  // Format: projects/{project}/savedQueries/{savedQuery}
  SavedQuery saved_query = 1 [(google.api.field_behavior) = REQUIRED];

  // The list of fields to be updated.
  // Fields are specified relative to the saved query.
  // (e.g., `title`, `statement`; *not* `saved_query.title` or `saved_query.statement`)
  // Only support update the following fields for now:
  // - `title`
  // - `statement`
  // - `starred`
  // - `visibility`
  google.protobuf.FieldMask update_mask = 2;
}

message BatchUpdateSavedQueryOrganizerRequest {
  // The parent resource whose saved queries' organizers are updated.
  // Format: projects/{project}
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // To filter the batch update target.
  // The syntax and semantics of CEL are documented at https://github.com/google/cel-spec
  //
  // Supported filter:
  // - name: the saved query name in "projects/{project}/savedQueries/{savedQuery}" format, support "==" and "in [xx]" operator.
  // - creator: the saved query creator in "users/{email}" format, support "==" and "!=" operator.
  // - starred: should be "true" or "false", filter starred/unstarred saved queries, support "==" operator.
  // - visibility: check Visibility enum in the SavedQuery message for values, support "==" and "in [xx]" operator.
  // - folder: the saved query organizer folder path, support exact "==" operator.
  string filter = 2;

  // The organizer fields to update.
  SavedQueryOrganizer organizer = 3 [(google.api.field_behavior) = REQUIRED];

  // The list of fields to be updated.
  // Fields are specified relative to the saved query organizer.
  // Only support update the following fields for now:
  // - `starred`
  // - `folders`
  google.protobuf.FieldMask update_mask = 4 [(google.api.field_behavior) = REQUIRED];
}

message BatchUpdateSavedQueryOrganizerResponse {
  repeated SavedQueryOrganizer saved_query_organizers = 1;

  int32 updated_count = 2;
}

message UpdateSavedQueryOrganizerRequest {
  // The organizer to update.
  //
  // The organizer's `saved_query` field is used to identify the saved query.
  // Format: projects/{project}/savedQueries/{savedQuery}
  SavedQueryOrganizer organizer = 1 [(google.api.field_behavior) = REQUIRED];

  // The list of fields to be updated.
  // Fields are specified relative to the saved query organizer.
  // Only support update the following fields for now:
  // - `starred`
  google.protobuf.FieldMask update_mask = 2;

  // If set to true, and the saved query organizer is not found, a new saved query organizer will be created.
  // In this situation, `update_mask` is ignored.
  bool allow_missing = 3;
}

message SavedQueryOrganizer {
  // The name of the saved query.
  // Format: projects/{project}/savedQueries/{savedQuery}
  string saved_query = 1 [(google.api.field_behavior) = REQUIRED];

  // starred means if the saved query is starred.
  bool starred = 2;

  repeated string folders = 3;
}

message DeleteSavedQueryRequest {
  // The name of the saved query to delete.
  // Format: projects/{project}/savedQueries/{savedQuery}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message SearchSavedQueriesRequest {
  // The parent resource of the saved queries.
  // Format: projects/{project}
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // To filter the search result.
  // The syntax and semantics of CEL are documented at https://github.com/google/cel-spec
  //
  // Supported filter:
  // - name: the saved query name in "projects/{project}/savedQueries/{savedQuery}" format, support "==" and "in [xx]" operator.
  // - title: the saved query title, support "contains" operator.
  // - creator: the saved query creator in "users/{email}" format, support "==" and "!=" operator.
  // - starred: should be "true" or "false", filter starred/unstarred saved queries, support "==" operator.
  // - visibility: check Visibility enum in the SavedQuery message for values, support "==" and "in [xx]" operator.
  // - folder: the saved query organizer folder path, support "==" operator.
  //
  // For example:
  // creator == "users/{email}"
  // title.contains("saved query title")
  // creator != "users/{email}"
  // starred == true
  // starred == false
  // visibility in ["PRIVATE", "PROJECT_READ", "PROJECT_WRITE"]
  // visibility == "PRIVATE"
  // folder == "foo/bar"
  string filter = 2;

  // The maximum number of saved queries to return. The service may return fewer than
  // this value.
  // If unspecified, at most 10 saved queries will be returned.
  // The maximum value is 1000; values above 1000 will be coerced to 1000.
  int32 page_size = 3;

  // A page token, received from a previous `SearchSavedQueries` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 4;
}

message SearchSavedQueriesResponse {
  // The saved queries that matched the search criteria.
  repeated SavedQuery saved_queries = 1;

  // A token to retrieve next page of saved queries.
  // Pass this value in the page_token field in the subsequent call to
  // `SearchSavedQueries` method to retrieve the next page of saved queries.
  string next_page_token = 2;
}

message SavedQuery {
  // The name of the saved query resource, generated by the server.
  // Canonical parent is project.
  // Format: projects/{project}/savedQueries/{savedQuery}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // The project resource name.
  // Format: projects/{project}
  string project = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The database resource name.
  // Format: instances/{instance}/databases/{database}
  // If the database parent doesn't exist, the database field is empty.
  string database = 3;

  // The title of the saved query.
  string title = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.max_len = 200
  ];

  // The creator of the SavedQuery.
  // Format: users/{email}
  string creator = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The create time of the saved query.
  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The last update time of the saved query.
  google.protobuf.Timestamp update_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The content of the saved query.
  // By default, it will be cut off in SearchSavedQueries() method. If it doesn't match the `content_size`, you can
  // use GetSavedQuery() request to retrieve the full content.
  bytes content = 8 [(google.api.field_behavior) = REQUIRED];

  // content_size is the full size of the content, may not match the size of the `content` field.
  int64 content_size = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  enum Visibility {
    VISIBILITY_UNSPECIFIED = 0;
    // Read access in project scope, saved query OWNER/DBA and project OWNER can read/write, other project members can read.
    PROJECT_READ = 1;
    // Write access in project scope, saved query OWNER/DBA and all members in the project can write the saved query.
    PROJECT_WRITE = 2;
    // Private, only saved query OWNER can read/write.
    PRIVATE = 3;
  }
  Visibility visibility = 10 [(google.api.field_behavior) = REQUIRED];

  // starred indicates whether the saved query is starred by the current authenticated user.
  bool starred = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  repeated string folders = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}
