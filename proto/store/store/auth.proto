syntax = "proto3";

package bytebase.store;

option go_package = "generated-go/store";

// EmailVerificationCodePurpose distinguishes login codes from password reset codes.
// Stored as the enum name string in email_verification_code.purpose column.
enum EmailVerificationCodePurpose {
  EMAIL_VERIFICATION_CODE_PURPOSE_UNSPECIFIED = 0;
  LOGIN = 1;
  PASSWORD_RESET = 2;
  // Re-authentication proof for a credential change
  // (CredentialProof.email_code). Never accepted by Login.
  REAUTH = 3;
}

// LoginAttemptKind names which credential's attempt limit a login_attempt row
// tracks. Stored as the enum name string in login_attempt.kind column.
enum LoginAttemptKind {
  LOGIN_ATTEMPT_KIND_UNSPECIFIED = 0;
  PASSWORD = 1;
  EMAIL_CODE = 2;
  MFA = 3;
}
