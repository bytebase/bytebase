syntax = "proto3";

package bytebase.store;

option go_package = "generated-go/store";

message SavedQueryPayload {
  // The connected database, stored as its canonical resource name:
  // instances/{instance}/databases/{database} for a workspace instance,
  // projects/{project}/instances/{instance}/databases/{database} for a
  // project instance. Validated against the saved query's own project at
  // write time; the reference is soft and may dangle after the database
  // is deleted or transferred, degrading to "no database" in the UI.
  string database = 1;
}

// One grant on a saved query. Stored in saved_query.bindings, which holds a
// protojson array of these messages at the jsonb root rather than a wrapper
// object, so the `@>` containment probes the access queries run hit the GIN
// index directly.
message SavedQueryBinding {
  enum Level {
    LEVEL_UNSPECIFIED = 0;
    VIEWER = 1;
    EDITOR = 2;
  }

  Level level = 1;

  // Principals in the same resource-name form the IAM policy payloads use:
  // "users/{email}" and "groups/{email}". The v1 API takes the binding form
  // ("user:", "group:") and converts once on write, as the project policy
  // does. Groups are named by reference and never expanded.
  repeated string members = 2;
}
