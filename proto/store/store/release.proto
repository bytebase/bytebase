syntax = "proto3";

package bytebase.store;

import "store/common.proto";

option go_package = "generated-go/store";

message ReleasePayload {
  reserved 1;
  repeated File files = 2;

  VCSSource vcs_source = 3;

  SchemaChangeType type = 4;

  message File {
    reserved 1, 3, 5;
    // The path of the file, e.g., `2.2/V0001_create_table.sql`.
    string path = 2;
    // The SHA256 hash of the sheet content (hex-encoded).
    string sheet_sha256 = 4;
    string version = 6;
  }

  message VCSSource {
    VCSType vcs_type = 1;
    string url = 2;
    string commit_sha = 3;
    string branch = 4;
    string commit_title = 5;
    string author_name = 6;
    string author_login = 7;
    PullRequest pull_request = 8;

    message PullRequest {
      string url = 1;
      int64 number = 2;
      string title = 3;
    }
  }
}
