peerDependencyRules:
  allowedVersions:
    typescript: '6'

catalog:
  dompurify: 3.4.13

overrides:
  # `@codingame/monaco-vscode-api` pins an exact dompurify version that lags
  # behind security patches (GHSA-55q2-fjhq-7xh7, fixed in 3.4.13), shipping a
  # second vulnerable copy in the Monaco bundle. The override forces every
  # transitive copy to the catalog version, which the direct dependency also
  # references, so the two can't drift apart again.
  dompurify: 'catalog:'

allowBuilds:
  # code-inspector-plugin v2 adds an optional "terminal mode" backed by the
  # node-pty native module (optionalDependency of @code-inspector/core).
  # We only use the click-to-open-in-IDE flow; both build scripts exist
  # solely for terminal mode — node-pty's node-gyp compile and core's
  # postinstall probe of that binding — and the plugin disables terminal
  # mode gracefully when node-pty is unavailable. Explicit `false` skips
  # the builds without triggering ERR_PNPM_IGNORED_BUILDS.
  '@code-inspector/core': false
  core-js: true
  esbuild: true
  # `pouchdb` pulls leveldown in transitively (leveldown@5.6.0 via
  # level@6.0.1, plus leveldown@6.1.1 directly) for Node-side use, but
  # the frontend only runs pouchdb in the browser via `level-js`/IndexedDB
  # — the native binding is never loaded at runtime. leveldown@5.6.0 is
  # deprecated and fails to build on Node 24 / Apple Silicon. Explicit
  # `false` opts out of the build without triggering pnpm 11's
  # ERR_PNPM_IGNORED_BUILDS error.
  leveldown: false
  # See the @code-inspector/core comment above.
  node-pty: false
