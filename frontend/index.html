<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/*" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Links in untrusted text, such as review results, must not resolve
         their hosts before a click: a hostname can carry that text. -->
    <meta http-equiv="x-dns-prefetch-control" content="off" />
    <title>Bytebase</title>
    <meta name="color-scheme" content="light only" />
  </head>

  <body class="text-base bg-white!">
    <div id="app"></div>
    <!-- React app root for globally-portaled surfaces (AgentWindow,
         SessionExpiredSurface, Toaster). Visually empty; children portal
         into getLayerRoot(...). -->
    <div id="react-app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
